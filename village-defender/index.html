<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Village Defender</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; }
#overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.75);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:white; font-family:monospace; cursor:pointer; z-index:20; gap:10px;
}
#overlay h1 { font-size:2.5rem; color:#4ecca3; }
#overlay p  { font-size:13px; color:#aaa; }
#ui {
  position:fixed; top:10px; left:10px; color:white; font-family:monospace;
  font-size:14px; pointer-events:none; z-index:10; line-height:1.8;
}
#crosshair {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  color:white; font-size:26px; z-index:10; pointer-events:none;
  text-shadow:1px 1px 2px black;
}
#hotbar {
  position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
  display:flex; gap:4px; z-index:10;
}
.hslot {
  width:50px; height:50px; background:rgba(0,0,0,0.6);
  border:2px solid #666; border-radius:3px;
  position:relative; display:flex; align-items:center; justify-content:center;
}
.hslot.sel { border-color:#fff; background:rgba(255,255,255,0.15); }
.sicon  { width:30px; height:30px; border-radius:2px; }
.scount { position:absolute; bottom:2px; right:3px; color:#fff; font-size:10px; font-family:monospace; text-shadow:1px 1px black; }
#minebar {
  position:fixed; top:57%; left:50%; transform:translateX(-50%);
  width:180px; height:10px; background:rgba(0,0,0,0.5);
  border:1px solid #aaa; border-radius:5px; display:none; z-index:10;
}
#minefill { height:100%; background:#f80; border-radius:5px; width:0%; }
</style>
</head><body>
<div id="overlay">
  <h1>&#9876;&#65039; VILLAGE DEFENDER</h1>
  <p>Click to start</p>
  <p>WASD / Arrows = move &nbsp;|&nbsp; Space = jump</p>
  <p>Hold Left Click = mine &nbsp;|&nbsp; Right Click = place block</p>
  <p>F = eat food &nbsp;|&nbsp; 1&#8211;9 = hotbar slots</p>
</div>
<div id="ui">
  <div id="hearts"></div>
  <div id="hunger"></div>
  <div id="info"></div>
  <div id="depth"></div>
</div>
<div id="crosshair">+</div>
<div id="hotbar"></div>
<div id="minebar"><div id="minefill"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body></html>
