<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Village Defender</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #ui {
      position: fixed; top: 10px; left: 10px;
      color: white; font-family: monospace; font-size: 14px;
      pointer-events: none; z-index: 10;
    }
    #hearts { font-size: 22px; margin-bottom: 4px; }
    #status { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; }
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-size: 28px; font-weight: bold;
      pointer-events: none; z-index: 10;
      text-shadow: 1px 1px 2px black;
    }
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      color: white; font-family: monospace;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; z-index: 20; gap: 12px;
    }
    #overlay h1 { font-size: 2.5rem; color: #4ecca3; }
    #overlay p  { font-size: 1rem; color: #aaa; }
    #hotbar {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
      pointer-events: none; z-index: 10;
    }
    .slot {
      width: 48px; height: 48px; border: 2px solid #888;
      border-radius: 4px; display: flex;
      align-items: center; justify-content: center;
      font-size: 10px; color: white; font-family: monospace;
      background: rgba(0,0,0,0.5);
    }
    .slot.selected { border-color: white; background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div id="ui">
    <div id="hearts"></div>
    <div id="status"></div>
  </div>
  <div id="crosshair">+</div>
  <div id="overlay">
    <h1>Village Defender</h1>
    <p>Click to start</p>
    <p>WASD = move &nbsp;|&nbsp; Space = jump &nbsp;|&nbsp; Mouse = look</p>
    <p>Left click = place block &nbsp;|&nbsp; Right click = break / punch</p>
    <p>1-4 = change block type</p>
  </div>
  <div id="hotbar">
    <div class="slot selected" id="slot0">Cobble</div>
    <div class="slot" id="slot1">Planks</div>
    <div class="slot" id="slot2">Dirt</div>
    <div class="slot" id="slot3">Sand</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
