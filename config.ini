[hardware]
spi_bus = 0
rfid_ce_pin = 8
cc1101_ce_pin = 7
ir_rx_pin = 24
ir_tx_pin = 18
btn_up = 17
btn_down = 27
btn_select = 22
btn_back = 5
oled_i2c_address = 0x3C
oled_i2c_port = 1
pigpio_host = localhost
sonar_trig_pin = 23
sonar_echo_pin = 25
sonar_servo_pin = 12
sonar_max_range_cm = 300

[storage]
data_dir = /home/user/eamonnn/data

[badusb]
hid_device = /dev/hidg0
default_layout = US

[subghz]
default_frequency = 433.92
default_modulation = ASK_OOK
default_baud = 4800
