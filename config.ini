[hardware]
spi_bus = 0
# GPIO8/7 are used by the 3.5" TFT HAT (LCD/touch chip-select)
rfid_ce_pin = 5
cc1101_ce_pin = 6
# GPIO24/18 are used by the TFT HAT (DC line / backlight)
ir_rx_pin = 23
ir_tx_pin = 12
btn_up = 17
btn_down = 27
btn_select = 22
# GPIO5 moved to RFID, so back button is on GPIO16
btn_back = 16
oled_i2c_address = 0x3C
oled_i2c_port = 1
pigpio_host = localhost

[bluenet]
device_name = PiFlip
discovery_port = 42424
message_port = 42425
hotspot_ssid = PiFlip-Mesh
hotspot_password = piflip123

[storage]
data_dir = /home/user/eamonnn/data

[badusb]
hid_device = /dev/hidg0
default_layout = US

[subghz]
default_frequency = 433.92
default_modulation = ASK_OOK
default_baud = 4800
