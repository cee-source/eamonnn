// DAY / NIGHT CYCLE
// ═══════════════════════════════════════════════════════════════
function tickDayNight(dt){
  _dayT=(_dayT+dt)%DAY_LENGTH;
  const n=nightness();
  _ambLight.intensity = 0.55-n*0.40;
  _ambLight.color.setRGB(0.40+(1-n)*0.22, 0.53+(1-n)*0.18, 0.73+(1-n)*0.04);
  sun.intensity = 2.0-n*1.65;
  scene.fog.density = 0.045+n*0.038;
}

// ═══════════════════════════════════════════════════════════════
// VILLAGER AI
// ═══════════════════════════════════════════════════════════════
const VILLAGER_SPD        = 1.7;
const VILLAGER_SPD_SPRINT = 4.5;

function getCraftsmanBonus(){
  let bonus=0;
  for(const v of villagers){
    if(v.type!=='craftsman') continue;
    const dx=v.mesh.position.x-FORGE_WP.x, dz=v.mesh.position.z-FORGE_WP.z;
    if(dx*dx+dz*dz<(CS*1.6)*(CS*1.6)) bonus+=0.10;
  }
  return bonus;
}

function _talkToVillager(v){
  const underAttack=units.some(u=>{
    if(u.player!==2) return false;
    const dx=u.mesh.position.x-KEEP_POS.x, dz=u.mesh.position.z-KEEP_POS.z;
    return dx*dx+dz*dz<(CS*7)*(CS*7);
  });
  const goldHigh=playerGold>=150;
  let line;
  if(underAttack)     line='We are under attack, m\'lord! Please save us!';
  else if(goldHigh)   line='The coffers are full! The harvest is plentiful!';
  else                line='Life is… tolerable, m\'lord. We endure.';
  chatPrint(`💬 ${v.name}: "${line}"`, 'sys');
  playAt(v.mesh.position.clone(), underAttack?SND_SAD:SND_HAPPY, CS*0.9, 2.5);
}

function tickVillagers(dt){
  // Bell swing animation
  if(_bellMeshRef && _bellRinging){
    _bellSwingT+=dt*6;
    const bc=_bellMeshRef.userData.bellChild;
    if(bc) bc.rotation.z=Math.sin(_bellSwingT)*0.55*Math.exp(-_bellSwingT*0.10);
    _bellTimer-=dt;
    if(_bellTimer<=0){
      _bellRinging=false;
      if(bc) bc.rotation.z=0;
      for(const v of villagers) v.sprinting=false;
    }
  }

  const n=nightness();
  const goToSleep=n>0.62 && !_bellRinging; // start retreating toward 63% night

  for(const v of villagers){
    if(goToSleep){
      // Find shelter if not already assigned
      if(!v._nightShelter){
        let best=KEEP_POS.clone(), bd=Infinity;
        for(const h of houses){
          const dx=h.pos.x-v.mesh.position.x, dz=h.pos.z-v.mesh.position.z;
          const d=dx*dx+dz*dz; if(d<bd){bd=d;best=h.pos.clone();}
        }
        v._nightShelter=best; v.dest=best.clone();
      }
      if(!v.mesh.visible) continue;
      const dx=v.dest.x-v.mesh.position.x, dz=v.dest.z-v.mesh.position.z;
      const dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<0.28){
        v.mesh.visible=false; // tuck inside
      } else {
        const spd=VILLAGER_SPD*dt; const mv=Math.min(spd,dist);
        v.mesh.position.x+=(dx/dist)*mv; v.mesh.position.z+=(dz/dist)*mv;
        v.mesh.rotation.y=Math.atan2(-dx,-dz);
      }
    } else {
      // Daytime or bell rang
      if(v._nightShelter){
        v._nightShelter=null; v.dest=v.workA.clone(); // wake up at workstation
      }
      if(!v.mesh.visible) v.mesh.visible=true;

      // Craftsman hammer animation at forge
      if(v.type==='craftsman'){
        const dx=v.mesh.position.x-FORGE_WP.x, dz=v.mesh.position.z-FORGE_WP.z;
        if(dx*dx+dz*dz<(CS*0.9)*(CS*0.9)){
          const hm=v.mesh.userData.hammerMesh;
          if(hm){
            v._hammerT+=dt;
            hm.position.y=0.52+Math.abs(Math.sin(v._hammerT*3.8))*0.20;
            if(Math.floor(v._hammerT*2)!==Math.floor((v._hammerT-dt)*2)){
              playAt(v.mesh.position.clone(),SND_HAMMER,CS*0.5,4);
            }
          }
        }
      }

      if(!v.dest) v.dest=v.workA.clone();
      const dx=v.dest.x-v.mesh.position.x, dz=v.dest.z-v.mesh.position.z;
      const dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<0.28){
        // Arrived — rest, then pick next waypoint
        v._moveTimer-=dt;
        if(v._moveTimer<=0){
          v._moveTimer=2.5+Math.random()*4.5;
          if(v.sprinting){ v.dest=null; v.sprinting=false; }
          else if(v.type==='commoner'){
            // Wander randomly in P1 town area (cols 0-3, rows 0-4)
            v.dest=new THREE.Vector3(
              Math.random()*3*CS+CS*0.5, 0.4,
              Math.random()*4*CS+CS*0.5);
          } else {
            v.atA=!v.atA;
            v.dest=(v.atA?v.workA:v.workB).clone();
          }
        }
      } else {
        const spd=(v.sprinting?VILLAGER_SPD_SPRINT:VILLAGER_SPD)*dt;
        const mv=Math.min(spd,dist);
        v.mesh.position.x+=(dx/dist)*mv; v.mesh.position.z+=(dz/dist)*mv;
        v.mesh.position.y=0.4+Math.abs(Math.sin(performance.now()*0.006+villagers.indexOf(v)))*0.042;
        v.mesh.rotation.y=Math.atan2(-dx,-dz);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// COMMAND MENU  (/ key → war-room overlay → 1-4 to execute)
// ═══════════════════════════════════════════════════════════════
const _cmdMenuEl  = document.getElementById('cmd-menu');
const _cmdTargetEl= document.getElementById('cmd-target');
let   _cmdVisible = false;
let   _cmdHover   = 0;  // 1-4, for keyboard highlight

const _CMD_ITEMS = [1,2,3,4];

function _cmdUpdateHighlight(n){
  _CMD_ITEMS.forEach(i=>{
    document.getElementById(`cmi-${i}`)
      .classList.toggle('cm-hover', i===n);
  });
}

function _cmdGetTarget(){
  return possessedUnit || selectedUnit || null;
}

function showCmdMenu(){
  const u = _cmdGetTarget();
  _cmdTargetEl.textContent = u ? `▶ ${u.unitName}` : '— no unit selected —';
  _cmdHover = 1;
  _cmdUpdateHighlight(1);
  _cmdMenuEl.classList.add('cmd-visible');
  _cmdVisible = true;
  setHUD('COMMAND MENU — 1-4 to execute | / or Esc to close');
}

function hideCmdMenu(){
  _cmdMenuEl.classList.remove('cmd-visible');
  _cmdVisible = false;
  _cmdUpdateHighlight(0);
  if(ghostLocked) setHUD('WASD move | Mouse look | Click unit/fort to possess | F = unlock');
}

function execCmdMenu(n){
  const u = _cmdGetTarget();
  hideCmdMenu();
  if(!u){ chatPrint('No unit selected — possess or click a unit first','sys'); return; }
  playUI(SND_RADIO_CLICK);
  playAt(u.mesh.position.clone(), SND_CMD, CS, 2);
  switch(n){
    case 1: // Follow Me
      u.dest = camera.position.clone(); u.dest.y = 0; u.combatTarget = null;
      chatPrint(`📡 ${u.unitName} → following Commander`,'sys'); break;
    case 2: // Scout Forward
      u.scouting = true; u.scoutTimer = 30;
      { const a=Math.random()*Math.PI*2;
        u.dest = new THREE.Vector3(
          u.mesh.position.x+Math.cos(a)*CS*6, 0,
          u.mesh.position.z+Math.sin(a)*CS*6); }
      chatPrint(`📡 ${u.unitName} → scouting (30s)`,'sys'); break;
    case 3: // Attack Nearest
      { let nearest=null, nd=Infinity;
        for(const e of units){
          if(e.player===u.player) continue;
          const dx=e.mesh.position.x-u.mesh.position.x, dz=e.mesh.position.z-u.mesh.position.z;
          const d=dx*dx+dz*dz; if(d<nd){nd=d;nearest=e;}
        }
        if(nearest){ u.dest=nearest.mesh.position.clone(); u.combatTarget=null;
          chatPrint(`📡 ${u.unitName} → engaging nearest enemy`,'sys'); }
        else chatPrint('No enemies in range','sys'); }
      break;
    case 4: // Retreat to Town
      { const hq = u.player===1
          ? new THREE.Vector3(CS*0+CS/2,0,CS*0+CS/2)
          : new THREE.Vector3(CS*12+CS/2,0,CS*9+CS/2);
        u.combatTarget=null; u.dest=hq.clone();
        chatPrint(`📡 ${u.unitName} → retreating to Town`,'sys'); }
      break;
  }
}

// ─── Grain overlay animation ──────────────────────────────────
const _grainCtx = document.getElementById('grain-overlay').getContext('2d');
let _grainFrame = 0;
function _updateGrain(){
  if(++_grainFrame % 5 !== 0) return;  // ~12fps refresh keeps it subtle
  const id = _grainCtx.createImageData(256, 256);
  const d  = id.data;
  for(let i = 0; i < d.length; i += 4){
    const v = Math.random() * 255 | 0;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
  _grainCtx.putImageData(id, 0, 0);
}

// ─── Animate ──────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  // Flag wave
  flagMeshes.forEach((f,i)=>{ f.rotation.y = Math.sin(t*1.8+i*1.3)*0.25; });

  // Ring pulse
  if(selRing.visible){
    const p = 0.92 + Math.sin(t*4)*0.08;
    selRing.scale.set(p,p,p);
    selRing.material.opacity = 0.6 + Math.sin(t*4)*0.3;
  }

  // Mana recharge (only when not actively firing)
  if(playerMana < MAX_MANA){ playerMana = Math.min(MAX_MANA, playerMana + MANA_REGEN * dt); }
  updateAmmoBar();

  tickPlayerShots(dt);
  tickSparks(dt);
  tickUnitCombat(dt);
  tickUnitShots(dt);
  tickHPBars();
  tickStaminaBars();
  tickUnitMovement(dt);
  tickScout(dt);
  tickTNT(dt, t);
  tickShockwaves(dt);
  tickForts(dt);
  tickArrows(dt);
  tickFireballs(dt);
  tickSpecialUnits(dt);
  tickCombatAudio(dt);
  tickBuilders(dt);
  tickOilCauldrons(dt);
  tickSpikeTraps();
  tickDayNight(dt);
  tickVillagers(dt);
  tickFogOfWar();
  tickIntel();
  tickTerrainReveal();
  drawMiniMap();
  for(const u of units){ if(u.isWizard){ if(u.fireballCooldown>0) u.fireballCooldown-=dt; if(u.teleportCooldown>0) u.teleportCooldown-=dt; } }
  updateChunks();
  if(cameraMode==='ghost')        tickGhost(dt);
  else if(cameraMode==='possess') tickPossess(dt);
  // 'fort' mode: camera parented to fort mesh, mousemove handles rotation

  _updateGrain();
  renderer.render(scene, camera);
}
animate();
</script>
