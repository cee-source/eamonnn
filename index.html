<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game of War</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    #status {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.78); border: 1px solid #555; border-radius: 20px;
      padding: 8px 22px; color: #fff; font-size: 0.9rem; pointer-events: none;
      white-space: nowrap;
    }

    #mode-badge {
      position: fixed; top: 14px; left: 14px;
      padding: 5px 15px; border-radius: 20px;
      font-size: 0.78rem; font-weight: bold; letter-spacing: 1px;
      text-transform: uppercase; pointer-events: none;
    }
    #mode-badge.strategy { background: rgba(20,60,160,0.85); border:1px solid #446; color:#aac; }
    #mode-badge.ghost    { background: rgba(110,20,180,0.85); border:1px solid #84c; color:#ddf; }

    /* The one button that triggers pointer lock */
    #ghost-btn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(90,20,160,0.92); border: 2px solid #a060ff;
      border-radius: 12px; color: #fff; font-size: 1rem; padding: 18px 38px;
      cursor: pointer; display: none; z-index: 99;
      box-shadow: 0 0 30px rgba(160,80,255,0.4);
    }
    #ghost-btn:hover { background: rgba(120,40,200,0.95); }

    /* Crosshair */
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 20px; height: 20px; display: none; pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { height: 2px; width: 100%; top: 50%;  transform: translateY(-50%); }

    /* Unit panel */
    #unit-panel {
      position: fixed; bottom: 20px; left: 20px;
      background: rgba(8,8,24,0.92); border: 1px solid #334;
      border-radius: 10px; padding: 14px; min-width: 180px;
      color: #fff; display: none; pointer-events: none;
    }
    #unit-panel h3 { font-size: 0.9rem; color: #aac; margin-bottom: 8px; }
    .stat { display:flex; justify-content:space-between; font-size:0.8rem; margin:3px 0; }
    .sl { color:#778; } .sv { color:#fff; }

    /* Hint */
    #hint {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(0,0,0,0.65); border: 1px solid #333;
      border-radius: 8px; padding: 10px 14px;
      color: #666; font-size: 0.74rem; line-height: 1.9; pointer-events: none;
    }
    #hint b { color:#999; }
    .kbd {
      display:inline-block; background:#1a1a2e; border:1px solid #445;
      border-radius:3px; padding:0 6px; font-family:monospace; color:#ccd; font-size:0.72rem;
    }
  </style>
</head>
<body>

<!-- Ghost-mode enter button (shown when F is pressed, click to lock mouse) -->
<button id="ghost-btn" onclick="lockPointer()">
  👻 Click to Enter Ghost Mode<br>
  <span style="font-size:0.75rem;color:#bbb">Mouse will be captured — Esc to exit</span>
</button>

<div id="crosshair"></div>

<div id="mode-badge" class="strategy">⚔ Strategy</div>
<div id="status">Click a unit · Right-drag to orbit · <b>F</b> = Ghost mode</div>

<div id="unit-panel">
  <h3 id="panel-name">Unit</h3>
  <div class="stat"><span class="sl">Player</span>  <span class="sv" id="panel-player">—</span></div>
  <div class="stat"><span class="sl">Position</span><span class="sv" id="panel-pos">—</span></div>
  <div class="stat"><span class="sl">HP</span>       <span class="sv" id="panel-hp">—</span></div>
</div>

<div id="hint">
  <span id="hint-s"><b>Strategy</b><br>
    Right-drag — orbit<br>Scroll — zoom<br>Left-click — select / move<br>
    <span class="kbd">F</span> — Ghost mode
  </span>
  <span id="hint-g" style="display:none"><b>Ghost</b><br>
    Mouse — look<br>
    <span class="kbd">W A S D</span> — fly<br>
    <span class="kbd">Space</span> rise · <span class="kbd">Shift</span> descend<br>
    <span class="kbd">Esc</span> / <span class="kbd">F</span> — exit
  </span>
</div>

<!-- Only Three.js core from CDN — all controls are written inline below -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ─── Renderer ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Scene & camera ──────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x111122);
scene.fog        = new THREE.FogExp2(0x111122, 0.011);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);

// ─── Lights ──────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const sun = new THREE.DirectionalLight(0xfff5dd, 1.1);
sun.position.set(40, 70, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { near:1, far:220, left:-80, right:80, top:80, bottom:-80 });
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0x8899cc, 0.2), {
  position: new THREE.Vector3(-30, 20, -30)
}));

// ─── Floor 100 × 100 ─────────────────────────────────────────
const GRID = 100;
(function buildFloor() {
  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(GRID, GRID),
    new THREE.MeshLambertMaterial({ color: 0x2b4a1a })
  );
  base.rotation.x = -Math.PI / 2;
  base.position.set(GRID / 2, -0.01, GRID / 2);
  base.receiveShadow = true;
  base.name = 'ground';
  scene.add(base);

  const matA = new THREE.MeshLambertMaterial({ color: 0x375c22 });
  const matB = new THREE.MeshLambertMaterial({ color: 0x2b4a1a });
  const geo  = new THREE.PlaneGeometry(1, 1);
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const t = new THREE.Mesh(geo, (x + z) % 2 === 0 ? matA : matB);
      t.rotation.x = -Math.PI / 2;
      t.position.set(x + 0.5, 0, z + 0.5);
      t.receiveShadow = true;
      t.name = 'tile';
      scene.add(t);
    }
  }

  // Centre dividing line
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(GRID / 2, 0.05, 0),
      new THREE.Vector3(GRID / 2, 0.05, GRID)
    ]),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })
  ));
})();

// ─── Unit class ──────────────────────────────────────────────
const P_COL = {
  1: { body: 0x2255cc, label: '🔵 Player 1' },
  2: { body: 0xcc2222, label: '🔴 Player 2' },
};

class Unit {
  constructor({ type='Infantry', player=1, gridX=0, gridZ=0, hp=5 }) {
    this.type   = type;
    this.player = player;
    this.gridX  = gridX;
    this.gridZ  = gridZ;
    this.hp = this.maxHp = hp;
    this.group  = this._build();
    this._sync();
    scene.add(this.group);
  }
  _build() {
    const c = P_COL[this.player].body, g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.32,0.65,10),
      new THREE.MeshLambertMaterial({color:c}));
    body.position.y = 0.33; body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18,10,10),
      new THREE.MeshLambertMaterial({color:0xffe0b0}));
    head.position.y = 0.82; head.castShadow = true; g.add(head);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.09,6,6),
      new THREE.MeshLambertMaterial({color:c}));
    knob.position.y = 1.04; g.add(knob);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.44,0.05,6,24),
      new THREE.MeshBasicMaterial({color:0xffee00}));
    ring.rotation.x = Math.PI/2; ring.position.y = 0.04;
    ring.visible = false; ring.name = 'ring'; g.add(ring);
    g.userData.unit = this;
    return g;
  }
  _sync() { this.group.position.set(this.gridX+0.5, 0, this.gridZ+0.5); }
  moveTo(x,z) { this.gridX=x; this.gridZ=z; this._sync(); }
  select(on)  { this.group.getObjectByName('ring').visible = on; }
  get posLabel() { return `(${this.gridX}, ${this.gridZ})`; }
}

// Test units
const units = [];
const spawn = cfg => { const u = new Unit(cfg); units.push(u); return u; };
spawn({type:'Infantry',player:1,gridX:10,gridZ:30,hp:5});
spawn({type:'Archer',  player:1,gridX:12,gridZ:45,hp:3});
spawn({type:'Knight',  player:1,gridX:10,gridZ:60,hp:7});
spawn({type:'Infantry',player:2,gridX:85,gridZ:30,hp:5});
spawn({type:'Archer',  player:2,gridX:83,gridZ:45,hp:3});
spawn({type:'Knight',  player:2,gridX:85,gridZ:60,hp:7});

// ═══════════════════════════════════════════════════════════════
// CAMERA MODE  ('strategy' | 'ghost')
// ═══════════════════════════════════════════════════════════════
let cameraMode  = 'strategy';
let ghostLocked = false;          // true when pointer is actually captured

// ─── Strategy: manual orbit ───────────────────────────────────
let orbitTheta  = 0,  orbitPhi  = 0.72, orbitDist = 48;
let tTheta      = 0,  tPhi      = 0.72, tDist     = 48;
const orbitTarget = new THREE.Vector3(GRID/2, 0, GRID/2);
let rightDrag   = false, dragStartX = 0, dragStartY = 0;
let lastRX = 0, lastRY = 0;

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 2 && cameraMode === 'strategy') {
    rightDrag = true; lastRX = e.clientX; lastRY = e.clientY;
  }
});
document.addEventListener('mouseup', e => { if (e.button === 2) rightDrag = false; });
renderer.domElement.addEventListener('wheel', e => {
  if (cameraMode !== 'strategy') return;
  tDist = Math.max(5, Math.min(120, tDist + e.deltaY * 0.05));
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

function tickOrbit() {
  if (rightDrag) {
    // handled in the unified mousemove below
  }
  // Smooth damp toward targets
  orbitTheta += (tTheta - orbitTheta) * 0.1;
  orbitPhi   += (tPhi   - orbitPhi)   * 0.1;
  orbitDist  += (tDist  - orbitDist)  * 0.1;

  camera.position.set(
    orbitTarget.x + orbitDist * Math.sin(orbitPhi) * Math.sin(orbitTheta),
    orbitTarget.y + orbitDist * Math.cos(orbitPhi),
    orbitTarget.z + orbitDist * Math.sin(orbitPhi) * Math.cos(orbitTheta)
  );
  camera.lookAt(orbitTarget);
}

// Initial camera position
camera.position.set(GRID/2, 38, GRID*0.88);
camera.lookAt(orbitTarget);

// ─── Ghost: inline PointerLock + mousemove rotation ──────────
const _euler  = new THREE.Euler(0, 0, 0, 'YXZ');   // YXZ avoids gimbal lock
const _dir    = new THREE.Vector3();
const _right  = new THREE.Vector3();
const _up     = new THREE.Vector3(0, 1, 0);
const keys    = {};

// Mouse look — fires ONLY when pointer is locked
document.addEventListener('mousemove', e => {
  if (cameraMode === 'strategy' && rightDrag) {
    // Orbit drag
    tTheta -= (e.clientX - lastRX) * 0.008;
    tPhi    = Math.max(0.08, Math.min(Math.PI/2 - 0.04, tPhi - (e.clientY - lastRY) * 0.008));
    lastRX  = e.clientX;
    lastRY  = e.clientY;
    return;
  }

  if (!ghostLocked) return;
  // Ghost look
  _euler.setFromQuaternion(camera.quaternion);
  _euler.y -= e.movementX * 0.002;
  _euler.x -= e.movementY * 0.002;
  _euler.x  = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, _euler.x));
  camera.quaternion.setFromEuler(_euler);
});

// Ghost movement each frame
function tickGhost(dt) {
  if (!ghostLocked) return;
  const speed = 22 * (keys['ControlLeft'] || keys['ControlRight'] ? 3.5 : 1) * dt;

  camera.getWorldDirection(_dir);
  _right.crossVectors(_dir, _up).normalize();

  if (keys['KeyW'])                                 camera.position.addScaledVector(_dir,   speed);
  if (keys['KeyS'])                                 camera.position.addScaledVector(_dir,  -speed);
  if (keys['KeyA'])                                 camera.position.addScaledVector(_right,-speed);
  if (keys['KeyD'])                                 camera.position.addScaledVector(_right, speed);
  if (keys['Space'])                                camera.position.y += speed;
  if (keys['ShiftLeft'] || keys['ShiftRight'])      camera.position.y -= speed;

  camera.position.y = Math.max(0.5, camera.position.y);  // soft floor
}

// ─── Pointer Lock API ─────────────────────────────────────────
function lockPointer() {
  document.body.requestPointerLock();
}

document.addEventListener('pointerlockchange', () => {
  ghostLocked = (document.pointerLockElement === document.body);

  if (ghostLocked) {
    // Successfully locked
    document.getElementById('ghost-btn').style.display  = 'none';
    document.getElementById('crosshair').style.display  = 'block';
    setStatus('👻 Ghost Mode  —  WASD fly · Space/Shift up/down · Esc exit');
  } else {
    // Pointer released (Esc or programmatic unlock)
    document.getElementById('crosshair').style.display  = 'none';
    if (cameraMode === 'ghost') {
      // Still in ghost mode but mouse unlocked — show button again so player can re-lock
      document.getElementById('ghost-btn').style.display = 'block';
      setStatus('👻 Ghost Mode — click the button to re-lock mouse, or press F to exit');
    }
  }
});

document.addEventListener('pointerlockerror', () => {
  setStatus('⚠ Pointer lock failed — try clicking directly on the game window first');
});

// ─── F key toggle ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && cameraMode === 'ghost') e.preventDefault();

  if (e.code === 'KeyF') {
    if (cameraMode === 'strategy') {
      // Enter ghost mode
      cameraMode = 'ghost';
      setBadge('ghost');
      document.getElementById('unit-panel').style.display = 'none';
      if (selectedUnit) { selectedUnit.select(false); selectedUnit = null; }
      document.getElementById('hint-s').style.display = 'none';
      document.getElementById('hint-g').style.display = 'block';
      // Show the button — player clicks it to lock the pointer
      document.getElementById('ghost-btn').style.display = 'block';
      setStatus('👻 Ghost Mode — click the button to capture your mouse');
    } else {
      // Exit ghost mode
      exitGhost();
    }
  }

  // Esc while pointer unlocked and still in ghost → fully exit
  if (e.code === 'Escape' && cameraMode === 'ghost' && !ghostLocked) {
    exitGhost();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function exitGhost() {
  if (document.pointerLockElement) document.exitPointerLock();
  cameraMode  = 'strategy';
  ghostLocked = false;
  document.getElementById('ghost-btn').style.display  = 'none';
  document.getElementById('crosshair').style.display  = 'none';
  document.getElementById('hint-s').style.display     = 'block';
  document.getElementById('hint-g').style.display     = 'none';
  setBadge('strategy');
  setStatus('Strategy Mode — click a unit · right-drag to orbit · F = Ghost mode');
  // Sync orbit camera angles from wherever ghost left off
  const p = camera.position;
  const dx = p.x - orbitTarget.x, dy = p.y - orbitTarget.y, dz = p.z - orbitTarget.z;
  orbitDist  = tDist  = Math.sqrt(dx*dx+dy*dy+dz*dz);
  orbitTheta = tTheta = Math.atan2(dx, dz);
  orbitPhi   = tPhi   = Math.acos(Math.max(-1, Math.min(1, dy / orbitDist)));
}

// ═══════════════════════════════════════════════════════════════
// UNIT SELECTION & MOVEMENT  (strategy mode only)
// ═══════════════════════════════════════════════════════════════
let selectedUnit = null;
const raycaster  = new THREE.Raycaster();
const mouse2     = new THREE.Vector2();
let clickMoved   = false, clickDownX = 0, clickDownY = 0;

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0) { clickDownX = e.clientX; clickDownY = e.clientY; clickMoved = false; }
});
document.addEventListener('mousemove', e => {
  if (e.buttons & 1) {
    if (Math.hypot(e.clientX-clickDownX, e.clientY-clickDownY) > 5) clickMoved = true;
  }
});

renderer.domElement.addEventListener('click', e => {
  if (e.button !== 0 || clickMoved || cameraMode !== 'strategy') return;

  mouse2.x =  (e.clientX / innerWidth)  * 2 - 1;
  mouse2.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse2, camera);

  // Hit a unit mesh?
  const unitMeshes = units.flatMap(u =>
    u.group.children.filter(c => c.isMesh && c.name !== 'ring')
  );
  const uh = raycaster.intersectObjects(unitMeshes, false);
  if (uh.length) {
    const hit = uh[0].object.parent.userData.unit;
    if (!hit) return;
    if (selectedUnit && selectedUnit !== hit) selectedUnit.select(false);
    selectedUnit = hit;
    selectedUnit.select(true);
    showPanel(selectedUnit);
    setStatus(`Selected ${hit.type} (P${hit.player}) — click ground to move`);
    return;
  }

  // Hit the ground → move selected unit
  if (selectedUnit) {
    const gObjs = scene.children.filter(o => o.name === 'ground' || o.name === 'tile');
    const gh = raycaster.intersectObjects(gObjs, false);
    if (gh.length) {
      const pt = gh[0].point;
      const gx = Math.floor(pt.x), gz = Math.floor(pt.z);
      if (gx >= 0 && gz >= 0 && gx < GRID && gz < GRID) {
        selectedUnit.moveTo(gx, gz);
        showPanel(selectedUnit);
        setStatus(`Moved ${selectedUnit.type} → (${gx}, ${gz})`);
        return;
      }
    }
  }

  // Empty click — deselect
  if (selectedUnit) {
    selectedUnit.select(false);
    selectedUnit = null;
    document.getElementById('unit-panel').style.display = 'none';
    setStatus('Click a unit · right-drag to orbit · F = Ghost mode');
  }
});

// ─── UI helpers ───────────────────────────────────────────────
function setStatus(msg) { document.getElementById('status').innerHTML = msg; }
function setBadge(mode) {
  const b = document.getElementById('mode-badge');
  b.className   = mode;
  b.textContent = mode === 'strategy' ? '⚔ Strategy' : '👻 Ghost';
}
function showPanel(u) {
  const p = document.getElementById('unit-panel');
  p.style.display = 'block';
  document.getElementById('panel-name').textContent   = u.type;
  document.getElementById('panel-player').textContent = P_COL[u.player].label;
  document.getElementById('panel-pos').textContent    = u.posLabel;
  document.getElementById('panel-hp').textContent     = `${u.hp} / ${u.maxHp}`;
}

// ─── Render loop ──────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1); // cap dt so tab-switch doesn't teleport

  if (cameraMode === 'strategy') {
    tickOrbit();
    if (selectedUnit)
      selectedUnit.group.position.y = Math.sin(clock.getElapsedTime() * 3) * 0.07;
  } else {
    tickGhost(dt);
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
