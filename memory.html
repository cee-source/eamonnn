<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .memory-board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            margin: 20px auto;
            width: fit-content;
        }

        .memory-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: transform 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
        }

        .memory-card:hover {
            transform: scale(1.05);
        }

        .memory-card.flipped {
            background: white;
            border: 3px solid #667eea;
        }

        .memory-card.matched {
            background: #48c774;
            border: 3px solid #48c774;
            cursor: default;
            opacity: 0.7;
        }

        .memory-card .card-front {
            display: none;
        }

        .memory-card.flipped .card-front,
        .memory-card.matched .card-front {
            display: block;
        }

        .memory-card .card-back {
            color: white;
            font-size: 2rem;
        }

        .memory-card.flipped .card-back,
        .memory-card.matched .card-back {
            display: none;
        }

        .difficulty-selector {
            text-align: center;
            margin-bottom: 20px;
        }

        .diff-btn {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .diff-btn.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 480px) {
            .memory-board {
                grid-template-columns: repeat(4, 70px);
                grid-template-rows: repeat(4, 70px);
                gap: 8px;
            }

            .memory-card {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-container">
            <div class="game-header">
                <h1 class="game-title">🃏 Memory Match</h1>
                <a href="index.html" class="back-button">← Back to Menu</a>
            </div>

            <div class="game-info">
                <div class="info-item">
                    <span class="info-label">Moves</span>
                    <span class="info-value" id="moves">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Matches</span>
                    <span class="info-value" id="matches">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Best Score</span>
                    <span class="info-value" id="bestScore">-</span>
                </div>
            </div>

            <div class="difficulty-selector">
                <button class="diff-btn active" id="easyBtn">Easy (8 pairs)</button>
                <button class="diff-btn" id="hardBtn">Hard (12 pairs)</button>
            </div>

            <div class="memory-board" id="memoryBoard"></div>

            <div class="game-controls">
                <button class="btn" id="newGameBtn">New Game</button>
            </div>

            <div class="instructions">
                <h3>How to Play</h3>
                <ul>
                    <li>Click on cards to flip them over</li>
                    <li>Find matching pairs of emojis</li>
                    <li>Match all pairs in as few moves as possible</li>
                    <li>Choose between Easy (8 pairs) or Hard (12 pairs) mode</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const board = document.getElementById('memoryBoard');
        const movesElement = document.getElementById('moves');
        const matchesElement = document.getElementById('matches');
        const bestScoreElement = document.getElementById('bestScore');
        const newGameBtn = document.getElementById('newGameBtn');
        const easyBtn = document.getElementById('easyBtn');
        const hardBtn = document.getElementById('hardBtn');

        const easyEmojis = ['🎮', '🎯', '🎲', '🎪', '🎨', '🎭', '🎬', '🎸'];
        const hardEmojis = ['🎮', '🎯', '🎲', '🎪', '🎨', '🎭', '🎬', '🎸', '🎹', '🎺', '🎻', '🎼'];

        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matches = 0;
        let difficulty = 'easy';
        let canFlip = true;

        function initGame() {
            moves = 0;
            matches = 0;
            flippedCards = [];
            canFlip = true;
            movesElement.textContent = moves;
            matchesElement.textContent = matches;

            const emojis = difficulty === 'easy' ? easyEmojis : hardEmojis;
            const pairs = difficulty === 'easy' ? 8 : 12;

            cards = [...emojis, ...emojis]
                .sort(() => Math.random() - 0.5);

            board.innerHTML = '';

            if (difficulty === 'hard') {
                board.style.gridTemplateColumns = 'repeat(4, 100px)';
                board.style.gridTemplateRows = 'repeat(6, 100px)';
            } else {
                board.style.gridTemplateColumns = 'repeat(4, 100px)';
                board.style.gridTemplateRows = 'repeat(4, 100px)';
            }

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.emoji = emoji;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-back">?</div>
                    <div class="card-front">${emoji}</div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });

            updateBestScore();
        }

        function flipCard() {
            if (!canFlip) return;

            const card = this;

            if (card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                canFlip = false;
                moves++;
                movesElement.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const emoji1 = card1.dataset.emoji;
            const emoji2 = card2.dataset.emoji;

            if (emoji1 === emoji2) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                matchesElement.textContent = matches;
                flippedCards = [];
                canFlip = true;

                const totalPairs = difficulty === 'easy' ? 8 : 12;
                if (matches === totalPairs) {
                    setTimeout(gameWon, 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        function gameWon() {
            const bestKey = `memoryBest${difficulty}`;
            const currentBest = localStorage.getItem(bestKey);

            if (!currentBest || moves < parseInt(currentBest)) {
                localStorage.setItem(bestKey, moves);
                alert(`🎉 You won in ${moves} moves! New best score!`);
            } else {
                alert(`🎉 You won in ${moves} moves!`);
            }

            updateBestScore();
        }

        function updateBestScore() {
            const bestKey = `memoryBest${difficulty}`;
            const best = localStorage.getItem(bestKey);
            bestScoreElement.textContent = best || '-';
        }

        function setDifficulty(diff) {
            difficulty = diff;
            if (diff === 'easy') {
                easyBtn.classList.add('active');
                hardBtn.classList.remove('active');
            } else {
                hardBtn.classList.add('active');
                easyBtn.classList.remove('active');
            }
            initGame();
        }

        newGameBtn.addEventListener('click', initGame);
        easyBtn.addEventListener('click', () => setDifficulty('easy'));
        hardBtn.addEventListener('click', () => setDifficulty('hard'));

        initGame();
    </script>
</body>
</html>
