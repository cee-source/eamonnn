<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipKit Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root {
  --bg:      #07090D;
  --sidebar: #0E1724;
  --main:    #0A1322;
  --chrome:  #1A2434;
  --trace:   #1FCC7C;
  --amber:   #F5A623;
  --red:     #FF5F5F;
  --border:  rgba(255,255,255,.06);
  --fg:      #DDE3EA;
  --mono:    'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: linear-gradient(145deg, #050810 0%, #090f1e 50%, #060d18 100%); color: var(--fg); font-family: var(--mono); font-size: 13px; }
html::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 55% 45% at 18% 20%, rgba(31,204,124,.13) 0%, transparent 65%), radial-gradient(ellipse 45% 45% at 82% 80%, rgba(20,100,255,.1) 0%, transparent 65%), radial-gradient(ellipse 30% 30% at 70% 10%, rgba(180,60,255,.06) 0%, transparent 60%); pointer-events: none; z-index: 0; }
.layout { display: flex; height: 100vh; position: relative; z-index: 1; }

/* Sidebar */
.sidebar { width: 118px; flex-shrink: 0; background: rgba(8,14,28,.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.brand { height: 44px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 700; letter-spacing: .15em; color: var(--trace); }
nav { flex: 1; padding: 5px 0; overflow-y: auto; }
.nav-item { display: flex; align-items: center; padding: 7px 12px; color: rgba(255,255,255,.38); cursor: pointer; border-left: 2px solid transparent; font-size: 11px; letter-spacing: .04em; transition: color .12s, background .12s; user-select: none; gap: 6px; }
.nav-item:hover { color: rgba(255,255,255,.65); background: rgba(255,255,255,.03); }
.nav-item.active { color: var(--trace); background: rgba(31,204,124,.09); border-left-color: var(--trace); box-shadow: inset 0 0 18px rgba(31,204,124,.05); }
.nav-hw { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.12); margin-left: auto; flex-shrink: 0; }
.nav-hw.ok { background: var(--trace); }
.nav-hw.na { background: rgba(255,80,80,.5); }
.nav-sep { height: 1px; background: var(--border); margin: 5px 10px; }
.nav-label { font-size: 8px; letter-spacing: .2em; color: rgba(255,255,255,.18); padding: 4px 12px 2px; text-transform: uppercase; }

/* Main */
.main { flex: 1; background: rgba(6,12,24,.55); display: flex; flex-direction: column; overflow: hidden; }
.toolbar { height: 42px; background: rgba(14,22,40,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
.toolbar-title { font-size: 12px; font-weight: 700; letter-spacing: .07em; color: rgba(255,255,255,.8); }
.badge { font-size: 9px; letter-spacing: .1em; padding: 2px 8px; border-radius: 2px; }
.badge-ready { background: rgba(31,204,124,.12); color: var(--trace); border: 1px solid rgba(31,204,124,.25); }
.badge-idle  { background: rgba(255,255,255,.04); color: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.1); }
.badge-on    { background: rgba(245,166,35,.1); color: var(--amber); border: 1px solid rgba(245,166,35,.25); }
.badge-err   { background: rgba(255,80,80,.1); color: var(--red); border: 1px solid rgba(255,80,80,.25); }
.badge-nohw  { background: rgba(255,80,80,.07); color: rgba(255,80,80,.5); border: 1px solid rgba(255,80,80,.15); }

.panel { flex: 1; padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

/* Cards */
.card { background: rgba(255,255,255,.028); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.07); border-radius: 6px; padding: 14px 16px; }
.card-title { font-size: 9px; letter-spacing: .2em; color: rgba(255,255,255,.22); margin-bottom: 10px; text-transform: uppercase; }
.stat-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; }
.sk { font-size: 10px; color: rgba(255,255,255,.28); line-height: 1.9; }
.sv { font-size: 10px; color: rgba(255,255,255,.65); line-height: 1.9; }
.sv.hi { color: var(--trace); }

/* No-hardware notice */
.nohw-notice { text-align: center; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.nohw-icon { font-size: 28px; opacity: .3; }
.nohw-title { font-size: 11px; color: rgba(255,255,255,.4); letter-spacing: .1em; }
.nohw-sub { font-size: 10px; color: rgba(255,255,255,.2); line-height: 1.6; max-width: 240px; text-align: center; }

/* Inputs */
.field-row { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 9px; letter-spacing: .15em; color: rgba(255,255,255,.25); text-transform: uppercase; }
input.fk-input, input.ssid-input {
  background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1); border-radius: 3px;
  padding: 7px 10px; font-family: var(--mono); font-size: 11px;
  color: rgba(255,255,255,.75); outline: none; width: 100%;
}
input.fk-input:focus, input.ssid-input:focus { border-color: rgba(31,204,124,.4); }

/* Buttons */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 7px 16px; border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; border: 1px solid; transition: background .15s; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-p { background: rgba(31,204,124,.1); border-color: rgba(31,204,124,.3); color: var(--trace); }
.btn-p:not(:disabled):hover { background: rgba(31,204,124,.2); }
.btn-d { background: rgba(255,80,80,.08); border-color: rgba(255,80,80,.25); color: var(--red); }
.btn-d:not(:disabled):hover { background: rgba(255,80,80,.16); }
.btn-s { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.1); color: rgba(255,255,255,.4); }
.btn-amber { background: rgba(245,166,35,.08); border-color: rgba(245,166,35,.25); color: var(--amber); }
.btn-amber:not(:disabled):hover { background: rgba(245,166,35,.15); }

/* Log */
.log { background: rgba(3,6,12,.82); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.06); border-radius: 4px; padding: 10px 12px; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.log-row { font-size: 10px; color: rgba(255,255,255,.25); line-height: 1.6; }
.log-row.fresh { color: rgba(31,204,124,.65); }
.log-row.err { color: rgba(255,80,80,.65); }
.log-row.warn { color: rgba(245,166,35,.65); }
.log-empty { color: rgba(255,255,255,.12); font-style: italic; }

/* Table */
.results { width: 100%; border-collapse: collapse; font-size: 10px; }
.results th { text-align: left; padding: 5px 10px; color: rgba(255,255,255,.22); letter-spacing: .12em; font-size: 9px; border-bottom: 1px solid var(--border); }
.results td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.03); color: rgba(255,255,255,.6); }
.results tr:last-child td { border-bottom: none; }
.results tr:hover td { background: rgba(255,255,255,.02); }
.rssi-cell { color: var(--trace); }
.enc-wpa { color: var(--amber); }
.enc-open { color: rgba(255,80,80,.7); }

/* Signal bar */
.sig-bar { display: flex; align-items: center; gap: 5px; }
.sig-track { width: 46px; height: 3px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden; }
.sig-fill { height: 100%; background: var(--trace); border-radius: 2px; }

/* Dial pad */
.dial-wrap { display: flex; gap: 8px; align-items: center; }
.dial-wrap input { flex: 1; }
.call-status-row { display: flex; align-items: center; gap: 10px; }
.call-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.12); flex-shrink: 0; }
.call-dot.on { background: var(--trace); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.call-id { font-size: 10px; color: rgba(255,255,255,.4); }

.spinner { display: inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hr { height: 1px; background: var(--border); }

/* Tor indicator */
.tor-row { display: flex; align-items: center; gap: 8px; font-size: 10px; }
.tor-dot { width: 6px; height: 6px; border-radius: 50%; }
.tor-dot.on { background: var(--trace); }
.tor-dot.off { background: rgba(255,80,80,.5); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">FK</div>
    <nav id="nav">
      <div class="nav-label">Active</div>
      <div class="nav-item active" data-tool="ble">BLE<span class="nav-hw ok"></span></div>
      <div class="nav-item" data-tool="wifi">WiFi<span class="nav-hw ok"></span></div>
      <div class="nav-item" data-tool="lure">Lure Trap<span class="nav-hw ok"></span></div>
      <div class="nav-item" data-tool="call">Calling<span class="nav-hw" id="hw-tor"></span></div>
      <div class="nav-item" data-tool="bluenet">BlueNet<span class="nav-hw ok"></span></div>
      <div class="nav-item" data-tool="popups">Popups<span class="nav-hw ok"></span></div>
      <div class="nav-item" data-tool="games">🕹 Games<span class="nav-hw ok"></span></div>
      <div class="nav-sep"></div>
      <div class="nav-label">Hardware</div>
      <div class="nav-item" data-tool="rfid">RFID<span class="nav-hw na" id="hw-rfid"></span></div>
      <div class="nav-item" data-tool="subghz">Sub-GHz<span class="nav-hw na" id="hw-subghz"></span></div>
      <div class="nav-item" data-tool="camera">Camera<span class="nav-hw na" id="hw-camera"></span></div>
      <div class="nav-item" data-tool="nfc">NFC<span class="nav-hw na" id="hw-nfc"></span></div>
      <div class="nav-item" data-tool="ir">IR<span class="nav-hw na" id="hw-ir"></span></div>
      <div class="nav-item" data-tool="badusb">BadUSB<span class="nav-hw na" id="hw-badusb"></span></div>
    </nav>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
var activeTool = 'ble';
var scanning = false;
var hwStatus = {};

/* ── Hardware poll ─────────────────────────────── */
function pollHW() {
  fetch('/api/hw/status').then(function(r){return r.json();}).then(function(d){
    hwStatus = d;
    setHWDot('rfid',   d.rfid);
    setHWDot('subghz', d.subghz);
    setHWDot('camera', d.camera);
    setHWDot('nfc',    d.nfc);
    setHWDot('ir',     d.ir);
    setHWDot('tor',    d.tor);
  }).catch(function(){});
}
function setHWDot(id, present) {
  var el = document.getElementById('hw-' + id);
  if (!el) return;
  el.className = 'nav-hw ' + (present ? 'ok' : 'na');
}
pollHW();
setInterval(pollHW, 8000);

/* ── Render panels ─────────────────────────────── */
function noHW(icon, name, chip, notes) {
  return '<div class="nohw-notice"><div class="nohw-icon">'+icon+'</div>' +
    '<div class="nohw-title">'+name+' — NO HARDWARE</div>' +
    '<div class="nohw-sub">Connect a <strong>'+chip+'</strong> via SPI/GPIO.<br>'+notes+'</div></div>';
}

var panels = {
  ble: function(){ return `
    <div class="card"><div class="card-title">Info</div>
      <div class="stat-grid">
        <span class="sk">Chip</span><span class="sv hi">CYW43455 (Pi 5)</span>
        <span class="sk">Standard</span><span class="sv">Bluetooth 5.0 LE</span>
        <span class="sk">Scan</span><span class="sv">Active — RSSI sorted</span>
      </div></div>
    <div class="btn-row">
      <button class="btn btn-p" id="scan-btn" onclick="runBLE()">▶ Scan (8s)</button>
    </div>
    <div id="ble-results"></div>
    <div class="card"><div class="card-title">Log</div>
      <div class="log" id="ble-log"><span class="log-empty">No scans yet.</span></div></div>`; },

  wifi: function(){ return `
    <div class="card"><div class="card-title">Info</div>
      <div class="stat-grid">
        <span class="sk">Adapter</span><span class="sv hi">CYW43455 (wlan0)</span>
        <span class="sk">Bands</span><span class="sv">2.4 GHz + 5 GHz</span>
        <span class="sk">Mode</span><span class="sv">Passive scan</span>
      </div></div>
    <div class="btn-row">
      <button class="btn btn-p" id="scan-btn" onclick="runWiFi()">▶ Scan</button>
    </div>
    <div id="wifi-results"></div>
    <div class="card"><div class="card-title">Log</div>
      <div class="log" id="wifi-log"><span class="log-empty">No scans yet.</span></div></div>`; },

  lure: function(){ return `
    <div class="card"><div class="card-title">Config</div>
      <div class="stat-grid">
        <span class="sk">Mode</span><span class="sv hi">Evil Twin AP</span>
        <span class="sk">Interface</span><span class="sv">wlan0</span>
        <span class="sk">Channel</span><span class="sv">6 (2.4 GHz)</span>
        <span class="sk">Gateway</span><span class="sv">192.168.4.1</span>
      </div></div>
    <div class="card"><div class="card-title">SSID to broadcast</div>
      <input class="ssid-input" id="lure-ssid" value="Free WiFi" placeholder="AP name">
    </div>
    <div class="btn-row">
      <button class="btn btn-p" id="lure-start-btn" onclick="lureStart()">▶ Start AP</button>
      <button class="btn btn-d" id="lure-stop-btn" onclick="lureStop()" disabled>■ Stop</button>
    </div>
    <div class="card"><div class="card-title">Log</div>
      <div class="log" id="lure-log"><span class="log-empty">AP not started.</span></div></div>`; },

  call: function(){ return `
    <div class="card"><div class="card-title">Tor Status</div>
      <div class="tor-row">
        <div class="tor-dot off" id="tor-dot"></div>
        <span id="tor-label" style="font-size:10px;color:rgba(255,255,255,.4)">Checking...</span>
      </div></div>
    <div class="card"><div class="card-title">SIP Account</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="field-row"><div class="field-label">SIP Server</div>
          <input class="fk-input" id="sip-server" placeholder="sip2sip.info" value="sip2sip.info"></div>
        <div class="field-row"><div class="field-label">Username</div>
          <input class="fk-input" id="sip-user" placeholder="username"></div>
        <div class="field-row"><div class="field-label">Password</div>
          <input class="fk-input" type="password" id="sip-pass" placeholder="password"></div>
      </div></div>
    <div class="btn-row">
      <button class="btn btn-p" id="call-connect-btn" onclick="callConnect()">▶ Connect via Tor</button>
      <button class="btn btn-d" id="call-stop-btn" onclick="callStop()" disabled>■ Disconnect</button>
    </div>
    <div class="card" id="dial-card" style="display:none"><div class="card-title">Dial</div>
      <div class="dial-wrap">
        <input class="fk-input" id="dial-number" placeholder="+1 555 000 0000">
        <button class="btn btn-p" onclick="callDial()">Call</button>
        <button class="btn btn-d" onclick="callHangup()">Hang up</button>
      </div>
      <div class="call-status-row" style="margin-top:10px">
        <div class="call-dot" id="call-dot"></div>
        <span class="call-id" id="call-id">Not in a call</span>
      </div></div>
    <div class="card"><div class="card-title">Log</div>
      <div class="log" id="call-log"><span class="log-empty">Not connected.</span></div></div>`; },

  bluenet: function(){ return `
    <div class="card"><div class="card-title">Info</div>
      <div class="stat-grid">
        <span class="sk">Mode</span><span class="sv hi">BLE Advertisement Spam</span>
        <span class="sk">Adapter</span><span class="sv">hci0 (CYW43455)</span>
        <span class="sk">Targets</span><span class="sv">Apple · Android · Windows</span>
      </div></div>
    <div class="card"><div class="card-title">Device Type</div>
      <div class="btn-row">
        <button class="btn btn-s" id="bn-apple"  onclick="bnSelect('apple')"  style="border-color:rgba(31,204,124,.3)">Apple</button>
        <button class="btn btn-s" id="bn-android" onclick="bnSelect('android')">Android</button>
        <button class="btn btn-s" id="bn-windows" onclick="bnSelect('windows')">Windows</button>
        <button class="btn btn-s" id="bn-all"     onclick="bnSelect('all')">All</button>
      </div></div>
    <div class="btn-row" style="margin-top:4px">
      <button class="btn btn-p" id="bn-start" onclick="bnStart()">▶ Start Spam</button>
      <button class="btn btn-d" id="bn-stop"  onclick="bnStop()" disabled>■ Stop</button>
    </div>
    <div class="card"><div class="card-title">Log</div>
      <div class="log" id="bn-log"><span class="log-empty">Not running.</span></div></div>`; },

  popups: function(){ return `
    <div class="card"><div class="card-title">Message Text</div>
      <input class="fk-input" id="pp-msg" value="Your AirPods are connected" maxlength="48" style="width:100%">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        <div class="field-row">
          <label class="field-label">Text Size</label>
          <input class="fk-input" id="pp-size" type="number" value="13" min="8" max="24">
        </div>
        <div class="field-row">
          <label class="field-label">Quantity</label>
          <div class="btn-row" style="margin-top:2px">
            <button class="btn btn-s" id="pp-qty-1"   onclick="ppQty(1)"   style="border-color:rgba(31,204,124,.4)">1</button>
            <button class="btn btn-s" id="pp-qty-inf" onclick="ppQty(0)">∞ Inf</button>
          </div>
        </div>
      </div></div>
    <div class="card"><div class="card-title">Color</div>
      <div class="btn-row" style="flex-wrap:wrap">
        <button class="btn btn-s" id="pp-col-white" onclick="ppCol('white')" style="border-color:rgba(31,204,124,.4)">White</button>
        <button class="btn btn-s" id="pp-col-green" onclick="ppCol('green')">Green</button>
        <button class="btn btn-s" id="pp-col-blue"  onclick="ppCol('blue')">Blue</button>
        <button class="btn btn-s" id="pp-col-red"   onclick="ppCol('red')">Red</button>
        <button class="btn btn-s" id="pp-col-gold"  onclick="ppCol('gold')">Gold</button>
        <button class="btn btn-s" id="pp-col-pink"  onclick="ppCol('pink')">Pink</button>
      </div></div>
    <div class="card"><div class="card-title">Target Device</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <button class="btn btn-s" id="pp-scan" onclick="ppScan()">🔍 Scan</button>
        <span id="pp-scan-st" style="font-size:9px;color:rgba(255,255,255,.25)">No scan</span>
      </div>
      <div id="pp-target-list" style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:9px;color:rgba(255,255,255,.18);font-style:italic">Scan to find Apple devices nearby</span>
      </div></div>
    <div class="btn-row" style="margin-top:4px">
      <button class="btn btn-p" id="pp-start" onclick="ppStart()">📡 Send Popup</button>
      <button class="btn btn-d" id="pp-stop"  onclick="ppStop()" disabled>■ Stop</button>
    </div>
    <div class="card"><div class="card-title">Log</div>
      <div class="log" id="pp-log"><span class="log-empty">Not running.</span></div></div>`; },

  games: function(){
    var cats = [
      {id:'arcade',  icon:'🕹',  label:'Arcade',   games:'Snake · Flappy · Breakout · Simon'},
      {id:'puzzle',  icon:'🧩',  label:'Puzzle',   games:'Tetris · 2048'},
      {id:'board',   icon:'♟',   label:'Board',    games:'Chess · Pong'},
      {id:'mini',    icon:'⚡',  label:'Mini',     games:'Reaction · Number Guess'},
      {id:'strategy',icon:'🔴',  label:'Strategy', games:'Checkers · Reversi · Nim'},
      {id:'casino',  icon:'🎰',  label:'Casino',   games:'Slots · Bowling · Bubble'},
      {id:'cards',   icon:'🃏',  label:'Cards',    games:'Poker · War · Yahtzee'},
      {id:'creative',icon:'🎨',  label:'Creative', games:'Pixel Art · Gravity'},
      {id:'puzzleplus',icon:'🔧',label:'Puzzle+',  games:'Pipe · Maze · Chain'},
      {id:'action',  icon:'🏃',  label:'Action',   games:'Runner · Dodge · Trivia'},
    ];
    var catHTML = cats.map(function(c){
      return '<div class="game-cat-row" onclick="showGamesInCat(\''+c.id+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:4px;cursor:pointer;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);transition:background .12s" onmouseover="this.style.background=\'rgba(31,204,124,.07)\'" onmouseout="this.style.background=\'rgba(255,255,255,.02)\'">' +
        '<span style="font-size:18px">'+c.icon+'</span>' +
        '<div style="flex:1"><div style="font-size:11px;color:rgba(255,255,255,.7)">'+c.label+'</div>' +
        '<div style="font-size:9px;color:rgba(255,255,255,.25);margin-top:2px">'+c.games+'</div></div>' +
        '<span style="color:rgba(255,255,255,.2);font-size:12px">›</span></div>';
    }).join('');
    return '<div id="game-area"><div style="display:flex;flex-direction:column;gap:6px">'+catHTML+'</div></div>';
  },

  rfid:   function(){ return noHW('📡','RFID Scanner','MFRC522','Wired via SPI0 — GPIO pins 19-24.'); },
  subghz: function(){ return noHW('📻','Sub-GHz Radio','CC1101','Wired via SPI1 — GPIO pins 35-40.'); },
  camera: function(){ return hwStatus.camera
    ? '<div class="card"><div class="card-title">Camera detected at /dev/video0</div><div class="stat-grid"><span class="sk">Status</span><span class="sv hi">Connected</span></div></div>'
    : noHW('📷','Camera','OV5647 / IMX219','Connect a Pi Camera Module via CSI ribbon cable.'); },

    '<span class="badge '+m.cls+'" id="main-badge">● '+m.badge+'</span></div>' +
    '<div class="panel">' + panels[key]() + '</div>';

/* ── Nav ───────────────────────────────────────── */
document.addEventListener('click', function(e){
  var item = e.target.closest('.nav-item');
  if (!item || !item.dataset.tool) return;
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });

/* ── BLE ───────────────────────────────────────── */
function runBLE() {
  if (scanning) return; scanning = true;
  var btn = document.getElementById('scan-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner">↻</span> Scanning...';
  setBadge('● SCANNING','badge-on','ble'); logAppend('ble-log','[BLE] Starting 5s scan...');
  fetch('/api/ble/scan?timeout=8').then(r=>r.json()).then(function(d){
    scanning = false; btn.disabled = false; btn.innerHTML = '▶ Scan (8s)';
    if (d.error){ setBadge('● ERROR','badge-err','ble'); logAppend('ble-log','[ERR] '+d.error,'err'); return; }
    setBadge('● READY','badge-ready','ble');
    logAppend('ble-log','[BLE] Found '+d.count+' device(s).','fresh');
    var log = document.getElementById('ble-log');
    d.devices.forEach(function(x){
      var mac = x.address.split(':').slice(0,3).join(':')+'..';
      var label = x.username !== x.device_type ? x.username : x.device_type;
      var row = document.createElement('div');
      row.className = 'log-row fresh';
      row.innerHTML = '<span style="color:rgba(255,255,255,.25)">[BLE]</span> ' +
        '<span style="color:rgba(255,255,255,.35)">'+esc(mac)+'</span> — ' +
        '<span style="color:rgba(255,255,255,.8)">"'+esc(label)+'"</span>' +
        '<span style="color:rgba(255,255,255,.3);font-size:9px">  '+x.rssi+' dBm</span>' +
        '  <span style="font-size:9px;color:rgba(31,204,124,.5)">'+esc(x.device_type)+'</span>';
      var empty = log.querySelector('.log-empty'); if(empty) empty.remove();
      log.appendChild(row);
    });
    log.scrollTop = log.scrollHeight;
    document.getElementById('ble-results').innerHTML = '';
  }).catch(function(e){ scanning=false; btn.disabled=false; btn.innerHTML='▶ Scan (5s)'; logAppend('ble-log','[ERR] '+e.message,'err'); setBadge('● ERROR','badge-err','ble'); });
}

/* ── WiFi ──────────────────────────────────────── */
function runWiFi() {
  if (scanning) return; scanning = true;
  var btn = document.getElementById('scan-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner">↻</span> Scanning...';
  setBadge('● SCANNING','badge-on','wifi'); logAppend('wifi-log','[WiFi] Scanning wlan0...');
  fetch('/api/wifi/scan').then(r=>r.json()).then(function(d){
    scanning = false; btn.disabled = false; btn.innerHTML = '▶ Scan';
    if (d.error){ setBadge('● ERROR','badge-err','wifi'); logAppend('wifi-log','[ERR] '+d.error,'err'); return; }
    setBadge('● READY','badge-ready','wifi');
    logAppend('wifi-log','[WiFi] Found '+d.count+' network(s).','fresh');
    var rows = d.networks.map(function(n){
      return '<tr><td>'+esc(n.ssid||'(hidden)')+'</td>' +
        '<td style="color:rgba(255,255,255,.3);font-size:9px">'+esc(n.band||'')+'</td>' +
        '<td class="rssi-cell">'+(n.dbm||'—')+'</td>' +
        '<td class="'+(n.enc==='Open'?'enc-open':'enc-wpa')+'">'+esc(n.enc)+'</td>' +
        '<td><div class="sig-bar"><div class="sig-track"><div class="sig-fill" style="width:'+(n.signal||0)+'%"></div></div></div></td></tr>';
    }).join('');

      ? '<div class="card"><table class="results"><thead><tr><th>SSID</th><th>BAND</th><th>SIGNAL</th><th>ENC</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      : '';
  }).catch(function(e){ scanning=false; btn.disabled=false; btn.innerHTML='▶ Scan'; logAppend('wifi-log','[ERR] '+e.message,'err'); setBadge('● ERROR','badge-err','wifi'); });
}

/* ── Calling ───────────────────────────────────── */
function updateTorStatus() {
  fetch('/api/hw/status').then(r=>r.json()).then(function(d){
    var dot = document.getElementById('tor-dot');
    var lbl = document.getElementById('tor-label');
    if (!dot) return;
    dot.className = 'tor-dot ' + (d.tor ? 'on' : 'off');
    lbl.textContent = d.tor ? 'Tor is running — traffic routed anonymously' : 'Tor not running — will start automatically';
  });
}
function callConnect() {
  var user = document.getElementById('sip-user').value.trim();
  var server = document.getElementById('sip-server').value.trim();
  var pass = document.getElementById('sip-pass').value;
  if (!user || !server){ logAppend('call-log','[ERR] Fill in SIP server and username.','err'); return; }
  document.getElementById('call-connect-btn').disabled = true;
  logAppend('call-log','[CALL] Starting Tor + SIP...');
  fetch('/api/call/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:user,server:server,password:pass})})
    .then(r=>r.json()).then(function(d){
      if (d.error){ logAppend('call-log','[ERR] '+d.error,'err'); document.getElementById('call-connect-btn').disabled=false; return; }
      logAppend('call-log','[CALL] Connected via Tor as '+d.identity,'fresh');
      setBadge('● ONLINE','badge-ready');
      document.getElementById('call-stop-btn').disabled = false;
      document.getElementById('dial-card').style.display = '';
      updateTorStatus();
    }).catch(function(e){ logAppend('call-log','[ERR] '+e.message,'err'); document.getElementById('call-connect-btn').disabled=false; });
}
function callDial() {
  var num = document.getElementById('dial-number').value.trim().replace(/\s+/g,'');
  var server = document.getElementById('sip-server').value.trim();
  if (!num) return;
  logAppend('call-log','[CALL] Dialling '+num+'...','warn');
  fetch('/api/call/dial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:num,server:server})})
    .then(r=>r.json()).then(function(d){
      if (d.error){ logAppend('call-log','[ERR] '+d.error,'err'); return; }
      var dot = document.getElementById('call-dot');
      var id = document.getElementById('call-id');
      if (dot) dot.className = 'call-dot on';
      if (id) id.textContent = 'Calling ' + num;
    });
}
function callHangup() {
  fetch('/api/call/hangup',{method:'POST'}).then(r=>r.json()).then(function(){
    logAppend('call-log','[CALL] Call ended.');
    var dot = document.getElementById('call-dot');
    var id = document.getElementById('call-id');
    if (dot) dot.className = 'call-dot';
    if (id) id.textContent = 'Not in a call';
  });
}
function callStop() {
  document.getElementById('call-stop-btn').disabled = true;
  fetch('/api/call/stop',{method:'POST'}).then(r=>r.json()).then(function(){
    logAppend('call-log','[CALL] Disconnected. Tor stopped.');
    setBadge('● OFFLINE','badge-idle');
    document.getElementById('call-connect-btn').disabled = false;
    document.getElementById('dial-card').style.display = 'none';
    updateTorStatus();
  });
}

/* ── iOS Popups ─────────────────────────────────── */
var _ppType = 'airpods', _ppPoll = null, _ppSelected = {}, _ppQty = 0;
var _ppColMap = {white:'airpods', green:'airpods_pro', blue:'homepod', red:'airtag', gold:'watch', pink:'airpods_max'};

function ppQty(n) {
  _ppQty = n;
  ['1','inf'].forEach(function(x){
    var b = document.getElementById('pp-qty-'+x);
    if(b) b.style.borderColor = ((n===1&&x==='1')||(n===0&&x==='inf')) ? 'rgba(31,204,124,.5)' : 'rgba(255,255,255,.1)';
  });
}

function ppCol(c) {
  _ppType = _ppColMap[c] || 'airpods';
  ['white','green','blue','red','gold','pink'].forEach(function(x){
    var b = document.getElementById('pp-col-'+x);
    if(b) b.style.borderColor = x===c ? 'rgba(31,204,124,.5)' : 'rgba(255,255,255,.1)';
  });
}

function ppScan() {
  var btn = document.getElementById('pp-scan');
  var st  = document.getElementById('pp-scan-st');
  btn.disabled = true; st.textContent = 'Scanning...';
  fetch('/api/ble/scan?timeout=5').then(r=>r.json()).then(function(d){
    btn.disabled = false;
    var known = (d.devices||[]).filter(function(x){ return x.device_type !== 'Unknown'; });
    st.textContent = known.length + ' device(s) found';
    var list = document.getElementById('pp-target-list');
    list.innerHTML = '';
    if (!known.length) { list.innerHTML = '<span style="font-size:9px;color:rgba(255,255,255,.18);font-style:italic">No devices found — is Bluetooth on?</span>'; return; }
    known.forEach(function(x){
      var mac = x.address.split(':').slice(0,3).join(':')+'..';
      var row = document.createElement('div');
      row.dataset.addr = x.address;
      row.dataset.ptype = ppDevType(x.device_type);
      ppSetRow(row, false);
      row.onclick = function(){
        var sel = row.dataset.sel==='1';
        ppSetRow(row, !sel);
        if(!sel) _ppSelected[x.address]=row.dataset.ptype; else delete _ppSelected[x.address];
        ppUpdateBtn();
      };
      row.innerHTML = '<span class="pp-chk" style="width:12px;height:12px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,.2)"></span>' +
        '<span style="flex:1;font-size:10px;color:rgba(255,255,255,.65)">'+esc(x.device_type)+'</span>' +
        '<span style="font-size:9px;color:rgba(255,255,255,.22)">'+esc(mac)+'</span>' +
        '<span style="font-size:9px;color:rgba(255,255,255,.18);margin-left:8px">'+x.rssi+' dBm</span>';
      list.appendChild(row);
    });
  }).catch(function(){ btn.disabled=false; st.textContent='Scan failed'; });
}

function ppSetRow(row, sel) {
  row.dataset.sel = sel?'1':'0';
  row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;cursor:pointer;border:1px solid;transition:all .15s;' +
    (sel?'background:rgba(31,204,124,.07);border-color:rgba(31,204,124,.25)':'background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.06)');
  var chk = row.querySelector('.pp-chk');
  if(chk) chk.style.cssText = 'width:12px;height:12px;border-radius:2px;flex-shrink:0;border:1px solid;' +
    (sel?'background:var(--trace);border-color:var(--trace)':'background:transparent;border-color:rgba(255,255,255,.2)');
}

function ppUpdateBtn() {
  var n = Object.keys(_ppSelected).length;
  var btn = document.getElementById('pp-start');
  if(btn) btn.textContent = n>0 ? '📡 Spam '+n+' Target'+(n>1?'s':'') : '📡 Send Popup';
}

function ppDevType(dt) {
  if(dt.includes('AirPods Pro')) return 'airpods_pro';
  if(dt.includes('AirPods Max')) return 'airpods_max';
  if(dt.includes('AirPods'))     return 'airpods';
  if(dt.includes('AirTag'))      return 'airtag';
  if(dt.includes('HomePod'))     return 'homepod';
  if(dt.includes('TV'))          return 'appletv';
  if(dt.includes('Watch'))       return 'watch';
  if(dt.includes('Chromebook'))  return 'google_fp';
  if(dt.includes('Android') || dt.includes('Samsung')) return 'google_fp';
  return 'airpods';
}

function ppStart() {
  var selTypes = Object.values(_ppSelected);
  var body = selTypes.length>0 ? {types_list:selTypes} : {popup_type:_ppType};
  var msg   = (document.getElementById('pp-msg')||{}).value || '';
  var qty   = _ppQty;
  var label = selTypes.length>0 ? Object.keys(_ppSelected).length+' target(s)' : _ppType;
  document.getElementById('pp-start').disabled = true;
  logAppend('pp-log','[PP] Sending to '+label+(msg?' — "'+msg+'"':'')+'...');
  fetch('/api/popup/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(function(d){
      if(d.error){logAppend('pp-log','[ERR] '+d.error,'err');document.getElementById('pp-start').disabled=false;return;}
      setBadge('● SPAMMING','badge-on');
      document.getElementById('pp-stop').disabled=false;
      logAppend('pp-log','[PP] Broadcasting '+(qty===0?'infinite':'1')+' popup(s)...','fresh');
      _ppPoll=setInterval(function(){
        fetch('/api/popup/status').then(r=>r.json()).then(function(s){
          if(s.count){
            logAppend('pp-log','[PP] '+s.count+' popups sent');
            if(qty===1 && s.count>=1){ ppStop(); }
          }
        });
      },2000);
    }).catch(function(e){logAppend('pp-log','[ERR] '+e.message,'err');document.getElementById('pp-start').disabled=false;});
}

function ppStop() {
  clearInterval(_ppPoll);
  document.getElementById('pp-stop').disabled=true;
  fetch('/api/popup/stop',{method:'POST'}).then(r=>r.json()).then(function(){
    logAppend('pp-log','[PP] Stopped.');setBadge('● READY','badge-ready');
    document.getElementById('pp-start').disabled=false;
    ppUpdateBtn();
  });
}

function launchGame(key) {

    document.getElementById('game-canvas-area').innerHTML =
      '<div style="text-align:center;padding:40px;color:rgba(255,255,255,.25);font-size:11px">Loading game...</div>';
  }
}

/* ── Helpers ───────────────────────────────────── */
function logAppend(id, text, cls) {
  var log = document.getElementById(id); if (!log) return;
  var empty = log.querySelector('.log-empty'); if (empty) empty.remove();
  var row = document.createElement('div');
  row.className = 'log-row' + (cls ? ' '+cls : '');
  row.textContent = text;
  log.appendChild(row);
  while (log.children.length > 40) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function setBadge(text, cls, tool) {
  if (tool && tool !== activeTool) return;
  var b = document.getElementById('main-badge'); if (!b) return;
  b.textContent = text; b.className = 'badge '+cls;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
