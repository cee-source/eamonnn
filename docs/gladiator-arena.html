<title>Gladiator Arena</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#120D09;
    --surface:#1E1712;
    --surface-2:#2A2018;
    --surface-3:#362A1E;
    --ink:#F1E7D3;
    --muted:#B0A188;
    --gold:#D4A72C;
    --gold-dim:#8C7327;
    --gold-ink:#2A1F0B;
    --blood:#B4453A;
    --blood-dim:#7A2620;
    --victory:#8CA97C;
    --border:rgba(212,167,44,.2);
    --border-soft:rgba(212,167,44,.1);
    --shadow:rgba(0,0,0,.55);
    --sky-top:#3A2418;
    --sky-bottom:#0D0805;
    --wall:#1A1310;
    --wall-lit:#3C2A1C;
    --sand-far:#4A3620;
    --sand-near:#8A6438;
    --font-display:'Cinzel',Cambria,'Times New Roman',serif;
    --font-body:'Archivo','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --r-sm:8px; --r-md:14px; --r-lg:22px; --r-pill:999px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme: light;
      --bg:#F1E4C4;
      --surface:#FFFAEE;
      --surface-2:#EDDDB4;
      --surface-3:#E2CE9B;
      --ink:#2A1D10;
      --muted:#6E5A3D;
      --gold:#9C6E0A;
      --gold-dim:#C7A550;
      --gold-ink:#FFF8E8;
      --blood:#93301F;
      --blood-dim:#C97465;
      --victory:#3E6B37;
      --border:rgba(147,48,31,.18);
      --border-soft:rgba(147,48,31,.09);
      --shadow:rgba(120,90,40,.2);
      --sky-top:#E8C99A;
      --sky-bottom:#C99B62;
      --wall:#8A6B48;
      --wall-lit:#B08B5C;
      --sand-far:#C7A06A;
      --sand-near:#E8C48C;
    }
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#F1E4C4;
    --surface:#FFFAEE;
    --surface-2:#EDDDB4;
    --surface-3:#E2CE9B;
    --ink:#2A1D10;
    --muted:#6E5A3D;
    --gold:#9C6E0A;
    --gold-dim:#C7A550;
    --gold-ink:#FFF8E8;
    --blood:#93301F;
    --blood-dim:#C97465;
    --victory:#3E6B37;
    --border:rgba(147,48,31,.18);
    --border-soft:rgba(147,48,31,.09);
    --shadow:rgba(120,90,40,.2);
    --sky-top:#E8C99A;
    --sky-bottom:#C99B62;
    --wall:#8A6B48;
    --wall-lit:#B08B5C;
    --sand-far:#C7A06A;
    --sand-near:#E8C48C;
  }

  *,*::before,*::after{box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--surface-2), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  .icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.15em;}
  .icon.sm{width:.85em;height:.85em;}
  .icon.solid{fill:currentColor;stroke:none;}

  #root{max-width:520px;margin:0 auto;padding-inline:14px;padding-block:14px 40px;min-height:100%;}

  /* ---------- HUD ---------- */
  .hud{
    position:sticky; top:env(safe-area-inset-top,0px);
    z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 14px;
    margin-bottom:12px;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-radius:var(--r-pill);
    box-shadow:0 8px 24px var(--shadow);
  }
  .hud-brand{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;color:var(--gold);white-space:nowrap;}
  .hud-brand .icon{width:1.1em;height:1.1em;}
  .hud-stats{display:flex;align-items:center;gap:12px;}
  .hud-gold{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);font-size:.86rem;}
  .hud-gold .icon{color:var(--gold);}
  .hud-hp{display:flex;align-items:center;gap:6px;}
  .hud-hp-text{font-size:.74rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .hud-stats-btn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);cursor:pointer;flex-shrink:0;}
  .hud-stats-btn:hover{color:var(--gold);border-color:var(--gold-dim);}

  .hpbar{position:relative;height:11px;border-radius:var(--r-pill);background:var(--surface-3);border:1px solid var(--border-soft);overflow:hidden;}
  .hpbar.mini{width:58px;height:8px;}
  .hpbar-fill{height:100%;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.22,.9,.35,1),background-color .3s;}
  .hpbar-fill.player{background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
  .hpbar-fill.enemy{background:linear-gradient(90deg,var(--blood-dim),var(--blood));}

  /* ---------- Scene shell (first-person illustrated view) ---------- */
  .view{animation:viewIn .32s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .scene{
    position:relative; border-radius:var(--r-lg); overflow:hidden;
    height:280px; border:1px solid var(--border); box-shadow:0 14px 34px var(--shadow);
    isolation:isolate;
  }
  .scene-sky{position:absolute;inset:0 0 40% 0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);}
  .scene-glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 30%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 70%);mix-blend-mode:screen;}
  .scene-floor{
    position:absolute; left:0; right:0; bottom:0; height:42%;
    background:linear-gradient(180deg,var(--sand-far) 0%,var(--sand-near) 100%);
    clip-path:polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
  }
  .scene-floor::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, transparent 0 14%, rgba(0,0,0,.12) 14% 15%);
    mix-blend-mode:multiply;
  }
  .scene-vignette{position:absolute;inset:0;box-shadow:inset 0 0 70px 20px rgba(0,0,0,.55);pointer-events:none;}
  .scene-title{
    position:absolute; top:12px; left:14px; right:14px; z-index:3;
    font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.6); font-weight:700;
  }
  .scene-caption{
    position:relative; z-index:2; margin-top:-46px; padding:34px 16px 12px;
    background:linear-gradient(0deg, color-mix(in srgb, var(--bg) 80%, transparent) 30%, transparent);
  }
  .scene-caption h2{font-size:1.2rem;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.5);}

  /* Standing figure (NPCs) */
  .scene-figure{
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    height:72%; filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)); z-index:1;
  }
  .scene-figure svg{height:100%;width:auto;display:block;aspect-ratio:1/2;}
  .scene-figure.magnus{color:#C7A550;}
  .scene-figure.vita{color:var(--victory);}
  .scene-figure.dominus{color:var(--blood);}
  .scene-figure-badge{
    position:absolute; left:50%; bottom:6%; transform:translateX(38px);
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--border);color:var(--ink);z-index:2;
    box-shadow:0 4px 12px var(--shadow);
  }

  /* ---------- NPC dialogue + sheet ---------- */
  .npc-line{
    font-style:italic;color:var(--ink);font-size:.92rem;margin:12px 2px 14px;padding-left:12px;
    border-left:2px solid var(--gold-dim);text-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  .sheet{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:14px;
  }
  .sheet-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .sheet-row:last-child{margin-bottom:0;}

  .back-btn{
    display:inline-flex;align-items:center;gap:4px;
    background:none;border:1px solid var(--border);color:var(--muted);
    font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:var(--r-pill);
    cursor:pointer;transition:.15s;
  }
  .back-btn:hover{color:var(--ink);border-color:var(--gold-dim);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;border-radius:var(--r-pill);border:1px solid transparent;
    font-weight:700;font-size:.86rem;cursor:pointer;transition:.15s;letter-spacing:.01em;
  }
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn-sm{padding:8px 13px;font-size:.76rem;}
  .btn-block{width:100%;}
  .btn-primary{background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:var(--gold-ink);box-shadow:0 6px 16px var(--shadow);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary[disabled]{opacity:.4;cursor:not-allowed;filter:none;}
  .btn-outline{background:var(--surface-2);color:var(--ink);border-color:var(--border);}
  .btn-outline:hover{border-color:var(--gold-dim);color:var(--gold);}
  .btn-danger{background:var(--surface-2);color:var(--blood);border-color:var(--blood-dim);}
  .btn-danger:hover{background:var(--blood-dim);color:var(--gold-ink);}
  .btn-buy{background:var(--surface-2);color:var(--gold);border-color:var(--border);}
  .btn-buy:hover{border-color:var(--gold);}
  .btn-equipped{background:color-mix(in srgb, var(--victory) 18%, var(--surface));color:var(--victory);border-color:var(--victory);}
  .btn-disabled{background:var(--surface-2);color:var(--muted);border-color:var(--border-soft);}

  /* ---------- Armorer ---------- */
  .tab-row{display:flex;gap:8px;margin-bottom:10px;}
  .tab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 6px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
    color:var(--muted);font-size:.76rem;font-weight:700;cursor:pointer;transition:.15s;
  }
  .tab.active{background:color-mix(in srgb, var(--gold) 16%, var(--surface-2));color:var(--gold);border-color:var(--gold-dim);}
  .armor-list{display:flex;flex-direction:column;gap:7px;}
  .armor-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--r-md);
  }
  .armor-row.is-equipped{border-color:var(--victory);}
  .armor-row-icon{width:1.4rem;height:1.4rem;color:var(--gold-dim);flex-shrink:0;}
  .armor-row-info{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;}
  .armor-row-info strong{font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .armor-row-def{font-size:.71rem;color:var(--muted);}

  /* ---------- Healer ---------- */
  .heal-options{display:flex;flex-direction:column;gap:8px;}
  .option-card{
    display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--r-md);cursor:pointer;transition:.15s;
  }
  .option-card:hover{border-color:var(--gold-dim);}
  .option-card.is-disabled{opacity:.55;}
  .option-card .icon{width:1.4rem;height:1.4rem;color:var(--victory);flex-shrink:0;}
  .option-card > div{flex:1;display:flex;flex-direction:column;gap:2px;}
  .option-card strong{font-size:.88rem;}
  .option-card span{font-size:.74rem;color:var(--muted);}
  .option-card .price{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;}

  /* ---------- Arena master ---------- */
  .opponent-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:12px;}
  .opponent-stats span{display:inline-flex;align-items:center;gap:5px;}
  .opponent-stats .icon{color:var(--gold-dim);}
  .warning-line{color:var(--blood);font-size:.8rem;text-align:center;margin-bottom:10px;}

  /* ---------- Combat scene ---------- */
  .arena-scene{height:340px;}
  .boss-bar{position:absolute;top:34px;left:14px;right:14px;z-index:3;}
  .boss-name{font-family:var(--font-display);font-weight:700;font-size:.92rem;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.6);margin-bottom:5px;text-align:center;}
  .boss-bar .hpbar{height:9px;}

  .fighter-figure{
    position:absolute;left:50%;bottom:16%;transform:translateX(-50%);height:56%;
    color:var(--blood-dim);filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));z-index:1;
    transition:transform .15s ease;
  }
  .fighter-figure svg{height:100%;width:auto;display:block;aspect-ratio:1/2;}
  .fighter-figure.hit{animation:fighterHit .35s ease;}
  @keyframes fighterHit{
    0%{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(1);}
    30%{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(2.6);transform:translateX(-50%) translateX(6px);}
    100%{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(1);transform:translateX(-50%);}
  }
  .fighter-figure.fallen{animation:fighterFall .6s ease forwards;}
  @keyframes fighterFall{to{transform:translateX(-50%) rotate(78deg) translateY(30px);opacity:.35;}}

  .viewmodel{position:absolute;bottom:-6%;width:46%;z-index:2;pointer-events:none;}
  .viewmodel svg{width:100%;height:auto;display:block;aspect-ratio:200/220;}
  .viewmodel.sword{right:-6%;color:var(--muted);transform-origin:100% 100%;transition:transform .12s ease;}
  .viewmodel.shield{left:-6%;color:var(--gold-dim);transform-origin:0% 100%;transition:transform .12s ease;}
  .viewmodel.sword.swing{animation:swordSwing .32s ease;}
  @keyframes swordSwing{0%{transform:rotate(0deg);}40%{transform:rotate(-38deg) translate(-14px,-8px);}100%{transform:rotate(0deg);}}
  .viewmodel.sword.swing.power{animation-duration:.42s;}
  .viewmodel.shield.raise{animation:shieldRaise .4s ease;}
  @keyframes shieldRaise{0%{transform:translateY(0);}35%{transform:translateY(-22px) scale(1.05);}100%{transform:translateY(0);}}

  .combat-flash{position:absolute;inset:0;background:var(--blood);opacity:0;pointer-events:none;z-index:4;}
  .combat-flash.hit{animation:combatFlash .35s ease;}
  @keyframes combatFlash{0%{opacity:0;}25%{opacity:.35;}100%{opacity:0;}}

  .combat-callout{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); z-index:5;
    font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--ink);
    text-shadow:0 3px 10px rgba(0,0,0,.7); text-align:center; pointer-events:none; white-space:nowrap;
    animation:calloutPop .55s cubic-bezier(.2,.8,.3,1.2) both;
  }
  @keyframes calloutPop{0%{opacity:0;transform:translate(-50%,-40%) scale(.7);}30%{opacity:1;transform:translate(-50%,-55%) scale(1.08);}100%{opacity:0;transform:translate(-50%,-65%) scale(1);}}

  .combat-log-strip{
    display:flex; flex-direction:column; gap:2px; padding:8px 4px; font-size:.76rem; color:var(--muted);
    text-align:center; min-height:36px;
  }
  .combat-log-strip p:last-child{color:var(--ink);font-weight:600;}

  .action-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  @media (min-width:440px){ .action-row{grid-template-columns:repeat(4,1fr);} }
  .action-row .btn{flex-direction:column;padding:11px 6px;gap:4px;font-size:.72rem;}
  .action-row .icon{width:1.15rem;height:1.15rem;}

  /* ---------- Stats overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
    background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:overlayIn .25s ease both;
  }
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .card-modal{
    width:100%;max-width:320px;text-align:center;padding:28px 22px 22px;
    background:var(--surface);border:1px solid var(--gold-dim);border-radius:var(--r-lg);
    box-shadow:0 20px 60px var(--shadow);animation:resultIn .4s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes resultIn{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .result-icon{width:2.6rem;height:2.6rem;margin-bottom:10px;}
  .card-modal.win .result-icon{color:var(--gold);}
  .card-modal.loss .result-icon{color:var(--blood);}
  .card-modal.fled .result-icon{color:var(--muted);}
  .card-modal h2{font-size:1.4rem;margin-bottom:10px;}
  .card-modal p{color:var(--muted);font-size:.86rem;margin-bottom:4px;}
  .card-modal .btn{margin-top:16px;}
  .stats-modal{text-align:left;}
  .stats-modal h2{text-align:center;margin-bottom:14px;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:.86rem;margin-bottom:16px;}
  .stats-grid dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;}
  .stats-grid dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;}
  .reset-link{
    display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);
    font-size:.72rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.7;
  }
  .reset-link:hover{opacity:1;color:var(--blood);}
  .reset-confirm{margin-top:10px;text-align:center;font-size:.8rem;color:var(--muted);}
  .reset-confirm-actions{display:flex;gap:8px;justify-content:center;margin-top:10px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);
    max-width:calc(100% - 32px);padding:12px 18px;background:var(--surface-3);color:var(--ink);
    border:1px solid var(--gold-dim);border-radius:var(--r-pill);font-size:.82rem;font-weight:600;
    box-shadow:0 10px 30px var(--shadow);z-index:60;transition:transform .3s cubic-bezier(.2,.9,.3,1);
    text-align:center;
  }
  .toast.show{transform:translate(-50%,0);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
  }
</style>

<div id="root">
  <header class="hud">
    <div class="hud-brand"><svg class="icon"><use href="#i-laurel"/></svg><span>Gladiator Arena</span></div>
    <div class="hud-stats">
      <div class="hud-hp">
        <div class="hpbar mini"><div class="hpbar-fill player" id="hud-hp-fill" style="width:100%"></div></div>
        <span class="hud-hp-text" id="hud-hp-text">50/50</span>
      </div>
      <div class="hud-gold"><svg class="icon"><use href="#i-coin"/></svg><span id="hud-gold">30</span></div>
      <button class="hud-stats-btn" data-stats title="Stats"><svg class="icon sm"><use href="#i-scroll"/></svg></button>
    </div>
  </header>
  <main id="app"></main>
</div>

<div class="toast" id="toast"></div>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">

    <path d="M9 19c1-1 2-1 3-1s2 0 3 1"/>
  </symbol>

    <path d="M12 6.2V3M9.2 3.7l.9-.9M14.8 3.7l-.9-.9"/>
    <path d="M9 14.5v2.2M9 14.5c0-1.3.9-2.3 2-2.5"/>

  <!-- Large illustrative figures (filled silhouettes, not line icons) -->

  <!-- First-person weapon/shield viewmodels -->
  <symbol id="i-vm-sword" viewBox="0 0 200 220">

</defs>

<script>
(function(){
  'use strict';

  // ------------------------------------------------------------------
  // Data — mirrors the Python Gladiator Arena module 1:1
  // ------------------------------------------------------------------
  var SLOTS = ['Helmet','Chest','Shield'];
  var ROMAN = ['I','II','III','IV','V','VI','VII','VIII'];

  var ARMOR_CATALOG = [
    {name:'Leather Cap',    slot:'Helmet', defense:2,  price:20},
    {name:'Bronze Helm',    slot:'Helmet', defense:5,  price:60},
    {name:'Iron Helm',      slot:'Helmet', defense:9,  price:140},
    {name:'Spartan Helm',   slot:'Helmet', defense:14, price:260},
    {name:'Padded Tunic',   slot:'Chest',  defense:3,  price:30},
    {name:'Bronze Cuirass', slot:'Chest',  defense:8,  price:90},
    {name:'Iron Plate',     slot:'Chest',  defense:14, price:200},
    {name:'Myrmillo Plate', slot:'Chest',  defense:22, price:380},
    {name:'Wooden Buckler', slot:'Shield', defense:3,  price:25},
    {name:'Bronze Scutum',  slot:'Shield', defense:7,  price:80},
    {name:'Iron Scutum',    slot:'Shield', defense:13, price:180},
    {name:'Tower Shield',   slot:'Shield', defense:20, price:340}
  ];

  var OPPONENTS = [
    {name:'Straw Dummy',             maxHp:20,  attack:3,  defense:0,  gold:10,  taunt:'It does not move.'},
    {name:'Rusty Marcus',            maxHp:28,  attack:6,  defense:1,  gold:22,  taunt:'Fresh meat for the sand!'},
    {name:'Titus the Bull',          maxHp:40,  attack:9,  defense:3,  gold:38,  taunt:"I'll crush you like a grape!"},
    {name:'Flavia Ironfist',         maxHp:50,  attack:12, defense:5,  gold:58,  taunt:'Show me your worst, weakling.'},
    {name:'Brutus Maximus',          maxHp:65,  attack:15, defense:6,  gold:85,  taunt:'None have survived me.'},
    {name:'The Retiarius',           maxHp:78,  attack:18, defense:8,  gold:120, taunt:'Net or trident — pick your death.'},
    {name:'Crixus the Undefeated',   maxHp:95,  attack:22, defense:10, gold:170, taunt:'I am undefeated. You are next.'},
    {name:"The Emperor's Champion",  maxHp:125, attack:27, defense:13, gold:260, taunt:'For glory and the Emperor!'}
  ];

  var STARTING_GOLD = 30, STARTING_MAX_HP = 50, STARTING_ATTACK = 8, STARTING_DEFENSE = 1;
  var MISS_CHANCE = .08, CRIT_CHANCE = .12, CRIT_MULT = 1.5, POWER_MULT = 1.5;
  var ENEMY_POWER_MULT = 1.4, ENEMY_HESITATE_CHANCE = .12, ENEMY_POWER_CHANCE = .15;
  var HEAL_SMALL_AMOUNT = 20, HEAL_SMALL_COST = 10, GOLD_PER_HP_FULL = 1;
  var ARMORER_LINES = [
    'Steel keeps you breathing, friend.',
    'Bronze is cheap. Cheap gets you killed.',
    'Iron for those who mean business.',
    'A good shield outlives a good sword arm.'
  ];

  function findArmor(name){ for (var i=0;i<ARMOR_CATALOG.length;i++){ if (ARMOR_CATALOG[i].name===name) return ARMOR_CATALOG[i]; } return null; }
  function armorForSlot(slot){ return ARMOR_CATALOG.filter(function(a){ return a.slot===slot; }); }
  function slotIcon(slot){ return slot==='Helmet' ? 'i-helm' : (slot==='Chest' ? 'i-chest' : 'i-shield'); }
  function pct(v,max){ return Math.max(0, Math.min(100, 100*v/Math.max(1,max))); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  // ------------------------------------------------------------------
  // Player
  // ------------------------------------------------------------------
  function freshPlayer(){
    return {
      maxHp: STARTING_MAX_HP, hp: STARTING_MAX_HP,
      baseAttack: STARTING_ATTACK, baseDefense: STARTING_DEFENSE,
      gold: STARTING_GOLD, armor: {Helmet:null, Chest:null, Shield:null},
      wins: 0, losses: 0, opponentIndex: 0
    };
  }
  function pAttack(p){ return p.baseAttack + p.wins; }
  function pDefense(p){
    var bonus = 0;
    SLOTS.forEach(function(slot){
      var piece = p.armor[slot] ? findArmor(p.armor[slot]) : null;
      if (piece) bonus += piece.defense;
    });
    return p.baseDefense + bonus;
  }
  function nextOpponent(p){ return OPPONENTS[Math.max(0, Math.min(p.opponentIndex, OPPONENTS.length-1))]; }
  function isChampion(p){ return p.opponentIndex >= OPPONENTS.length-1 && p.wins >= OPPONENTS.length; }
  function healPlayer(p, amount){ var before=p.hp; p.hp=Math.min(p.maxHp,p.hp+amount); return p.hp-before; }
  function recordWin(p, opp){ p.gold+=opp.gold; p.wins+=1; if (p.opponentIndex < OPPONENTS.length-1) p.opponentIndex+=1; }
  function recordLoss(p){ p.losses+=1; p.hp=Math.max(1, Math.floor(p.maxHp/2)); }

  var SAVE_KEY = 'gladiator-arena-save-v1';
  function loadGame(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return freshPlayer();
      var d = JSON.parse(raw), p = freshPlayer();
      p.maxHp = Number(d.maxHp||p.maxHp);
      p.hp = Number(d.hp!=null ? d.hp : p.maxHp);
      p.baseAttack = Number(d.baseAttack!=null ? d.baseAttack : p.baseAttack);
      p.baseDefense = Number(d.baseDefense!=null ? d.baseDefense : p.baseDefense);
      p.gold = Number(d.gold!=null ? d.gold : p.gold);
      var sa = d.armor||{};
      SLOTS.forEach(function(slot){ p.armor[slot] = sa[slot]!=null ? sa[slot] : null; });
      p.wins = Number(d.wins||0);
      p.losses = Number(d.losses||0);
      p.opponentIndex = Math.max(0, Math.min(Number(d.opponentIndex||0), OPPONENTS.length-1));
      return p;
    } catch(e){ return freshPlayer(); }
  }
  function saveGame(p){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p)); } catch(e){} }

  // ------------------------------------------------------------------
  // Combat
  // ------------------------------------------------------------------
  function rollDamage(atk, dfn){
    var dmg = Math.max(1, atk - dfn + (Math.floor(Math.random()*5)-2));
    var crit = Math.random() < CRIT_CHANCE;
    if (crit) dmg = Math.floor(dmg*CRIT_MULT)+1;
    return {dmg:dmg, crit:crit};
  }
  function Combat(player, opponent){
    this.player = player; this.opponent = opponent; this.enemyHp = opponent.maxHp;
    this.log = ['“'+opponent.taunt+'”']; this.defending = false; this.result = null;
    this.lastHit = null; this.lastAction = null; this.lastLine = this.log[0];
  }
  Combat.prototype.isOver = function(){ return this.result !== null; };
  Combat.prototype.attack = function(power){
    if (this.isOver()) return;
    this.defending = false; this.lastHit = null; this.lastAction = power ? 'power' : 'attack';
    if (Math.random() < MISS_CHANCE){
      this.lastLine = 'You swing and miss!';
    } else {
      var atk = power ? Math.floor(pAttack(this.player)*POWER_MULT) : pAttack(this.player);
      var r = rollDamage(atk, this.opponent.defense);
      this.enemyHp = Math.max(0, this.enemyHp - r.dmg);
      this.lastHit = 'enemy';
      this.lastLine = 'You '+(power?'smash':'strike')+' for '+r.dmg+'!'+(r.crit?' CRITICAL!':'');
    }
    this.log.push(this.lastLine);
    this._checkEnd();
    if (!this.isOver()) this._enemyTurn();
  };
  Combat.prototype.defend = function(){
    if (this.isOver()) return;
    this.defending = true; this.lastHit = null; this.lastAction = 'defend';
    var healed = healPlayer(this.player, 2);
    this.lastLine = 'You brace behind your shield.'+(healed?' (+'+healed+' HP)':'');
    this.log.push(this.lastLine);
    this._enemyTurn();
  };
  Combat.prototype.flee = function(){
    if (this.isOver()) return;
    this.result = 'fled'; this.lastAction = 'flee';
    this.lastLine = 'You flee the arena!';
    this.log.push(this.lastLine);
  };
  Combat.prototype._enemyTurn = function(){
    if (this.isOver()) return;
    var roll = Math.random();
    if (roll < ENEMY_HESITATE_CHANCE){
      this.log.push(this.opponent.name+' hesitates, catching their breath.');
    } else {
      var power = roll > (1-ENEMY_POWER_CHANCE);
      var atk = power ? Math.floor(this.opponent.attack*ENEMY_POWER_MULT) : this.opponent.attack;
      var r = rollDamage(atk, pDefense(this.player));
      var dmg = this.defending ? Math.max(1, Math.floor(r.dmg/2)) : r.dmg;
      this.player.hp = Math.max(0, this.player.hp - dmg);
      this.lastHit = 'player';
      this.log.push(this.opponent.name+' '+(power?'crushes':'hits')+' you for '+dmg+'!'+(r.crit?' CRITICAL!':''));
    }
    this.defending = false;
    this._checkEnd();
  };
  Combat.prototype._checkEnd = function(){
    if (this.enemyHp <= 0){ this.result = 'win'; this.log.push(this.opponent.name+' falls! Victory!'); }
    else if (this.player.hp <= 0){ this.result = 'loss'; this.log.push('You collapse in the sand...'); }
  };

  // ------------------------------------------------------------------
  // App state
  // ------------------------------------------------------------------
  var player = loadGame();
  var view = 'hub';
  var combat = null;
  var armorerSlot = 'Helmet';
  var npcLine = pick(ARMORER_LINES);
  var resultOverlay = null;
  var showStats = false;
  var confirmingReset = false;
  var toastTimer = null;

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }

  function clearToast(){
    clearTimeout(toastTimer);
    document.getElementById('toast').classList.remove('show');
  }

  function navigate(v){
    combat = null; resultOverlay = null; confirmingReset = false; showStats = false;
    if (v === 'armorer') armorerSlot = 'Helmet';
    view = v;
    clearToast();
    render();
  }

  function buyArmor(name){
    var piece = findArmor(name);
    if (!piece) return;
    if (player.armor[piece.slot] === piece.name){ toast('Already equipped.'); return; }
    if (player.gold < piece.price){ toast('Not enough gold — need '+piece.price+'g, have '+player.gold+'g'); return; }
    player.gold -= piece.price;
    player.armor[piece.slot] = piece.name;
    saveGame(player);
    toast('Equipped '+piece.name+'! Defense is now '+pDefense(player));
    render();
  }

  function doHeal(kind){
    var missing = player.maxHp - player.hp;
    if (missing <= 0){ toast('Already at full HP!'); return; }
    var amount = kind==='small' ? HEAL_SMALL_AMOUNT : missing;
    var cost = kind==='small' ? HEAL_SMALL_COST : missing*GOLD_PER_HP_FULL;
    if (player.gold < cost){ toast('Not enough gold — need '+cost+'g, have '+player.gold+'g'); return; }
    player.gold -= cost;
    var healed = healPlayer(player, amount);
    saveGame(player);
    toast('Healed '+healed+' HP! ('+player.hp+'/'+player.maxHp+')');
    render();
  }

  function startFight(){
    if (player.hp <= Math.max(1, player.maxHp*.15)){ toast('Too wounded to fight! See Vita the Healer first.'); return; }
    combat = new Combat(player, nextOpponent(player));
    view = 'combat';
    render();
  }

  function doCombatAction(action){
    if (!combat || combat.isOver()) return;
    if (action==='attack') combat.attack(false);
    else if (action==='power') combat.attack(true);
    else if (action==='defend') combat.defend();
    else if (action==='flee') combat.flee();

    render();
    if (combat.isOver()){
      setTimeout(finishCombat, action==='flee' ? 200 : 700);
    }
  }

  function finishCombat(){
    var opp = combat.opponent, overlay;
    if (combat.result === 'win'){
      var wasChampion = isChampion(player);
      recordWin(player, opp);
      overlay = { type:'win', title: (!wasChampion && isChampion(player)) ? 'Champion of the Arena!' : 'Victory!',
                  lines: ['+'+opp.gold+' gold', player.gold+'g total'] };
    } else if (combat.result === 'loss'){
      recordLoss(player);
      overlay = { type:'loss', title:'Defeated…', lines:['Carried from the sand.', 'HP restored to '+player.hp] };
    } else {
      overlay = { type:'fled', title:'You Fled', lines:['No shame in living to fight on.'] };
    }
    saveGame(player);
    resultOverlay = overlay;
    render();
  }

  function dismissResult(){ resultOverlay = null; combat = null; view = 'arenaMaster'; render(); }

  function doReset(){ player = freshPlayer(); saveGame(player); confirmingReset = false; view = 'hub'; render(); }

  // ------------------------------------------------------------------
  // Rendering — first-person scenes
  // ------------------------------------------------------------------
  function sceneShell(kind, opts){
    opts = opts || {};
    var extra = opts.extraClass ? ' ' + opts.extraClass : '';
    return '<div class="scene'+extra+'">' +
      '<div class="scene-sky"></div><div class="scene-glow"></div><div class="scene-floor"></div>' +
      (opts.title ? '<div class="scene-title">'+opts.title+'</div>' : '') +
      (opts.inner || '') +
      '<div class="scene-vignette"></div>' +
    '</div>';
  }

  function renderHub(){
    var opp = nextOpponent(player);
    var inner =
      '<div class="scene-figure magnus" style="left:20%" data-nav="armorer"><svg class="icon solid"><use href="#i-figure-npc"/></svg></div>' +
      '<div class="scene-figure vita" style="left:50%" data-nav="healer"><svg class="icon solid"><use href="#i-figure-npc"/></svg></div>' +
      '<div class="scene-figure dominus" style="left:80%" data-nav="arenaMaster"><svg class="icon solid"><use href="#i-figure-npc"/></svg></div>';
    return '' +
    '<section class="view">' +
      sceneShell('hub', {title:'Ludus Magnus · Gladiator School', inner: inner}) +
      '<div class="scene-caption"><h2>The Sand Remembers</h2><p class="npc-line" style="margin-bottom:0">Approach one of the three to speak with them.</p></div>' +
      '<div class="sheet" style="margin-top:10px">' +
        '<button class="btn btn-outline btn-block" data-nav="armorer" style="justify-content:flex-start;margin-bottom:8px"><svg class="icon"><use href="#i-chest"/></svg>&nbsp;Magnus — The Armorer</button>' +
        '<button class="btn btn-outline btn-block" data-nav="healer" style="justify-content:flex-start;margin-bottom:8px"><svg class="icon"><use href="#i-potion"/></svg>&nbsp;Vita — The Healer</button>' +
        '<button class="btn btn-primary btn-block" data-nav="arenaMaster" style="justify-content:flex-start"><svg class="icon"><use href="#i-crossed-swords"/></svg>&nbsp;Dominus — next: '+esc(opp.name)+'</button>' +
      '</div>' +
      '<button class="reset-link" data-reset>Reset progress</button>' +
      (confirmingReset ?
        '<div class="reset-confirm"><span>Erase this gladiator and start over?</span>' +
        '<div class="reset-confirm-actions"><button class="btn btn-danger btn-sm" data-reset-confirm>Yes, reset</button><button class="btn btn-outline btn-sm" data-reset-cancel>Cancel</button></div></div>'
        : '') +
    '</section>';
  }

  function renderArmorer(){
    var slot = armorerSlot, items = armorForSlot(slot);
    var inner = '<div class="scene-figure magnus"><svg class="icon solid"><use href="#i-figure-npc"/></svg></div>' +
                '<div class="scene-figure-badge"><svg class="icon sm"><use href="#i-chest"/></svg></div>';
    return '' +
    '<section class="view">' +
      sceneShell('armorer', {title:'The Forge', inner: inner}) +
      '<div class="scene-caption"><h2>Magnus the Armorer</h2></div>' +
      '<p class="npc-line">“'+npcLine+'”</p>' +
      '<div class="sheet">' +
        '<div class="tab-row">' +
          SLOTS.map(function(s){ return '<button class="tab'+(s===slot?' active':'')+'" data-slot="'+s+'"><svg class="icon"><use href="#'+slotIcon(s)+'"/></svg>'+s+'</button>'; }).join('') +
        '</div>' +
        '<div class="armor-list">' +
          items.map(function(a){
            var equipped = player.armor[slot] === a.name;
            var afford = player.gold >= a.price;
            return '<div class="armor-row'+(equipped?' is-equipped':'')+'">' +
              '<svg class="icon armor-row-icon"><use href="#'+slotIcon(slot)+'"/></svg>' +
              '<div class="armor-row-info"><strong>'+esc(a.name)+'</strong><span class="armor-row-def">+'+a.defense+' DEF</span></div>' +
              '<button class="btn btn-sm '+(equipped?'btn-equipped':(afford?'btn-buy':'btn-disabled'))+'" data-buy="'+esc(a.name)+'">' +
                (equipped ? 'Equipped' : a.price+'g') +
              '</button>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<button class="back-btn" style="margin-top:10px" data-back>‹ Leave</button>' +
    '</section>';
  }

  function renderHealer(){
    var missing = player.maxHp - player.hp, fullCost = missing*GOLD_PER_HP_FULL;
    var inner = '<div class="scene-figure vita"><svg class="icon solid"><use href="#i-figure-npc"/></svg></div>' +
                '<div class="scene-figure-badge"><svg class="icon sm"><use href="#i-potion"/></svg></div>';
    return '' +
    '<section class="view">' +
      sceneShell('healer', {title:'The Healing Tent', inner: inner}) +
      '<div class="scene-caption"><h2>Vita the Healer</h2></div>' +
      '<p class="npc-line">“Let me mend your wounds.”</p>' +
      '<div class="sheet">' +
        '<div class="heal-options">' +
          '<button class="option-card" data-heal="small"><svg class="icon"><use href="#i-potion"/></svg><div><strong>Patch Up</strong><span>Restore '+HEAL_SMALL_AMOUNT+' HP</span></div><span class="price">'+HEAL_SMALL_COST+'g</span></button>' +
          '<button class="option-card'+(missing<=0?' is-disabled':'')+'" data-heal="full"><svg class="icon"><use href="#i-potion"/></svg><div><strong>Full Heal</strong><span>'+(missing>0?'Restore all '+missing+' HP':'Already full')+'</span></div><span class="price">'+(missing>0?fullCost+'g':'—')+'</span></button>' +
        '</div>' +
      '</div>' +
      '<button class="back-btn" style="margin-top:10px" data-back>‹ Leave</button>' +
    '</section>';
  }

  function renderArenaMaster(){
    var opp = nextOpponent(player);
    var idx = Math.max(0, Math.min(player.opponentIndex, OPPONENTS.length-1));
    var wounded = player.hp <= Math.max(1, player.maxHp*.15);
    var inner = '<div class="scene-figure dominus"><svg class="icon solid"><use href="#i-figure-npc"/></svg></div>' +
                '<div class="scene-figure-badge"><svg class="icon sm"><use href="#i-crossed-swords"/></svg></div>';
    return '' +
    '<section class="view">' +
      sceneShell('dominus', {title:'Bout '+ROMAN[idx]+' of '+ROMAN[OPPONENTS.length-1], inner: inner}) +
      '<div class="scene-caption"><h2>Dominus, Arena Master</h2></div>' +
      '<p class="npc-line">“'+esc(opp.taunt)+'”</p>' +
      '<div class="sheet">' +
        '<div class="opponent-stats">' +
          '<span><strong style="color:var(--ink)">'+esc(opp.name)+'</strong></span>' +
        '</div>' +
        '<div class="opponent-stats">' +
          '<span><svg class="icon sm"><use href="#i-sword"/></svg>'+opp.attack+' ATK</span>' +
          '<span><svg class="icon sm"><use href="#i-shield"/></svg>'+opp.defense+' DEF</span>' +
          '<span><svg class="icon sm"><use href="#i-coin"/></svg>'+opp.gold+'g reward</span>' +
        '</div>' +
        (wounded ? '<p class="warning-line">You’re too wounded to fight. See Vita the Healer first.</p>' : '') +
        '<button class="btn btn-primary btn-block" data-fight="enter"'+(wounded?' disabled':'')+'><svg class="icon"><use href="#i-crossed-swords"/></svg>Enter the Arena</button>' +
      '</div>' +
      '<button class="back-btn" style="margin-top:10px" data-back>‹ Leave</button>' +
    '</section>';
  }

  function renderCombat(){
    var p = combat.player, o = combat.opponent;
    var scale = 0.92 + 0.05 * Math.min(player.opponentIndex, OPPONENTS.length-1);
    var fighterClass = 'fighter-figure' + (combat.lastHit==='enemy' ? ' hit' : '') + (combat.result==='win' ? ' fallen' : '');
    var swordClass = 'viewmodel sword' + (combat.lastAction==='attack' ? ' swing' : combat.lastAction==='power' ? ' swing power' : '');
    var shieldClass = 'viewmodel shield' + (combat.lastAction==='defend' ? ' raise' : '');
    var inner =
      '<div class="'+fighterClass+'" style="transform:translateX(-50%) scale('+scale.toFixed(2)+')"><svg class="icon solid"><use href="#i-figure-fighter"/></svg></div>' +
      '<div class="combat-flash'+(combat.lastHit==='player'?' hit':'')+'"></div>' +
      (combat.lastLine ? '<div class="combat-callout">'+esc(combat.lastLine)+'</div>' : '') +
      '<div class="boss-bar"><div class="boss-name">'+esc(o.name)+'</div><div class="hpbar"><div class="hpbar-fill enemy" style="width:'+pct(combat.enemyHp,o.maxHp)+'%"></div></div></div>' +
      '<div class="'+shieldClass+'"><svg><use href="#i-vm-shield"/></svg></div>' +
      '<div class="'+swordClass+'"><svg><use href="#i-vm-sword"/></svg></div>';
    return '' +
    '<section class="view combat-view">' +
      sceneShell('combat', {inner: inner, extraClass:'arena-scene'}) +
      '<div class="combat-log-strip">' + combat.log.slice(-2).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join('') + '</div>' +
      '<div class="action-row">' +
        '<button class="btn btn-outline" data-combat-action="attack"><svg class="icon"><use href="#i-sword"/></svg>Attack</button>' +
        '<button class="btn btn-outline" data-combat-action="power"><svg class="icon"><use href="#i-burst"/></svg>Power</button>' +
        '<button class="btn btn-outline" data-combat-action="defend"><svg class="icon"><use href="#i-shield"/></svg>Defend</button>' +
        '<button class="btn btn-danger" data-combat-action="flee"><svg class="icon"><use href="#i-exit"/></svg>Flee</button>' +
      '</div>' +
    '</section>';
  }

  function renderResultOverlay(){
    var r = resultOverlay;
    var icon = r.type==='win' ? 'i-laurel' : (r.type==='loss' ? 'i-cracked-shield' : 'i-exit');
    return '' +
    '<div class="overlay">' +
      '<div class="card-modal '+r.type+'">' +
        '<svg class="icon result-icon"><use href="#'+icon+'"/></svg>' +
        '<h2>'+r.title+'</h2>' +
        r.lines.map(function(l){ return '<p>'+l+'</p>'; }).join('') +
        '<button class="btn btn-primary" data-continue>Continue</button>' +
      '</div>' +
    '</div>';
  }

  function ownedLabel(slot){
    var name = player.armor[slot];
    if (!name) return 'None';
    var piece = findArmor(name);
    return piece ? name+' (+'+piece.defense+')' : name;
  }

  function renderStatsOverlay(){
    return '' +
    '<div class="overlay" data-close-stats>' +
      '<div class="card-modal stats-modal" onclick="event.stopPropagation()">' +
        '<h2>Your Record</h2>' +
        '<dl class="stats-grid">' +
          '<dt>Gold</dt><dd>'+player.gold+'g</dd>' +
          '<dt>HP</dt><dd>'+player.hp+'/'+player.maxHp+'</dd>' +
          '<dt>Attack</dt><dd>'+pAttack(player)+'</dd>' +
          '<dt>Defense</dt><dd>'+pDefense(player)+'</dd>' +
          '<dt>Wins</dt><dd>'+player.wins+'</dd>' +
          '<dt>Losses</dt><dd>'+player.losses+'</dd>' +
        '</dl>' +
        '<div class="stats-grid" style="grid-template-columns:1fr">' +
          '<div><dt>Helmet</dt><dd style="font-size:.86rem">'+ownedLabel('Helmet')+'</dd></div>' +
          '<div><dt>Chest</dt><dd style="font-size:.86rem">'+ownedLabel('Chest')+'</dd></div>' +
          '<div><dt>Shield</dt><dd style="font-size:.86rem">'+ownedLabel('Shield')+'</dd></div>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" data-close-stats>Close</button>' +
      '</div>' +
    '</div>';
  }

  function render(){
    document.getElementById('hud-gold').textContent = player.gold;
    document.getElementById('hud-hp-text').textContent = player.hp+'/'+player.maxHp;
    document.getElementById('hud-hp-fill').style.width = pct(player.hp, player.maxHp)+'%';

    var app = document.getElementById('app');
    var html = '';
    if (view==='hub') html = renderHub();
    else if (view==='armorer') html = renderArmorer();
    else if (view==='healer') html = renderHealer();
    else if (view==='arenaMaster') html = renderArenaMaster();
    else if (view==='combat') html = renderCombat();
    app.innerHTML = html + (resultOverlay ? renderResultOverlay() : '') + (showStats ? renderStatsOverlay() : '');
  }

  // ------------------------------------------------------------------
  // Event delegation
  // ------------------------------------------------------------------
  document.getElementById('root').addEventListener('click', function(e){
    if (e.target.closest('[data-close-stats]')){ showStats = false; render(); return; }
    if (e.target.closest('[data-stats]')){ showStats = true; render(); return; }
    var t = e.target.closest('[data-nav],[data-back],[data-slot],[data-buy],[data-heal],[data-fight],[data-combat-action],[data-continue],[data-reset],[data-reset-confirm],[data-reset-cancel]');
    if (!t || t.hasAttribute('disabled')) return;
    if (t.dataset.nav){ if (t.dataset.nav==='armorer') npcLine = pick(ARMORER_LINES); navigate(t.dataset.nav); }
    else if (t.dataset.back !== undefined) navigate('hub');
    else if (t.dataset.slot){ armorerSlot = t.dataset.slot; render(); }
    else if (t.dataset.buy) buyArmor(t.dataset.buy);
    else if (t.dataset.heal) doHeal(t.dataset.heal);
    else if (t.dataset.fight) startFight();
    else if (t.dataset.combatAction) doCombatAction(t.dataset.combatAction);
    else if (t.dataset.continue !== undefined) dismissResult();
    else if (t.dataset.reset !== undefined){ confirmingReset = true; render(); }
    else if (t.dataset.resetCancel !== undefined){ confirmingReset = false; render(); }
    else if (t.dataset.resetConfirm !== undefined) doReset();
  });

  render();
})();
</script>
