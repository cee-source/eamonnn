<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gladiator Arena</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#120D09;
    --surface:#1E1712;
    --surface-2:#2A2018;
    --surface-3:#362A1E;
    --ink:#F1E7D3;
    --muted:#B0A188;
    --gold:#D4A72C;
    --gold-dim:#8C7327;
    --gold-ink:#2A1F0B;
    --blood:#B4453A;
    --blood-dim:#7A2620;
    --victory:#8CA97C;
    --border:rgba(212,167,44,.2);
    --border-soft:rgba(212,167,44,.1);
    --shadow:rgba(0,0,0,.55);
    --sky-top:#3A2418;
    --sky-bottom:#0D0805;
    --wall:#1A1310;
    --wall-lit:#3C2A1C;
    --sand-far:#4A3620;
    --sand-near:#8A6438;
    --font-display:'Cinzel',Cambria,'Times New Roman',serif;
    --font-body:'Archivo','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --r-sm:8px; --r-md:14px; --r-lg:22px; --r-pill:999px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme: light;
      --bg:#F1E4C4;
      --surface:#FFFAEE;
      --surface-2:#EDDDB4;
      --surface-3:#E2CE9B;
      --ink:#2A1D10;
      --muted:#6E5A3D;
      --gold:#9C6E0A;
      --gold-dim:#C7A550;
      --gold-ink:#FFF8E8;
      --blood:#93301F;
      --blood-dim:#C97465;
      --victory:#3E6B37;
      --border:rgba(147,48,31,.18);
      --border-soft:rgba(147,48,31,.09);
      --shadow:rgba(120,90,40,.2);
      --sky-top:#E8C99A;
      --sky-bottom:#C99B62;
      --wall:#8A6B48;
      --wall-lit:#B08B5C;
      --sand-far:#C7A06A;
      --sand-near:#E8C48C;
    }
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#F1E4C4;
    --surface:#FFFAEE;
    --surface-2:#EDDDB4;
    --surface-3:#E2CE9B;
    --ink:#2A1D10;
    --muted:#6E5A3D;
    --gold:#9C6E0A;
    --gold-dim:#C7A550;
    --gold-ink:#FFF8E8;
    --blood:#93301F;
    --blood-dim:#C97465;
    --victory:#3E6B37;
    --border:rgba(147,48,31,.18);
    --border-soft:rgba(147,48,31,.09);
    --shadow:rgba(120,90,40,.2);
    --sky-top:#E8C99A;
    --sky-bottom:#C99B62;
    --wall:#8A6B48;
    --wall-lit:#B08B5C;
    --sand-far:#C7A06A;
    --sand-near:#E8C48C;
  }

  *,*::before,*::after{box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--surface-2), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  .icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.15em;}
  .icon.sm{width:.85em;height:.85em;}

  #root{max-width:520px;margin:0 auto;padding-inline:14px;padding-block:14px 40px;min-height:100%;}

  /* ---------- HUD ---------- */
  .hud{
    position:sticky; top:env(safe-area-inset-top,0px);
    z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 14px;
    margin-bottom:12px;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-radius:var(--r-pill);
    box-shadow:0 8px 24px var(--shadow);
  }
  .hud-brand{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;color:var(--gold);white-space:nowrap;}
  .hud-stats{flex-wrap:nowrap;}
  @media (max-width:360px){
    .hud-brand span{display:none;}
    .hud-stats{gap:8px;}
    .hpbar.mini{width:40px;}
  }
  .hud-brand .icon{width:1.1em;height:1.1em;}
  .hud-stats{display:flex;align-items:center;gap:12px;}
  .hud-gold{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);font-size:.86rem;}
  .hud-gold .icon{color:var(--gold);}
  .hud-hp{display:flex;align-items:center;gap:6px;}
  .hud-hp-text{font-size:.74rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .hud-stats-btn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);cursor:pointer;flex-shrink:0;}
  .hud-stats-btn:hover{color:var(--gold);border-color:var(--gold-dim);}

  .hpbar{position:relative;height:11px;border-radius:var(--r-pill);background:var(--surface-3);border:1px solid var(--border-soft);overflow:hidden;}
  .hpbar.mini{width:58px;height:8px;}
  .hpbar-fill{height:100%;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.22,.9,.35,1),background-color .3s;}
  .hpbar-fill.player{background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
  .hpbar-fill.enemy{background:linear-gradient(90deg,var(--blood-dim),var(--blood));}

  /* ---------- Scene shell (first-person illustrated view) ---------- */
  .view{animation:viewIn .32s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .scene{
    position:relative; border-radius:var(--r-lg); overflow:hidden;
    height:280px; border:1px solid var(--border); box-shadow:0 14px 34px var(--shadow);
    isolation:isolate;
  }
  .scene-sky{position:absolute;inset:0 0 40% 0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);}
  /* Tiered arena stands, packed with a crowd of tiny fans -- combat only. */
  .scene-stands{
    position:absolute; inset:0 0 40% 0; overflow:hidden;
    background-color:#7A6650;
    background-image:
      repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 3px, transparent 3px 26px),
      radial-gradient(circle, #B4453A 42%, transparent 46%),
      radial-gradient(circle, #3E5636 42%, transparent 46%),
      radial-gradient(circle, #D9A066 42%, transparent 46%),
      radial-gradient(circle, #5C7A50 42%, transparent 46%),
      radial-gradient(circle, #8E3227 42%, transparent 46%),
      radial-gradient(circle, #E8C39A 42%, transparent 46%),
      radial-gradient(circle, #4A6B8C 42%, transparent 46%),
      linear-gradient(180deg, #40352A 0%, #6E5A42 55%, #8A7457 100%);
    background-size:
      100% 26px,
      18px 26px, 18px 26px, 18px 26px, 18px 26px, 18px 26px, 18px 26px, 18px 26px,
      100% 100%;
    background-position:
      0 0,
      0 4px, 6px 14px, 12px 2px, 3px 20px, 15px 9px, 9px 22px, 13px 17px,
      0 0;
  }
  .stands-wall{
    position:absolute; left:0; right:0; bottom:40%; height:4.5%; z-index:1;
    background:linear-gradient(180deg,#C7A06A,#8A6B48);
    box-shadow:0 3px 6px rgba(0,0,0,.4);
  }
  .scene-glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 30%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 70%);mix-blend-mode:screen;}
  .scene-floor{
    position:absolute; left:0; right:0; bottom:0; height:42%;
    background:linear-gradient(180deg,var(--sand-far) 0%,var(--sand-near) 100%);
    clip-path:polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
  }
  .scene-floor::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, transparent 0 14%, rgba(0,0,0,.12) 14% 15%);
    mix-blend-mode:multiply;
  }
  .scene-vignette{position:absolute;inset:0;box-shadow:inset 0 0 70px 20px rgba(0,0,0,.55);pointer-events:none;}
  .scene-title{
    position:absolute; top:12px; left:14px; right:14px; z-index:3;
    font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.6); font-weight:700;
    max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .scene-caption{
    position:relative; z-index:2; margin-top:-46px; padding:34px 16px 12px;
    background:linear-gradient(0deg, color-mix(in srgb, var(--bg) 80%, transparent) 30%, transparent);
  }
  .scene-caption h2{font-size:1.2rem;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.5);}

  /* Standing figures */
  .scene-figure{
    position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
    height:78%; filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)); z-index:1;
  }
  .scene-figure svg{height:100%;width:auto;display:block;aspect-ratio:120/240;}
  .scene-figure-badge{
    position:absolute; left:50%; bottom:6%; transform:translateX(38px);
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--border);color:var(--ink);z-index:2;
    box-shadow:0 4px 12px var(--shadow);
  }

  /* ---------- Walkable courtyard (WASD) ---------- */
  .courtyard-layer{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform;}
  .courtyard-hint{
    position:absolute; top:12px; right:14px; z-index:3; max-width:32%;
    font-size:.62rem; color:var(--muted); letter-spacing:.05em;
    text-shadow:0 1px 4px rgba(0,0,0,.6); text-align:right; line-height:1.5;
  }
  .courtyard-prompt{
    position:absolute; bottom:9%; left:50%; transform:translate(-50%,8px); z-index:4;
    padding:7px 16px; background:color-mix(in srgb, var(--bg) 65%, transparent);
    border:1px solid var(--gold-dim); border-radius:var(--r-pill); color:var(--gold);
    font-size:.76rem; font-weight:700; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  }
  .courtyard-prompt.show{opacity:1; transform:translate(-50%,0);}

  .joystick{
    position:absolute; left:14px; bottom:14px; z-index:5;
    width:84px; height:84px; border-radius:50%;
    background:color-mix(in srgb, var(--bg) 45%, transparent);
    border:1px solid var(--border-soft);
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .joystick-knob{
    position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; background:color-mix(in srgb, var(--gold-dim) 65%, transparent);
    border:1px solid var(--gold-dim); pointer-events:none;
    transition:transform .12s ease-out;
  }
  .joystick.active{border-color:var(--gold-dim);}
  .joystick.active .joystick-knob{transition:none;}

  /* ---------- NPC dialogue + sheet ---------- */
  .npc-line{
    font-style:italic;color:var(--ink);font-size:.92rem;margin:12px 2px 14px;padding-left:12px;
    border-left:2px solid var(--gold-dim);text-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  .sheet{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:14px;
  }
  .sheet-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .sheet-row:last-child{margin-bottom:0;}

  .back-btn{
    display:inline-flex;align-items:center;gap:4px;
    background:none;border:1px solid var(--border);color:var(--muted);
    font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:var(--r-pill);
    cursor:pointer;transition:.15s;
  }
  .back-btn:hover{color:var(--ink);border-color:var(--gold-dim);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;border-radius:var(--r-pill);border:1px solid transparent;
    font-weight:700;font-size:.86rem;cursor:pointer;transition:.15s;letter-spacing:.01em;
  }
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn-sm{padding:8px 13px;font-size:.76rem;}
  .btn-block{width:100%;}
  .btn-primary{background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:var(--gold-ink);box-shadow:0 6px 16px var(--shadow);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary[disabled]{opacity:.4;cursor:not-allowed;filter:none;}
  .btn-outline{background:var(--surface-2);color:var(--ink);border-color:var(--border);}
  .btn-outline:hover{border-color:var(--gold-dim);color:var(--gold);}
  .btn-danger{background:var(--surface-2);color:var(--blood);border-color:var(--blood-dim);}
  .btn-danger:hover{background:var(--blood-dim);color:var(--gold-ink);}
  .btn-buy{background:var(--surface-2);color:var(--gold);border-color:var(--border);}
  .btn-buy:hover{border-color:var(--gold);}
  .btn-equipped{background:color-mix(in srgb, var(--victory) 18%, var(--surface));color:var(--victory);border-color:var(--victory);}
  .btn-disabled{background:var(--surface-2);color:var(--muted);border-color:var(--border-soft);}

  /* ---------- Armorer / Weaponsmith ---------- */
  .tab-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .tab{
    flex:1;min-width:70px;display:flex;align-items:center;justify-content:center;gap:5px;
    padding:8px 4px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
    color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer;transition:.15s;
  }
  .tab.active{background:color-mix(in srgb, var(--gold) 16%, var(--surface-2));color:var(--gold);border-color:var(--gold-dim);}
  .armor-list{display:flex;flex-direction:column;gap:7px;}
  .armor-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--r-md);
  }
  .armor-row.is-equipped{border-color:var(--victory);}
  .armor-row-icon{width:1.4rem;height:1.4rem;color:var(--gold-dim);flex-shrink:0;}
  .armor-row-info{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;}
  .armor-row-info strong{font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .armor-row-def{font-size:.71rem;color:var(--muted);}

  /* ---------- Healer ---------- */
  .heal-options{display:flex;flex-direction:column;gap:8px;}
  .option-card{
    display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--r-md);cursor:pointer;transition:.15s;
  }
  .option-card:hover{border-color:var(--gold-dim);}
  .option-card.is-disabled{opacity:.55;}
  .option-card .icon{width:1.4rem;height:1.4rem;color:var(--victory);flex-shrink:0;}
  .option-card > div{flex:1;display:flex;flex-direction:column;gap:2px;}
  .option-card strong{font-size:.88rem;}
  .option-card span{font-size:.74rem;color:var(--muted);}
  .option-card .price{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;}

  /* ---------- Arena master ---------- */
  .opponent-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:12px;}
  .opponent-stats span{display:inline-flex;align-items:center;gap:5px;}
  .opponent-stats .icon{color:var(--gold-dim);}
  .warning-line{color:var(--blood);font-size:.8rem;text-align:center;margin-bottom:10px;}

  /* ---------- Combat scene ---------- */
  .arena-scene{height:340px;}
  .arena-scene.aiming{cursor:none;}
  .boss-bar{position:absolute;top:34px;left:14px;right:14px;z-index:3;}
  .boss-name{font-family:var(--font-display);font-weight:700;font-size:.92rem;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.6);margin-bottom:5px;text-align:center;}
  .boss-bar .hpbar{height:9px;}

  .fighter-figure{
    position:absolute;left:50%;bottom:14%;transform:translateX(-50%);height:62%;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));z-index:1;
    transition:transform .15s ease;
  }
  .fighter-figure svg{height:100%;width:auto;display:block;aspect-ratio:120/240;}
  .fighter-figure.hit{animation:fighterHit .35s ease;}
  @keyframes fighterHit{
    0%{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(1);}
    30%{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(2.6);transform:translateX(-50%) translateX(6px);}
    100%{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(1);transform:translateX(-50%);}
  }
  .fighter-figure.fallen{animation:fighterFall .6s ease forwards;}
  @keyframes fighterFall{to{transform:translateX(-50%) rotate(78deg) translateY(30px);opacity:.35;}}

  .viewmodel{position:absolute;bottom:-6%;width:46%;z-index:2;pointer-events:none;}
  .viewmodel svg{width:100%;height:auto;display:block;aspect-ratio:200/220;}
  .viewmodel.sword{right:-6%;transform-origin:100% 100%;transition:transform .12s ease;}
  .viewmodel.shield{left:-6%;color:var(--gold-dim);transform-origin:0% 100%;transition:transform .12s ease;}
  .viewmodel.sword.swing{animation:swordSwing .32s ease;}
  @keyframes swordSwing{0%{transform:rotate(0deg);}40%{transform:rotate(-38deg) translate(-14px,-8px);}100%{transform:rotate(0deg);}}
  .viewmodel.sword.swing.power{animation-duration:.42s;}
  .viewmodel.shield.raise{animation:shieldRaise .4s ease;}
  @keyframes shieldRaise{0%{transform:translateY(0);}35%{transform:translateY(-22px) scale(1.05);}100%{transform:translateY(0);}}

  .combat-flash{position:absolute;inset:0;background:var(--blood);opacity:0;pointer-events:none;z-index:4;}
  .combat-flash.hit{animation:combatFlash .35s ease;}
  @keyframes combatFlash{0%{opacity:0;}25%{opacity:.35;}100%{opacity:0;}}

  /* ---------- Impact juice: screen shake + particle burst on a landed hit ---------- */
  .arena-scene.shake{animation:shakeSm .28s ease;}
  .arena-scene.shake-strong{animation:shakeBig .38s ease;}
  @keyframes shakeSm{
    0%,100%{transform:translate(0,0);} 20%{transform:translate(-4px,2px);}
    40%{transform:translate(3px,-3px);} 60%{transform:translate(-3px,1px);} 80%{transform:translate(2px,-1px);}
  }
  @keyframes shakeBig{
    0%,100%{transform:translate(0,0) rotate(0);} 15%{transform:translate(-9px,5px) rotate(-.6deg);}
    30%{transform:translate(8px,-6px) rotate(.6deg);} 45%{transform:translate(-7px,4px) rotate(-.4deg);}
    60%{transform:translate(6px,-3px) rotate(.4deg);} 75%{transform:translate(-4px,2px) rotate(-.2deg);}
    90%{transform:translate(2px,-1px) rotate(0);}
  }
  .impact-particles{position:fixed; top:26%; left:50%; width:0; height:0; pointer-events:none; z-index:150;}
  .impact-particles .particle{
    position:absolute; left:0; top:0; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:var(--pcolor,#D9A066); opacity:0;
    transform:rotate(var(--a,0deg)) translateX(0);
  }
  .impact-particles.burst .particle{animation:particleFly .5s cubic-bezier(.15,.7,.3,1) both;}
  @keyframes particleFly{
    0%{opacity:1; transform:rotate(var(--a,0deg)) translateX(2px) scale(1);}
    100%{opacity:0; transform:rotate(var(--a,0deg)) translateX(38px) scale(.4);}
  }
  .impact-particles .particle:nth-child(1){--a:0deg; --pcolor:#D9A066;}
  .impact-particles .particle:nth-child(2){--a:40deg; --pcolor:#B4453A;}
  .impact-particles .particle:nth-child(3){--a:80deg; --pcolor:#E8C48C;}
  .impact-particles .particle:nth-child(4){--a:120deg; --pcolor:#8E3227;}
  .impact-particles .particle:nth-child(5){--a:160deg; --pcolor:#D9A066;}
  .impact-particles .particle:nth-child(6){--a:200deg; --pcolor:#B4453A;}
  .impact-particles .particle:nth-child(7){--a:240deg; --pcolor:#E8C48C;}
  .impact-particles .particle:nth-child(8){--a:280deg; --pcolor:#8E3227;}
  .impact-particles .particle:nth-child(9){--a:320deg; --pcolor:#D9A066;}
  .impact-particles .particle:nth-child(9),.impact-particles .particle:nth-child(3){width:4px;height:4px;margin:-2px 0 0 -2px;}
  .impact-particles .particle:nth-child(2),.impact-particles .particle:nth-child(6){width:8px;height:8px;margin:-4px 0 0 -4px;}

  .combat-callout{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); z-index:5;
    font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--ink);
    text-shadow:0 3px 10px rgba(0,0,0,.7); text-align:center; pointer-events:none; white-space:nowrap;
    animation:calloutPop .55s cubic-bezier(.2,.8,.3,1.2) both;

  .combat-log-strip{
    display:flex; flex-direction:column; gap:2px; padding:8px 4px; font-size:.76rem; color:var(--muted);
    text-align:center; min-height:36px;
  }
  .combat-log-strip p:last-child{color:var(--ink);font-weight:600;}

  .action-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  @media (min-width:440px){ .action-row{grid-template-columns:repeat(4,1fr);} }
  .action-row .btn{flex-direction:column;padding:11px 6px;gap:4px;font-size:.72rem;}
  .action-row .icon{width:1.15rem;height:1.15rem;}

  /* ---------- Full-screen combat ---------- */
  .combat-player-hud{
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:14px; z-index:4;
    display:flex; align-items:center; gap:7px;
    background:color-mix(in srgb, var(--bg) 55%, transparent);
    padding:5px 11px; border-radius:var(--r-pill); border:1px solid var(--border-soft);
    font-size:.72rem; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .combat-player-hud .hpbar{width:46px;height:7px;}
  .combat-player-hud .gold{color:var(--gold);display:flex;align-items:center;gap:3px;}
  .combat-player-hud .gold .icon{width:.85em;height:.85em;}

  body.combat-fullscreen{overflow:hidden;}
  body.combat-fullscreen #root{max-width:none;padding:0;}
  body.combat-fullscreen .hud{display:none;}
  body.combat-fullscreen #app{height:100dvh;}
  body.combat-fullscreen .combat-view{
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  }
  body.combat-fullscreen .arena-scene{
    flex:1; height:auto; min-height:0; border-radius:0; border:none; box-shadow:none;
  }
  body.combat-fullscreen .boss-bar{top:calc(env(safe-area-inset-top,0px) + 46px);}
  /* log-strip and action-row are normal flex children below the scene
     (not absolutely positioned over it), so their heights can never
     overlap the joystick or each other regardless of content/font size. */
  body.combat-fullscreen .combat-log-strip{
    flex-shrink:0; margin:0; background:color-mix(in srgb, var(--surface) 94%, transparent);
  }
  body.combat-fullscreen .action-row{
    flex-shrink:0; margin:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--surface);
  }

  /* ---------- Crosshair ---------- */
  /* Fixed in the middle of the screen (roughly headshot height on the
     centered fighter figure) rather than tracking the mouse -- works
     identically on touch and desktop; tap/click anywhere to swing. */
  .crosshair{
    position:fixed; top:26%; left:50%; width:36px; height:36px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:200;
    color:var(--ink); display:none;
  }
  .crosshair.active{display:block;}
  .crosshair svg{width:100%;height:100%;filter:drop-shadow(0 0 3px rgba(0,0,0,.8));}
  .crosshair.locked-on{color:var(--blood);}
  .crosshair-tag{
    position:absolute; top:40px; left:50%; transform:translateX(-50%);
    font-size:.62rem; font-weight:800; letter-spacing:.08em; color:var(--blood); white-space:nowrap;
    text-shadow:0 1px 5px rgba(0,0,0,.7); opacity:0;
  }
  .crosshair.locked-on .crosshair-tag{opacity:1;}

  /* ---------- Stats overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
    background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:overlayIn .25s ease both;
  }
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .card-modal{
    width:100%;max-width:320px;text-align:center;padding:28px 22px 22px;
    background:var(--surface);border:1px solid var(--gold-dim);border-radius:var(--r-lg);
    box-shadow:0 20px 60px var(--shadow);animation:resultIn .4s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes resultIn{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .result-icon{width:2.6rem;height:2.6rem;margin-bottom:10px;}
  .card-modal.win .result-icon{color:var(--gold);}
  .card-modal.loss .result-icon{color:var(--blood);}
  .card-modal.fled .result-icon{color:var(--muted);}
  .card-modal h2{font-size:1.4rem;margin-bottom:10px;}
  .card-modal p{color:var(--muted);font-size:.86rem;margin-bottom:4px;}
  .card-modal .btn{margin-top:16px;}
  .stats-modal{text-align:left;max-height:82vh;display:flex;flex-direction:column;}
  .stats-modal h2{text-align:center;margin-bottom:14px;flex-shrink:0;}
  .stats-scroll{overflow-y:auto;flex:1 1 auto;min-height:0;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:.86rem;margin-bottom:16px;}
  .stats-grid dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;}
  .stats-grid dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;}
  .achievements-heading{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;flex-shrink:0;}
  .achievements-heading h3{font-size:.86rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);}
  .achievements-heading span{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;}
  .achievements-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;margin-bottom:4px;}
  .achievement-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-soft);opacity:.5;}
  .achievement-item.unlocked{opacity:1;border-color:var(--gold-dim);background:color-mix(in srgb, var(--gold) 9%, var(--surface-2));}
  .achievement-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--muted);flex-shrink:0;}
  .achievement-icon .icon{width:.9em;height:.9em;}
  .achievement-item.unlocked .achievement-icon{background:var(--gold-dim);color:var(--gold-ink);}
  .achievement-name{font-weight:700;font-size:.8rem;}
  .achievement-desc{font-size:.7rem;color:var(--muted);line-height:1.3;}
  .reset-link{
    display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);
    font-size:.72rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.7;
  }
  .reset-link:hover{opacity:1;color:var(--blood);}
  .reset-confirm{margin-top:10px;text-align:center;font-size:.8rem;color:var(--muted);}
  .reset-confirm-actions{display:flex;gap:8px;justify-content:center;margin-top:10px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);
    max-width:calc(100% - 32px);padding:12px 18px;background:var(--surface-3);color:var(--ink);
    border:1px solid var(--gold-dim);border-radius:var(--r-pill);font-size:.82rem;font-weight:600;
    box-shadow:0 10px 30px var(--shadow);z-index:60;transition:transform .3s cubic-bezier(.2,.9,.3,1);
    text-align:center;
  }
  .toast.show{transform:translate(-50%,0);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
  }

<script>
(function(){
  'use strict';

  // ------------------------------------------------------------------
  // Data
  // ------------------------------------------------------------------
  var SLOTS = ['Helmet','Chest','Shield'];
  var SHOP_TABS = ['Weapon'].concat(SLOTS);
  var ROMAN = ['I','II','III','IV','V','VI','VII','VIII'];

  var ARMOR_CATALOG = [
    {name:'Leather Cap',    slot:'Helmet', defense:2,  price:20},
    {name:'Bronze Helm',    slot:'Helmet', defense:5,  price:60},
    {name:'Iron Helm',      slot:'Helmet', defense:9,  price:140},
    {name:'Spartan Helm',   slot:'Helmet', defense:14, price:260},
    {name:'Padded Tunic',   slot:'Chest',  defense:3,  price:30},
    {name:'Bronze Cuirass', slot:'Chest',  defense:8,  price:90},
    {name:'Iron Plate',     slot:'Chest',  defense:14, price:200},
    {name:'Myrmillo Plate', slot:'Chest',  defense:22, price:380},
    {name:'Wooden Buckler', slot:'Shield', defense:3,  price:25},
    {name:'Bronze Scutum',  slot:'Shield', defense:7,  price:80},
    {name:'Iron Scutum',    slot:'Shield', defense:13, price:180},
    {name:'Tower Shield',   slot:'Shield', defense:20, price:340}
  ];

  var WEAPON_CATALOG = [
    {name:'Gladius',   attack:2,  price:25,  blade:1, desc:'Short Roman stabbing sword'},
    {name:'Spatha',    attack:5,  price:70,  blade:2, desc:'Long straight cavalry blade'},
    {name:'Falx',      attack:9,  price:160, blade:3, desc:'Curved Dacian war blade'},
    {name:'Rhomphaia', attack:14, price:300, blade:4, desc:'Massive Thracian great-blade'}
  ];

  var OPPONENTS = [
    {name:'Straw Dummy',             maxHp:20,  attack:3,  defense:0,  gold:10,  taunt:'It does not move.', dummy:true},
    {name:'Rusty Marcus',            maxHp:28,  attack:6,  defense:1,  gold:22,  taunt:'Fresh meat for the sand!',
      gear:{metal:'#9C7A5A',metalDark:'#7A5C42',plume:'#7A6840',plumeDark:'#5C4E2E',cloth:'#5B4A32',clothLight:'#7A6248'}},
    {name:'Titus the Bull',          maxHp:40,  attack:9,  defense:3,  gold:38,  taunt:"I'll crush you like a grape!",
      gear:{metal:'#4A4A50',metalDark:'#34343A',plume:'#3A2E22',plumeDark:'#241C14',cloth:'#4A3524',clothLight:'#6B4A2E'}},
    {name:'Flavia Ironfist',         maxHp:50,  attack:12, defense:5,  gold:58,  taunt:'Show me your worst, weakling.',
      gear:{metal:'#8A8A92',metalDark:'#6A6A70',plume:'#4A7A6E',plumeDark:'#345850',cloth:'#5B3A5E',clothLight:'#7A5178'}},
    {name:'Brutus Maximus',          maxHp:65,  attack:15, defense:6,  gold:85,  taunt:'None have survived me.',
      gear:{metal:'#38383E',metalDark:'#242428',plume:'#241A1A',plumeDark:'#140E0E',cloth:'#2A2018',clothLight:'#3E2E20'}},
    {name:'The Retiarius',           maxHp:78,  attack:18, defense:8,  gold:120, taunt:'Net or trident — pick your death.', trident:true,
      gear:{metal:'#B08858',metalDark:'#8A6840',plume:'#8A8060',plumeDark:'#6A6248',cloth:'#7A6A54',clothLight:'#9A8868'}},
    {name:'Crixus the Undefeated',   maxHp:95,  attack:22, defense:10, gold:170, taunt:'I am undefeated. You are next.',
      gear:{metal:'#9A8258',metalDark:'#7A6840',plume:'#C9A24A',plumeDark:'#9C7A32',cloth:'#5B3A26',clothLight:'#7A5133'}},
    {name:"The Emperor's Champion",  maxHp:125, attack:27, defense:13, gold:260, taunt:'For glory and the Emperor!',
      gear:{metal:'#A08858',metalDark:'#7E6A42',plume:'#7A3E8E',plumeDark:'#5A2C6E',cloth:'#4A2E5B',clothLight:'#6B4478'}}
  ];

  var STARTING_GOLD = 30, STARTING_MAX_HP = 50, STARTING_ATTACK = 8, STARTING_DEFENSE = 1;
  var MISS_CHANCE = .08, CRIT_CHANCE = .12, CRIT_MULT = 1.5, POWER_MULT = 1.5;
  var ENEMY_POWER_MULT = 1.4, ENEMY_HESITATE_CHANCE = .12, ENEMY_POWER_CHANCE = .15;
  var ACTION_COOLDOWN_MS = 450;
  var ENEMY_TURN_MIN_MS = 1000, ENEMY_TURN_MAX_MS = 1700;
  var ENEMY_MISS_CHANCE = .10, ENEMY_DODGE_BONUS = .18;
  var COMBO_MAX_BONUS = 10;
  var HEAL_SMALL_AMOUNT = 20, HEAL_SMALL_COST = 10, GOLD_PER_HP_FULL = 1;
  var ARMORER_LINES = [
    'Steel keeps you breathing, friend.',
    'Bronze is cheap. Cheap gets you killed.',
    'Iron for those who mean business.',
    'A good shield outlives a good sword arm.'
  ];

  function findArmor(name){ for (var i=0;i<ARMOR_CATALOG.length;i++){ if (ARMOR_CATALOG[i].name===name) return ARMOR_CATALOG[i]; } return null; }
  function findWeapon(name){ for (var i=0;i<WEAPON_CATALOG.length;i++){ if (WEAPON_CATALOG[i].name===name) return WEAPON_CATALOG[i]; } return null; }
  function armorForSlot(slot){ return ARMOR_CATALOG.filter(function(a){ return a.slot===slot; }); }
  function slotIcon(slot){ return slot==='Helmet' ? 'i-helm' : (slot==='Chest' ? 'i-chest' : (slot==='Shield' ? 'i-shield' : 'i-sword')); }
  function pct(v,max){ return Math.max(0, Math.min(100, 100*v/Math.max(1,max))); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  // ------------------------------------------------------------------
  // Player
  // ------------------------------------------------------------------
  function freshPlayer(){
    return {
      maxHp: STARTING_MAX_HP, hp: STARTING_MAX_HP,
      baseAttack: STARTING_ATTACK, baseDefense: STARTING_DEFENSE,
      gold: STARTING_GOLD, armor: {Helmet:null, Chest:null, Shield:null}, weapon: null,
      wins: 0, losses: 0, opponentIndex: 0
    };
  }
  function pAttack(p){
    var w = p.weapon ? findWeapon(p.weapon) : null;
    return p.baseAttack + p.wins + (w ? w.attack : 0);
  }
  function pDefense(p){
    var bonus = 0;
    SLOTS.forEach(function(slot){
      var piece = p.armor[slot] ? findArmor(p.armor[slot]) : null;
      if (piece) bonus += piece.defense;
    });
    return p.baseDefense + bonus;
  }
  function weaponBlade(p){ var w = p.weapon ? findWeapon(p.weapon) : null; return w ? w.blade : 0; }
  function nextOpponent(p){ return OPPONENTS[Math.max(0, Math.min(p.opponentIndex, OPPONENTS.length-1))]; }
  function isChampion(p){ return p.opponentIndex >= OPPONENTS.length-1 && p.wins >= OPPONENTS.length; }
  function healPlayer(p, amount){ var before=p.hp; p.hp=Math.min(p.maxHp,p.hp+amount); return p.hp-before; }
  function recordWin(p, opp){ p.gold+=opp.gold; p.wins+=1; if (p.opponentIndex < OPPONENTS.length-1) p.opponentIndex+=1; }
  function recordLoss(p){ p.losses+=1; p.hp=Math.max(1, Math.floor(p.maxHp/2)); }

  var SAVE_KEY = 'gladiator-arena-save-v1';
  function loadGame(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return freshPlayer();
      var d = JSON.parse(raw), p = freshPlayer();
      p.maxHp = Number(d.maxHp||p.maxHp);
      p.hp = Number(d.hp!=null ? d.hp : p.maxHp);
      p.baseAttack = Number(d.baseAttack!=null ? d.baseAttack : p.baseAttack);
      p.baseDefense = Number(d.baseDefense!=null ? d.baseDefense : p.baseDefense);
      p.gold = Number(d.gold!=null ? d.gold : p.gold);
      var sa = d.armor||{};
      SLOTS.forEach(function(slot){ p.armor[slot] = sa[slot]!=null ? sa[slot] : null; });
      p.weapon = d.weapon || null;
      p.wins = Number(d.wins||0);
      p.losses = Number(d.losses||0);
      p.opponentIndex = Math.max(0, Math.min(Number(d.opponentIndex||0), OPPONENTS.length-1));
      return p;
    } catch(e){ return freshPlayer(); }
  }
  function saveGame(p){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p)); } catch(e){} }

  // ------------------------------------------------------------------
  // Lifetime stats + achievements
  // ------------------------------------------------------------------
  var STATS_KEY = 'gladiator-arena-stats-v1';
  function freshStats(){
    return {
      totalDamageDealt: 0, totalHeadshots: 0, totalCrits: 0,
      bestCombo: 0, bestHeadshotsInFight: 0, flawlessWins: 0,
      totalGoldEarned: 0, winStreak: 0, bestWinStreak: 0, lowHpWins: 0
    };
  }
  function loadStats(){
    try {
      var raw = localStorage.getItem(STATS_KEY);
      var s = freshStats();
      if (!raw) return s;
      var d = JSON.parse(raw);
      Object.keys(s).forEach(function(k){ if (typeof d[k] === 'number') s[k] = d[k]; });
      return s;
    } catch(e){ return freshStats(); }
  }
  function saveStats(){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch(e){} }
  var stats = loadStats();

  var ACH_KEY = 'gladiator-arena-achievements-v1';
  function loadUnlocked(){
    try { var raw = localStorage.getItem(ACH_KEY); return raw ? JSON.parse(raw) : {}; }
    catch(e){ return {}; }
  }
  function saveUnlocked(){ try{ localStorage.setItem(ACH_KEY, JSON.stringify(unlocked)); } catch(e){} }
  var unlocked = loadUnlocked();

  var ACHIEVEMENTS = [
    {id:'first-blood', name:'First Blood', desc:'Win your first bout in the arena.',
      check:function(s,p){ return p.wins >= 1; }},
    {id:'flawless', name:'Flawless Victory', desc:'Win a fight without taking a single hit.',
      check:function(s,p){ return s.flawlessWins >= 1; }},
    {id:'executioner', name:'Executioner', desc:'Land 3 head shots in one fight.',
      check:function(s,p){ return s.bestHeadshotsInFight >= 3; }},
    {id:'combo-master', name:'Combo Master', desc:'Reach a x5 combo in a single fight.',
      check:function(s,p){ return s.bestCombo >= 5; }},
    {id:'iron-wallet', name:'Iron Wallet', desc:'Earn 500 gold over your career.',
      check:function(s,p){ return s.totalGoldEarned >= 500; }},
    {id:'fully-armored', name:'Fully Armored', desc:'Equip a Helmet, Chest piece, and Shield.',
      check:function(s,p){ return !!(p.armor.Helmet && p.armor.Chest && p.armor.Shield); }},
    {id:'master-at-arms', name:'Master at Arms', desc:'Wield the Rhomphaia, deadliest of blades.',
      check:function(s,p){ return p.weapon === 'Rhomphaia'; }},
    {id:'win-streak', name:'On a Roll', desc:'Win 5 bouts in a row without a loss.',
      check:function(s,p){ return s.bestWinStreak >= 5; }},
    {id:'close-call', name:'Close Call', desc:'Win a fight after dropping below 15% HP.',
      check:function(s,p){ return s.lowHpWins >= 1; }},
    {id:'champion', name:'Champion of the Arena', desc:"Defeat the Emperor's Champion.",
      check:function(s,p){ return isChampion(p); }}
  ];

  function checkAchievements(){
    var justUnlocked = [];
    ACHIEVEMENTS.forEach(function(a){
      if (unlocked[a.id]) return;
      if (a.check(stats, player)){
        unlocked[a.id] = Date.now();
        justUnlocked.push(a);
      }
    });
    if (justUnlocked.length){
      saveUnlocked();
      sfx.achievement();
      toast((justUnlocked.length>1 ? justUnlocked.length+' achievements unlocked!' : 'Achievement unlocked: '+justUnlocked[0].name));
    }
  }

  // ------------------------------------------------------------------
  // Combat
  // ------------------------------------------------------------------
  function rollDamage(atk, dfn, forceCrit){
    var dmg = Math.max(1, atk - dfn + (Math.floor(Math.random()*5)-2));
    var crit = !!forceCrit || (Math.random() < CRIT_CHANCE);
    if (crit) dmg = Math.floor(dmg*CRIT_MULT)+1;
    return {dmg:dmg, crit:crit};
  }
  function Combat(player, opponent){
    this.player = player; this.opponent = opponent; this.enemyHp = opponent.maxHp;
    this.log = ['“'+opponent.taunt+'”']; this.defending = false; this.result = null;
    this.lastHit = null; this.lastAction = null; this.lastLine = this.log[0];
    this.lastMiss = false; this.lastCrit = false; this.lastHeadshot = false;
    this.lastDodge = false;
    this.combo = 0;
    this.nextActionAt = 0;
    this.totalDamageDealt = 0; this.headshots = 0; this.crits = 0;
    this.maxCombo = 0; this.tookDamage = false; this.minHpSeen = player.hp;
  }
  Combat.prototype.isOver = function(){ return this.result !== null; };
  Combat.prototype.canAct = function(){ return !this.isOver() && Date.now() >= this.nextActionAt; };
  Combat.prototype.attack = function(power, forceCrit){
    if (!this.canAct()) return;
    this.defending = false; this.lastHit = null; this.lastAction = power ? 'power' : 'attack';
    this.lastMiss = false; this.lastCrit = false; this.lastHeadshot = !!forceCrit;
    if (!forceCrit && Math.random() < MISS_CHANCE){
      this.lastLine = 'You swing and miss!';
      this.lastMiss = true;
      this.combo = 0;
    } else {
      var comboBonus = Math.min(this.combo, COMBO_MAX_BONUS);
      var atk = power ? Math.floor(pAttack(this.player)*POWER_MULT) : pAttack(this.player);
      var r = rollDamage(atk, this.opponent.defense, forceCrit);
      var dmg = r.dmg + comboBonus;
      this.enemyHp = Math.max(0, this.enemyHp - dmg);
      this.lastHit = 'enemy';
      this.lastCrit = r.crit;
      this.combo += 1;
      this.totalDamageDealt += dmg;
      if (forceCrit) this.headshots += 1;
      if (r.crit) this.crits += 1;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      var verb = power ? 'smash' : (forceCrit ? 'skewer' : 'strike');
      var tag = forceCrit ? ' HEADSHOT!' : (r.crit ? ' CRITICAL!' : '');
      var comboTag = comboBonus > 0 ? ' [combo x'+this.combo+', +'+comboBonus+']' : '';
      this.lastLine = 'You '+verb+' for '+dmg+'!'+tag+comboTag;
    }
    this.log.push(this.lastLine);
    this.nextActionAt = Date.now() + ACTION_COOLDOWN_MS;
    this._checkEnd();
  };
  Combat.prototype.defend = function(){
    if (!this.canAct()) return;
    this.defending = true; this.lastHit = null; this.lastAction = 'defend';
    this.lastMiss = false; this.lastCrit = false; this.lastHeadshot = false;
    var healed = healPlayer(this.player, 2);
    this.lastLine = 'You brace behind your shield.'+(healed?' (+'+healed+' HP)':'');
    this.log.push(this.lastLine);
    this.nextActionAt = Date.now() + ACTION_COOLDOWN_MS;
  };
  Combat.prototype.flee = function(){
    if (this.isOver()) return;
    this.result = 'fled'; this.lastAction = 'flee';
    this.lastLine = 'You flee the arena!';
    this.log.push(this.lastLine);
  };
  Combat.prototype._enemyTurn = function(isPlayerMoving){
    if (this.isOver()) return;
    this.lastHit = null;
    this.lastDodge = false;
    var roll = Math.random();
    if (roll < ENEMY_HESITATE_CHANCE){
      this.log.push(this.opponent.name+' hesitates, catching their breath.');
    } else if (Math.random() < ENEMY_MISS_CHANCE + (isPlayerMoving ? ENEMY_DODGE_BONUS : 0)){
      this.lastDodge = true;
      this.log.push(isPlayerMoving ? 'You dodge out of the way!' : this.opponent.name+' swings and misses!');
    } else {
      var power = roll > (1-ENEMY_POWER_CHANCE);
      var atk = power ? Math.floor(this.opponent.attack*ENEMY_POWER_MULT) : this.opponent.attack;
      var r = rollDamage(atk, pDefense(this.player));
      var dmg = this.defending ? Math.max(1, Math.floor(r.dmg/2)) : r.dmg;
      this.player.hp = Math.max(0, this.player.hp - dmg);
      this.lastHit = 'player';
      this.combo = 0;
      this.tookDamage = true;
      this.minHpSeen = Math.min(this.minHpSeen, this.player.hp);
      this.log.push(this.opponent.name+' '+(power?'crushes':'hits')+' you for '+dmg+'!'+(r.crit?' CRITICAL!':''));
    }
    this.defending = false;
    this._checkEnd();
  };
  Combat.prototype._checkEnd = function(){
    if (this.enemyHp <= 0){ this.result = 'win'; this.log.push(this.opponent.name+' falls! Victory!'); }
    else if (this.player.hp <= 0){ this.result = 'loss'; this.log.push('You collapse in the sand...'); }
  };

  // ------------------------------------------------------------------
  // App state
  // ------------------------------------------------------------------
  var player = loadGame();
  var view = 'hub';
  var combat = null;
  var armorerSlot = 'Weapon';
  var npcLine = pick(ARMORER_LINES);
  var resultOverlay = null;
  var showStats = false;
  var confirmingReset = false;
  var toastTimer = null;

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }

  function clearToast(){
    clearTimeout(toastTimer);
    document.getElementById('toast').classList.remove('show');
  }

  // ------------------------------------------------------------------
  // Sound — procedural Web Audio, no external audio files
  // ------------------------------------------------------------------
  var SOUND_KEY = 'gladiator-arena-sound';
  var soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch(e){}
  var audioCtx = null;

  function ensureAudio(){
    if (!soundOn) return null;
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended'){
      try { audioCtx.resume(); } catch(e){}
    }
    return audioCtx;
  }

  function beep(freq, duration, type, gainPeak, delay){
    var ctx = ensureAudio();
    if (!ctx) return;
    delay = delay || 0;
    var t0 = ctx.currentTime + delay;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(gainPeak||0.2, 0.001), t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+duration+0.03);
  }

  function noiseBurst(duration, gainPeak, freq){
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var size = Math.max(1, Math.floor(ctx.sampleRate*duration));
    var buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i=0;i<size;i++){ data[i] = (Math.random()*2-1) * (1 - i/size); }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = freq || 1600;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(gainPeak||0.3, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    noise.start(t0);
  }

  var sfx = {
    swordHit:  function(){ noiseBurst(0.11, 0.35, 2200); beep(170, 0.1, 'square', 0.14); },
    swordMiss: function(){ beep(700, 0.07, 'sine', 0.07); },
    crit:      function(){ noiseBurst(0.16, 0.4, 2600); beep(280,0.16,'sawtooth',0.16); beep(560,0.13,'sawtooth',0.11,0.06); },
    block:     function(){ noiseBurst(0.09, 0.22, 900); beep(150,0.12,'triangle',0.12); },
    playerHurt:function(){ beep(120, 0.18, 'sawtooth', 0.18); },
    coin:      function(){ beep(1200,0.06,'square',0.09); beep(1600,0.09,'square',0.09,0.05); },
    equip:     function(){ beep(440,0.08,'triangle',0.14); beep(660,0.1,'triangle',0.11,0.06); },
    heal:      function(){ beep(520,0.09,'sine',0.12); beep(780,0.13,'sine',0.09,0.07); },
    deny:      function(){ beep(180,0.12,'square',0.1); },
    victory:   function(){ [523,659,784,1046].forEach(function(f,i){ beep(f,0.22,'triangle',0.15,i*0.11); }); },
    defeat:    function(){ beep(220,0.3,'sawtooth',0.14); beep(160,0.4,'sawtooth',0.14,0.18); },
    flee:      function(){ beep(800,0.05,'sine',0.08); beep(500,0.08,'sine',0.06,0.05); },
    step:      function(){ noiseBurst(0.045, 0.05, 500); },

  function updateSoundIcon(){
    var use = document.getElementById('sound-icon');
    if (use) use.setAttribute('href', soundOn ? '#i-sound-on' : '#i-sound-off');
  }

  function toggleSound(){
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch(e){}
    updateSoundIcon();
    if (soundOn) sfx.equip();
  }

  // ------------------------------------------------------------------
  // Fixed center-screen crosshair (combat only) -- pinned in place via
  // CSS (see .crosshair), not mouse-tracked, so it works identically on
  // touch and desktop. Tapping/clicking anywhere in the arena swings;
  // whether that swing is a head shot depends on whether the fixed
  // crosshair point currently falls within the fighter's head zone.
  // ------------------------------------------------------------------
  var aiming = false;

  function enterAimMode(){
    var sceneEl = document.querySelector('.arena-scene');
    if (!sceneEl) return;
    aiming = true;
    sceneEl.classList.add('aiming');
    document.getElementById('crosshair').classList.add('active');
    updateCrosshair();
  }

  function exitAimMode(){
    aiming = false;
    var ch = document.getElementById('crosshair');
    if (ch) ch.classList.remove('active','locked-on');
    var sceneEl = document.querySelector('.arena-scene');
    if (sceneEl) sceneEl.classList.remove('aiming');
  }

  function updateCrosshair(){
    var ch = document.getElementById('crosshair');
    if (!ch) return;
    var fighter = document.querySelector('.fighter-figure');
    var lockedOn = false;
    if (fighter){
      var fr = fighter.getBoundingClientRect();
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight * 0.26;
      if (fr.width > 0 && cx >= fr.left && cx <= fr.right &&
          cy >= fr.top && cy <= fr.top + fr.height*0.32){
        lockedOn = true;
      }
    }
    ch.classList.toggle('locked-on', lockedOn);
  }

  // Impact juice: a brief screen shake + a burst of dust/spark particles
  // at the fixed crosshair point whenever a hit actually lands, in either
  // direction. Re-triggerable mid-animation via the remove/reflow/re-add
  // pattern, since hits can land in quick succession.
  function shakeScreen(strong){
    var el = document.querySelector('.arena-scene');
    if (!el) return;
    el.classList.remove('shake','shake-strong');
    void el.offsetWidth;
    el.classList.add(strong ? 'shake-strong' : 'shake');
  }
  function burstParticles(){
    var el = document.getElementById('impact-particles');
    if (!el) return;
    el.classList.remove('burst');
    void el.offsetWidth;
    el.classList.add('burst');
  }
  function playImpactFx(){
    if (!combat || !combat.lastHit) return;
    shakeScreen(!!(combat.lastCrit || combat.lastHeadshot));
    burstParticles();
  }

  function onAimClick(){
    if (!aiming || !combat || !combat.canAct()) return;
    var ch = document.getElementById('crosshair');
    var headshot = !!(ch && ch.classList.contains('locked-on'));
    combat.attack(false, headshot);
    playCombatSfx();
    render();
    updateCrosshair();
    playImpactFx();
    if (combat.isOver()){
      clearEnemyTimer();
      setTimeout(finishCombat, 700);
    }
  }

  function playCombatSfx(){
    if (!combat) return;
    if (combat.lastAction === 'attack' || combat.lastAction === 'power'){
      if (combat.lastMiss) sfx.swordMiss();
      else if (combat.lastHeadshot || combat.lastCrit) sfx.crit();
      else sfx.swordHit();
    } else if (combat.lastAction === 'defend'){
      sfx.block();
    } else if (combat.lastAction === 'flee'){
      sfx.flee();
    }
    if (combat.lastHit === 'player'){
      setTimeout(function(){ sfx.playerHurt(); }, 160);
    }
  }

  // ------------------------------------------------------------------
  // Walkable courtyard — WASD movement, like walking up to an NPC
  // ------------------------------------------------------------------
  var NPC_TARGETS = { armorer: 20, healer: 50, arenaMaster: 80 };
  var NPC_LABELS = { armorer: 'Magnus', healer: 'Vita', arenaMaster: 'Dominus' };
  var courtyard = { x: 50, z: 0 };
  var COURTYARD_SPEED = 1.7;
  var keysDown = {};
  var joystick = { active: false, dx: 0, dz: 0 };
  var JOYSTICK_MAX = 38;
  var joystickPointerId = null;
  var nearNpc = null;
  var courtyardRAF = null;

  function resetCourtyard(){ courtyard.x = 50; courtyard.z = 0; nearNpc = null; }

  function computeNearNpc(){
    if (courtyard.z < 68) return null;
    var best = null, bestDist = 15;
    Object.keys(NPC_TARGETS).forEach(function(key){
      var d = Math.abs(NPC_TARGETS[key] - courtyard.x);
      if (d < bestDist){ bestDist = d; best = key; }
    });
    return best;
  }

  function updateCourtyardVisual(){
    var layer = document.getElementById('courtyard-layer');
    if (!layer) return;
    var scale = 1 + (courtyard.z/100)*0.6;
    var shiftPct = -(courtyard.x-50)*0.9;
    layer.style.transform = 'translateX('+shiftPct.toFixed(2)+'%) scale('+scale.toFixed(3)+')';

    var near = computeNearNpc();
    if (near !== nearNpc){
      nearNpc = near;
      var prompt = document.getElementById('courtyard-prompt');
      if (prompt){
        if (nearNpc){
          prompt.textContent = 'Tap or press E to talk to ' + NPC_LABELS[nearNpc];
          prompt.classList.add('show');
        } else {
          prompt.classList.remove('show');
        }
      }
    }
  }

  var lastStepSfx = 0;
  function startCourtyardLoop(){
    stopCourtyardLoop();
    function tick(){
      if (view !== 'hub'){ courtyardRAF = null; return; }
      if (!showStats && !confirmingReset && !resultOverlay){
        var dx = 0, dz = 0;
        if (keysDown.a || keysDown.arrowleft) dx -= 1;
        if (keysDown.d || keysDown.arrowright) dx += 1;
        if (keysDown.w || keysDown.arrowup) dz += 1;
        if (keysDown.s || keysDown.arrowdown) dz -= 1;
        if (joystick.active){ dx += joystick.dx; dz += joystick.dz; }
        var mag = Math.sqrt(dx*dx + dz*dz);
        if (mag > 1){ dx /= mag; dz /= mag; }
        if (dx || dz){
          courtyard.x = Math.max(4, Math.min(96, courtyard.x + dx*COURTYARD_SPEED));
          courtyard.z = Math.max(0, Math.min(100, courtyard.z + dz*COURTYARD_SPEED));
          updateCourtyardVisual();
          var now = (window.performance && performance.now) ? performance.now() : Date.now();
          if (now - lastStepSfx > 250){ sfx.step(); lastStepSfx = now; }
        }
      }
      courtyardRAF = requestAnimationFrame(tick);
    }
    courtyardRAF = requestAnimationFrame(tick);
  }

  function stopCourtyardLoop(){
    if (courtyardRAF) cancelAnimationFrame(courtyardRAF);
    courtyardRAF = null;
  }

  var MOVE_KEYS = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
  document.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if ((view === 'hub' || view === 'combat') && MOVE_KEYS.indexOf(k) !== -1){
      keysDown[k] = true;
      e.preventDefault();
    }
    if (view === 'hub' && (k === 'e' || k === 'enter' || k === ' ')){
      var focused = document.activeElement;
      if (focused && (focused.tagName === 'BUTTON' || focused.tagName === 'A')) return;
      if (nearNpc){
        e.preventDefault();
        if (nearNpc === 'armorer') npcLine = pick(ARMORER_LINES);
        navigate(nearNpc);
      }
    }
  });
  document.addEventListener('keyup', function(e){ keysDown[e.key.toLowerCase()] = false; });

  // On-screen joystick — drag-to-move, Minecraft-style. Pointer-driven and
  // keyboard-independent, so it works regardless of whether the page has
  // keyboard focus (and on touch devices, which have no WASD at all).
  function joystickCenter(){
    var el = document.getElementById('joystick');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }
  function joystickStart(e){
    var el = document.getElementById('joystick');
    if (!el) return;
    joystickPointerId = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    el.classList.add('active');
    joystickMove(e);
  }
  function joystickMove(e){
    if (joystickPointerId === null || e.pointerId !== joystickPointerId) return;
    var c = joystickCenter();
    if (!c) return;
    var ox = e.clientX - c.x, oy = e.clientY - c.y;
    var dist = Math.min(Math.sqrt(ox*ox + oy*oy), JOYSTICK_MAX);
    var angle = Math.atan2(oy, ox);
    var kx = Math.cos(angle) * dist, ky = Math.sin(angle) * dist;
    joystick.active = true;
    joystick.dx = kx / JOYSTICK_MAX;
    joystick.dz = -ky / JOYSTICK_MAX;
    var knob = document.getElementById('joystick-knob');
    if (knob) knob.style.transform = 'translate('+kx.toFixed(1)+'px,'+ky.toFixed(1)+'px)';
  }
  function joystickEnd(e){
    if (joystickPointerId === null || (e && e.pointerId !== joystickPointerId)) return;
    joystickPointerId = null;
    joystick.active = false; joystick.dx = 0; joystick.dz = 0;
    var el = document.getElementById('joystick');
    if (el) el.classList.remove('active');
    var knob = document.getElementById('joystick-knob');
    if (knob) knob.style.transform = '';
  }
  document.getElementById('root').addEventListener('pointerdown', function(e){
    if (e.target.closest('#joystick')){ e.preventDefault(); joystickStart(e); }
  });
  document.addEventListener('pointermove', joystickMove);
  document.addEventListener('pointerup', joystickEnd);
  document.addEventListener('pointercancel', joystickEnd);

  function navigate(v){
    exitAimMode();
    stopCourtyardLoop();
    clearEnemyTimer();
    keysDown = {};
    joystickEnd();
    document.body.classList.remove('combat-fullscreen');
    combat = null; resultOverlay = null; confirmingReset = false; showStats = false;
    if (v === 'armorer') armorerSlot = 'Weapon';
    if (v === 'hub') resetCourtyard();
    view = v;
    clearToast();
    render();
    if (v === 'hub'){ startCourtyardLoop(); focusGame(); }
  }

  function focusGame(){
    // Best-effort: grabs keyboard focus for WASD. If the page can't take
    // focus (e.g. embedded without a prior click), the on-screen D-pad
    // still works, since it's driven by pointer events, not key events.
    try { document.getElementById('root').focus({preventScroll:true}); } catch(e){}
  }

  function buyArmor(name){
    var piece = findArmor(name);
    if (!piece) return;
    if (player.armor[piece.slot] === piece.name){ sfx.deny(); toast('Already equipped.'); return; }
    if (player.gold < piece.price){ sfx.deny(); toast('Not enough gold — need '+piece.price+'g, have '+player.gold+'g'); return; }
    player.gold -= piece.price;
    player.armor[piece.slot] = piece.name;
    saveGame(player);
    sfx.equip();
    toast('Equipped '+piece.name+'! Defense is now '+pDefense(player));
    render();
    setTimeout(checkAchievements, 1500);
  }

  function buyWeapon(name){
    var w = findWeapon(name);
    if (!w) return;
    if (player.weapon === w.name){ sfx.deny(); toast('Already equipped.'); return; }
    if (player.gold < w.price){ sfx.deny(); toast('Not enough gold — need '+w.price+'g, have '+player.gold+'g'); return; }
    player.gold -= w.price;
    player.weapon = w.name;
    saveGame(player);
    sfx.equip();
    toast('Equipped '+w.name+'! Attack is now '+pAttack(player));
    render();
    setTimeout(checkAchievements, 1500);
  }

  function doHeal(kind){
    var missing = player.maxHp - player.hp;
    if (missing <= 0){ sfx.deny(); toast('Already at full HP!'); return; }
    var amount = kind==='small' ? HEAL_SMALL_AMOUNT : missing;
    var cost = kind==='small' ? HEAL_SMALL_COST : missing*GOLD_PER_HP_FULL;
    if (player.gold < cost){ sfx.deny(); toast('Not enough gold — need '+cost+'g, have '+player.gold+'g'); return; }
    player.gold -= cost;
    var healed = healPlayer(player, amount);
    saveGame(player);
    sfx.heal();
    toast('Healed '+healed+' HP! ('+player.hp+'/'+player.maxHp+')');
    render();
  }

  // Enemy no longer counter-attacks inline off the player's own move — it
  // acts on its own recurring timer, independent of what the player does.
  var enemyTimer = null;

  function scheduleEnemyTurn(){
    clearEnemyTimer();
    if (!combat || combat.isOver()) return;
    var delay = ENEMY_TURN_MIN_MS + Math.random()*(ENEMY_TURN_MAX_MS-ENEMY_TURN_MIN_MS);
    enemyTimer = setTimeout(enemyTurnTick, delay);
  }

  function enemyTurnTick(){
    enemyTimer = null;
    if (!combat || combat.isOver()) return;
    combat._enemyTurn(isMoving());
    playEnemyTurnSfx();
    render();
    updateCrosshair();
    playImpactFx();
    if (combat.isOver()) setTimeout(finishCombat, 700);
    else scheduleEnemyTurn();
  }

  function clearEnemyTimer(){
    if (enemyTimer){ clearTimeout(enemyTimer); enemyTimer = null; }
  }

  // Moving (WASD or the joystick, held right now) is what grants the
  // player's chance to dodge an enemy attack -- see ENEMY_DODGE_BONUS.
  function isMoving(){
    return !!(keysDown.w || keysDown.a || keysDown.s || keysDown.d ||
      keysDown.arrowup || keysDown.arrowdown || keysDown.arrowleft || keysDown.arrowright ||
      joystick.active);
  }

  function playEnemyTurnSfx(){
    if (!combat) return;
    if (combat.lastHit === 'player') sfx.playerHurt();
    else if (combat.lastDodge) sfx.swordMiss();
  }

  function startFight(){
    if (player.hp <= Math.max(1, player.maxHp*.15)){ toast('Too wounded to fight! See Vita the Healer first.'); return; }
    combat = new Combat(player, nextOpponent(player));
    view = 'combat';
    document.body.classList.add('combat-fullscreen');
    render();
    enterAimMode();
    toast('Tap the arena to swing — line up the crosshair for a head shot!');
    scheduleEnemyTurn();
  }

  function doCombatAction(action){
    if (!combat || combat.isOver()) return;
    if (action !== 'flee' && !combat.canAct()) return;
    if (action==='attack') combat.attack(false);
    else if (action==='power') combat.attack(true);
    else if (action==='defend') combat.defend();
    else if (action==='flee') combat.flee();

    playCombatSfx();
    render();
    updateCrosshair();
    playImpactFx();
    if (combat.isOver()){
      clearEnemyTimer();
      setTimeout(finishCombat, action==='flee' ? 200 : 700);
    }
  }

  function finishCombat(){
    clearEnemyTimer();
    exitAimMode();
    keysDown = {};
    joystickEnd();
    document.body.classList.remove('combat-fullscreen');
    var opp = combat.opponent, overlay;
    stats.totalDamageDealt += combat.totalDamageDealt;
    stats.totalHeadshots += combat.headshots;
    stats.totalCrits += combat.crits;
    stats.bestCombo = Math.max(stats.bestCombo, combat.maxCombo);
    stats.bestHeadshotsInFight = Math.max(stats.bestHeadshotsInFight, combat.headshots);
    if (combat.result === 'win'){
      var wasChampion = isChampion(player);
      recordWin(player, opp);
      overlay = { type:'win', title: (!wasChampion && isChampion(player)) ? 'Champion of the Arena!' : 'Victory!',
                  lines: ['+'+opp.gold+' gold', player.gold+'g total'] };
      sfx.victory();
      setTimeout(function(){ sfx.coin(); }, 500);
      if (!combat.tookDamage) stats.flawlessWins += 1;
      if (combat.minHpSeen <= Math.max(1, player.maxHp*.15)) stats.lowHpWins += 1;
      stats.totalGoldEarned += opp.gold;
      stats.winStreak += 1;
      stats.bestWinStreak = Math.max(stats.bestWinStreak, stats.winStreak);
    } else if (combat.result === 'loss'){
      recordLoss(player);
      overlay = { type:'loss', title:'Defeated…', lines:['Carried from the sand.', 'HP restored to '+player.hp] };
      sfx.defeat();
      stats.winStreak = 0;
    } else {
      overlay = { type:'fled', title:'You Fled', lines:['No shame in living to fight on.'] };
    }
    saveGame(player);
    saveStats();
    resultOverlay = overlay;
    render();
  }

  function dismissResult(){
    resultOverlay = null; combat = null; view = 'arenaMaster'; render();
    checkAchievements(); // after the result modal clears, so the toast is visible
  }

  function doReset(){ player = freshPlayer(); saveGame(player); confirmingReset = false; view = 'hub'; render(); }

      '<div class="sheet">' +
        '<div class="tab-row">' +
          SHOP_TABS.map(function(s){ return '<button class="tab'+(s===slot?' active':'')+'" data-slot="'+s+'"><svg class="icon"><use href="#'+slotIcon(s)+'"/></svg>'+s+'</button>'; }).join('') +
        '</div>' +
        '<div class="armor-list">' +
          items.map(function(a){
            var equipped = isWeapon ? (player.weapon === a.name) : (player.armor[slot] === a.name);
            var afford = player.gold >= a.price;
            var statLabel = isWeapon ? ('+'+a.attack+' ATK — '+a.desc) : ('+'+a.defense+' DEF');
            return '<div class="armor-row'+(equipped?' is-equipped':'')+'">' +
              '<svg class="icon armor-row-icon"><use href="#'+slotIcon(slot)+'"/></svg>' +
              '<div class="armor-row-info"><strong>'+esc(a.name)+'</strong><span class="armor-row-def">'+esc(statLabel)+'</span></div>' +
              '<button class="btn btn-sm '+(equipped?'btn-equipped':(afford?'btn-buy':'btn-disabled'))+'" data-buy="'+esc(a.name)+'" data-buy-kind="'+(isWeapon?'weapon':'armor')+'">' +
                (equipped ? 'Equipped' : a.price+'g') +
              '</button>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<button class="back-btn" style="margin-top:10px" data-back>‹ Leave</button>' +
    '</section>';
  }

  function renderHealer(){
    var missing = player.maxHp - player.hp, fullCost = missing*GOLD_PER_HP_FULL;
    var inner = '<div class="scene-figure"><svg><use href="#i-person-vita"/></svg></div>' +
                '<div class="scene-figure-badge"><svg class="icon sm"><use href="#i-potion"/></svg></div>';
    return '' +
    '<section class="view">' +
      sceneShell({title:'The Healing Tent', inner: inner}) +
      '<div class="scene-caption"><h2>Vita the Healer</h2></div>' +
      '<p class="npc-line">“Let me mend your wounds.”</p>' +
      '<div class="sheet">' +
        '<div class="heal-options">' +
          '<button class="option-card" data-heal="small"><svg class="icon"><use href="#i-potion"/></svg><div><strong>Patch Up</strong><span>Restore '+HEAL_SMALL_AMOUNT+' HP</span></div><span class="price">'+HEAL_SMALL_COST+'g</span></button>' +
          '<button class="option-card'+(missing<=0?' is-disabled':'')+'" data-heal="full"><svg class="icon"><use href="#i-potion"/></svg><div><strong>Full Heal</strong><span>'+(missing>0?'Restore all '+missing+' HP':'Already full')+'</span></div><span class="price">'+(missing>0?fullCost+'g':'—')+'</span></button>' +
        '</div>' +
      '</div>' +
      '<button class="back-btn" style="margin-top:10px" data-back>‹ Leave</button>' +
    '</section>';
  }

  function renderArenaMaster(){
    var opp = nextOpponent(player);
    var idx = Math.max(0, Math.min(player.opponentIndex, OPPONENTS.length-1));
    var wounded = player.hp <= Math.max(1, player.maxHp*.15);
    var inner = '<div class="scene-figure"><svg><use href="#i-person-dominus"/></svg></div>' +
                '<div class="scene-figure-badge"><svg class="icon sm"><use href="#i-crossed-swords"/></svg></div>';
    return '' +
    '<section class="view">' +
      sceneShell({title:'Bout '+ROMAN[idx]+' of '+ROMAN[OPPONENTS.length-1], inner: inner}) +
      '<div class="scene-caption"><h2>Dominus, Arena Master</h2></div>' +
      '<p class="npc-line">“'+esc(opp.taunt)+'”</p>' +
      '<div class="sheet">' +
        '<div class="opponent-stats">' +
          '<span><strong style="color:var(--ink)">'+esc(opp.name)+'</strong></span>' +
        '</div>' +
        '<div class="opponent-stats">' +
          '<span><svg class="icon sm"><use href="#i-sword"/></svg>'+opp.attack+' ATK</span>' +
          '<span><svg class="icon sm"><use href="#i-shield"/></svg>'+opp.defense+' DEF</span>' +
          '<span><svg class="icon sm"><use href="#i-coin"/></svg>'+opp.gold+'g reward</span>' +
        '</div>' +
        (wounded ? '<p class="warning-line">You’re too wounded to fight. See Vita the Healer first.</p>' : '') +
        '<button class="btn btn-primary btn-block" data-fight="enter"'+(wounded?' disabled':'')+'><svg class="icon"><use href="#i-crossed-swords"/></svg>Enter the Arena</button>' +
      '</div>' +
      '<button class="back-btn" style="margin-top:10px" data-back>‹ Leave</button>' +
    '</section>';
  }

  function renderCombat(){
    var p = combat.player, o = combat.opponent;
    var scale = 0.92 + 0.05 * Math.min(player.opponentIndex, OPPONENTS.length-1);
    var fighterClass = 'fighter-figure' + (combat.lastHit==='enemy' ? ' hit' : '') + (combat.result==='win' ? ' fallen' : '');
    var swordClass = 'viewmodel sword' + (combat.lastAction==='attack' ? ' swing' : combat.lastAction==='power' ? ' swing power' : '');
    var shieldClass = 'viewmodel shield' + (combat.lastAction==='defend' ? ' raise' : '');
    var bladeIcon = 'i-vm-sword-' + weaponBlade(player);
    var fighterIcon = o.dummy ? 'i-person-dummy' : (o.trident ? 'i-person-fighter-trident' : 'i-person-fighter');
    var gearStyle = '';
    if (o.gear){
      gearStyle = ';--gear-metal:'+o.gear.metal+';--gear-metal-dark:'+o.gear.metalDark+
        ';--gear-plume:'+o.gear.plume+';--gear-plume-dark:'+o.gear.plumeDark+
        ';--gear-cloth:'+o.gear.cloth+';--gear-cloth-light:'+o.gear.clothLight;
    }
    var inner =
      '<div class="combat-player-hud">' +
        '<div class="hpbar"><div class="hpbar-fill player" style="width:'+pct(p.hp,p.maxHp)+'%"></div></div>' +
        '<span>'+p.hp+'/'+p.maxHp+'</span>' +
        '<span class="gold"><svg class="icon"><use href="#i-coin"/></svg>'+p.gold+'</span>' +
      '</div>' +
      '<div class="'+fighterClass+'" style="transform:translateX(-50%) scale('+scale.toFixed(2)+')'+gearStyle+'"><svg><use href="#'+fighterIcon+'"/></svg></div>' +
      '<div class="combat-flash'+(combat.lastHit==='player'?' hit':'')+'"></div>' +
      '<div class="impact-particles" id="impact-particles">' +
        '<span class="particle"></span><span class="particle"></span><span class="particle"></span>' +
        '<span class="particle"></span><span class="particle"></span><span class="particle"></span>' +
        '<span class="particle"></span><span class="particle"></span><span class="particle"></span>' +
      '</div>' +
      (combat.lastLine ? '<div class="combat-callout">'+esc(combat.lastLine)+'</div>' : '') +
      '<div class="boss-bar"><div class="boss-name">'+esc(o.name)+'</div><div class="hpbar"><div class="hpbar-fill enemy" style="width:'+pct(combat.enemyHp,o.maxHp)+'%"></div></div></div>' +
      '<div class="'+shieldClass+'"><svg><use href="#i-vm-shield"/></svg></div>' +
      '<div class="'+swordClass+'"><svg><use href="#'+bladeIcon+'"/></svg></div>' +
      '<div class="joystick" id="joystick" aria-label="Move / dodge"><div class="joystick-knob" id="joystick-knob"></div></div>';
    return '' +
    '<section class="view combat-view">' +
      sceneShell({inner: inner, extraClass:'arena-scene', crowd:true}) +
      '<div class="combat-log-strip">' + combat.log.slice(-2).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join('') + '</div>' +
      '<div class="action-row">' +
        '<button class="btn btn-outline" data-combat-action="attack"><svg class="icon"><use href="#i-sword"/></svg>Attack</button>' +
        '<button class="btn btn-outline" data-combat-action="power"><svg class="icon"><use href="#i-burst"/></svg>Power</button>' +
        '<button class="btn btn-outline" data-combat-action="defend"><svg class="icon"><use href="#i-shield"/></svg>Defend</button>' +
        '<button class="btn btn-danger" data-combat-action="flee"><svg class="icon"><use href="#i-exit"/></svg>Flee</button>' +
      '</div>' +
    '</section>';
  }

  function renderResultOverlay(){
    var r = resultOverlay;
    var icon = r.type==='win' ? 'i-laurel' : (r.type==='loss' ? 'i-cracked-shield' : 'i-exit');
    return '' +
    '<div class="overlay">' +
      '<div class="card-modal '+r.type+'">' +
        '<svg class="icon result-icon"><use href="#'+icon+'"/></svg>' +
        '<h2>'+r.title+'</h2>' +
        r.lines.map(function(l){ return '<p>'+l+'</p>'; }).join('') +
        '<button class="btn btn-primary" data-continue>Continue</button>' +
      '</div>' +
    '</div>';
  }

  function ownedLabel(slot){
    var name = player.armor[slot];
    if (!name) return 'None';
    var piece = findArmor(name);
    return piece ? name+' (+'+piece.defense+')' : name;
  }

  function renderStatsOverlay(){
    var w = player.weapon ? findWeapon(player.weapon) : null;
    var unlockedCount = ACHIEVEMENTS.filter(function(a){ return !!unlocked[a.id]; }).length;
    var achievementsHtml = ACHIEVEMENTS.map(function(a){
      var isUnlocked = !!unlocked[a.id];
      return '<div class="achievement-item'+(isUnlocked?' unlocked':'')+'">' +
        '<div class="achievement-icon"><svg class="icon"><use href="#i-trophy"/></svg></div>' +
        '<div><div class="achievement-name">'+esc(a.name)+'</div>' +
        '<div class="achievement-desc">'+esc(isUnlocked ? a.desc : '???')+'</div></div>' +
      '</div>';
    }).join('');
    return '' +
    '<div class="overlay" data-close-stats>' +
      '<div class="card-modal stats-modal" onclick="if(!event.target.closest(\'button[data-close-stats]\'))event.stopPropagation()">' +
        '<h2>Your Record</h2>' +
        '<div class="stats-scroll">' +
          '<dl class="stats-grid">' +
            '<dt>Gold</dt><dd>'+player.gold+'g</dd>' +
            '<dt>HP</dt><dd>'+player.hp+'/'+player.maxHp+'</dd>' +
            '<dt>Attack</dt><dd>'+pAttack(player)+'</dd>' +
            '<dt>Defense</dt><dd>'+pDefense(player)+'</dd>' +
            '<dt>Wins</dt><dd>'+player.wins+'</dd>' +
            '<dt>Losses</dt><dd>'+player.losses+'</dd>' +
          '</dl>' +
          '<div class="stats-grid" style="grid-template-columns:1fr">' +
            '<div><dt>Weapon</dt><dd style="font-size:.86rem">'+(w ? w.name+' (+'+w.attack+' ATK)' : 'Bare hands')+'</dd></div>' +
            '<div><dt>Helmet</dt><dd style="font-size:.86rem">'+ownedLabel('Helmet')+'</dd></div>' +
            '<div><dt>Chest</dt><dd style="font-size:.86rem">'+ownedLabel('Chest')+'</dd></div>' +
            '<div><dt>Shield</dt><dd style="font-size:.86rem">'+ownedLabel('Shield')+'</dd></div>' +
          '</div>' +
          '<div class="achievements-heading"><h3>Achievements</h3><span>'+unlockedCount+'/'+ACHIEVEMENTS.length+'</span></div>' +
          '<div class="achievements-list">'+achievementsHtml+'</div>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" style="margin-top:14px;flex-shrink:0" data-close-stats>Close</button>' +
      '</div>' +
    '</div>';
  }

  function render(){
    document.getElementById('hud-gold').textContent = player.gold;
    document.getElementById('hud-hp-text').textContent = player.hp+'/'+player.maxHp;
    document.getElementById('hud-hp-fill').style.width = pct(player.hp, player.maxHp)+'%';

    var app = document.getElementById('app');
    var html = '';
    if (view==='hub') html = renderHub();
    else if (view==='armorer') html = renderArmorer();
    else if (view==='healer') html = renderHealer();
    else if (view==='arenaMaster') html = renderArenaMaster();
    else if (view==='combat') html = renderCombat();
    app.innerHTML = html + (resultOverlay ? renderResultOverlay() : '') + (showStats ? renderStatsOverlay() : '');
    if (view === 'hub') updateCourtyardVisual();
  }

  // ------------------------------------------------------------------
  // Event delegation
  // ------------------------------------------------------------------
  document.getElementById('root').addEventListener('click', function(e){
    var sceneEl = e.target.closest('.arena-scene');
    if (aiming && sceneEl && !e.target.closest('#joystick')){ onAimClick(); return; }

    if (e.target.closest('[data-close-stats]')){ showStats = false; render(); return; }
    if (e.target.closest('[data-stats]')){ showStats = true; render(); return; }
    if (e.target.closest('[data-sound]')){ toggleSound(); return; }
    var t = e.target.closest('[data-nav],[data-back],[data-slot],[data-buy],[data-heal],[data-fight],[data-combat-action],[data-continue],[data-reset],[data-reset-confirm],[data-reset-cancel]');
    if (!t || t.hasAttribute('disabled')) return;
    if (t.dataset.nav){ if (t.dataset.nav==='armorer') npcLine = pick(ARMORER_LINES); navigate(t.dataset.nav); }
    else if (t.dataset.back !== undefined) navigate('hub');
    else if (t.dataset.slot){ armorerSlot = t.dataset.slot; render(); }
    else if (t.dataset.buy){ if (t.dataset.buyKind==='weapon') buyWeapon(t.dataset.buy); else buyArmor(t.dataset.buy); }
    else if (t.dataset.heal) doHeal(t.dataset.heal);
    else if (t.dataset.fight) startFight();
    else if (t.dataset.combatAction) doCombatAction(t.dataset.combatAction);
    else if (t.dataset.continue !== undefined) dismissResult();
    else if (t.dataset.reset !== undefined){ confirmingReset = true; render(); }
    else if (t.dataset.resetCancel !== undefined){ confirmingReset = false; render(); }
    else if (t.dataset.resetConfirm !== undefined) doReset();
  });

  updateSoundIcon();
  render();
  if (view === 'hub'){ startCourtyardLoop(); focusGame(); }
})();
</script>
