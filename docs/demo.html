    ctx.fillStyle='#1FCC7C';ctx.font='bold 14px monospace';ctx.fillText('Level: '+seq.length,GW/2,46);
    BTNS.forEach((b,i)=>{
      const isLit=lit===i;
      ctx.fillStyle=isLit?b.lit:b.col;
      ctx.beginPath();ctx.roundRect?ctx.roundRect(b.x,b.y,b.w,b.h,12):ctx.rect(b.x,b.y,b.w,b.h);ctx.fill();
      ctx.fillStyle=isLit?'rgba(255,255,255,.9)':'rgba(0,0,0,.45)';
      ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+5);
      // Key hint
      const km={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓'}[b.key];
      ctx.fillStyle=isLit?'rgba(255,255,255,.7)':'rgba(0,0,0,.3)';ctx.font='10px monospace';
      ctx.fillText(km,b.x+b.w/2,b.y+b.h-12);
    });
    const stmsg=showing?'Watch the sequence…':waiting?'Your turn! Repeat it.':'';
    ctx.fillStyle='#8B95A5';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(stmsg,GW/2,356);
    if(!waiting&&!showing&&seq.length>0){
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,GW,GH);
      const won=score>0;ctx.fillStyle=won?'#FF4757':'#E2E8F0';
      ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText('WRONG!',GW/2,GH/2-20);
      ctx.fillStyle='#1FCC7C';ctx.font='bold 14px monospace';ctx.fillText('Score: '+score,GW/2,GH/2+4);
      ctx.fillStyle='#8B95A5';ctx.font='11px monospace';ctx.fillText('R restart · Esc menu',GW/2,GH/2+24);
    }
  }
  rst();
  cv.addEventListener('click',e=>{
    if(!waiting&&!showing&&seq.length>0){rst();return;}
    const rect=cv.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    BTNS.forEach((b,i)=>{if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h)press(i);});
  });
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){e.preventDefault();goBack();return;}
    if(e.key==='r'||e.key==='R'){rst();return;}
    const idx=BTNS.findIndex(b=>b.key===e.key);
    if(idx>=0){e.preventDefault();press(idx);}
  };
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   TIC-TAC-TOE
═══════════════════════════════════════════════════════════ */
function buildTTT(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const dlbl=['EASY','MEDIUM','HARD'][d];
  const[cv,ctx]=mkCv(v,'Tic-Tac-Toe — '+dlbl);
  let board,xTurn,status; // status: ''|'X'|'O'|'draw'
  const SZ=3,CS=70,OX=(GW-SZ*CS)/2,OY=60;
  function rst(){board=Array(9).fill('');xTurn=true;status='';}
  function wins(b,p){const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return W.some(([a,b2,c])=>b[a]===p&&b[b2]===p&&b[c]===p);}
  function full(b){return b.every(c=>c);}
  // Minimax for Hard
  function mmx(b,isX){
    if(wins(b,'X'))return 10;if(wins(b,'O'))return -10;if(full(b))return 0;
    const scores=b.map((_,i)=>{if(b[i])return null;const nb=[...b];nb[i]=isX?'X':'O';return mmx(nb,!isX);}).filter(s=>s!==null);
    return isX?Math.max(...scores):Math.min(...scores);
  }
  function aiMove(){
    if(status||xTurn)return;
    let idx;
    if(d===0){// random
      const empty=board.map((_,i)=>i).filter(i=>!board[i]);idx=empty[Math.floor(Math.random()*empty.length)];
    } else if(d===1){// block wins first
      // Try to win
      for(let i=0;i<9;i++){if(!board[i]){const t=[...board];t[i]='O';if(wins(t,'O')){idx=i;break;}}}
      // Block player
      if(idx==null)for(let i=0;i<9;i++){if(!board[i]){const t=[...board];t[i]='X';if(wins(t,'X')){idx=i;break;}}}
      // Center then random
      if(idx==null){const empty=board.map((_,i)=>i).filter(i=>!board[i]);idx=empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)];}
    } else {// minimax
      let best=Infinity,bestIdx=0;
      board.forEach((_,i)=>{if(board[i])return;const nb=[...board];nb[i]='O';const s=mmx(nb,true);if(s<best){best=s;bestIdx=i;}});
      idx=bestIdx;
    }
    if(idx!=null){board[idx]='O';checkEnd();}
    draw();
  }
  function checkEnd(){if(wins(board,'X'))status='X';else if(wins(board,'O'))status='O';else if(full(board))status='draw';}
  function click(i){if(status||!xTurn||board[i])return;board[i]='X';xTurn=false;checkEnd();draw();if(!status)setTimeout(aiMove,250);}
  function draw(){
    ctx.fillStyle='#0B0F18';ctx.fillRect(0,0,GW,GH);
    // Title
    ctx.fillStyle='#8B95A5';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(status?'':xTurn?'Your turn (X)':'AI thinking…',GW/2,28);
    // Grid
    ctx.strokeStyle='#1E2B3F';ctx.lineWidth=3;
    [1,2].forEach(i=>{
      ctx.beginPath();ctx.moveTo(OX+i*CS,OY);ctx.lineTo(OX+i*CS,OY+SZ*CS);ctx.stroke();
      ctx.beginPath();ctx.moveTo(OX,OY+i*CS);ctx.lineTo(OX+SZ*CS,OY+i*CS);ctx.stroke();
    });
    // Pieces
    board.forEach((p,i)=>{
      if(!p)return;
      const cx=OX+(i%3)*CS+CS/2,cy=OY+Math.floor(i/3)*CS+CS/2;
      if(p==='X'){
        ctx.strokeStyle='#2DA8FF';ctx.lineWidth=4;
        const off=CS*.28;
        ctx.beginPath();ctx.moveTo(cx-off,cy-off);ctx.lineTo(cx+off,cy+off);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+off,cy-off);ctx.lineTo(cx-off,cy+off);ctx.stroke();
      } else {
        ctx.strokeStyle='#FF4757';ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(cx,cy,CS*.28,0,Math.PI*2);ctx.stroke();
      }
    });
    // Highlight winning line
    const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    if(status==='X'||status==='O'){
      const wl=W.find(([a,b2,c])=>board[a]===status&&board[b2]===status&&board[c]===status);
      if(wl){
        const[a,,c]=wl;
        const ax=OX+(a%3)*CS+CS/2,ay=OY+Math.floor(a/3)*CS+CS/2;
        const bx2=OX+(c%3)*CS+CS/2,by2=OY+Math.floor(c/3)*CS+CS/2;
        ctx.strokeStyle=status==='X'?'#2DA8FF':'#FF4757';ctx.lineWidth=4;ctx.globalAlpha=.5;
        ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx2,by2);ctx.stroke();ctx.globalAlpha=1;
      }
    }
    // Overlay
    if(status){
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,GW,GH);
      const msg=status==='draw'?'DRAW!':(status==='X'?'YOU WIN!':'AI WINS!');
      ctx.fillStyle=status==='draw'?'#FFD93D':(status==='X'?'#1FCC7C':'#FF4757');
      ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText(msg,GW/2,GH/2-12);
      ctx.fillStyle='#8B95A5';ctx.font='11px monospace';ctx.fillText('R restart · Esc menu',GW/2,GH/2+10);
    }
    // Hint
    ctx.fillStyle='#1E2B3F';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText('Click to place X · AI plays O · R restart',GW/2,OY+SZ*CS+20);
  }
  rst();draw();
  cv.addEventListener('click',e=>{
    if(status){rst();draw();return;}
    const rect=cv.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    const col=Math.floor((cx-OX)/CS),row=Math.floor((cy-OY)/CS);
    if(col>=0&&col<SZ&&row>=0&&row<SZ)click(row*SZ+col);
  });
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){e.preventDefault();goBack();}
    if(e.key==='r'||e.key==='R'){rst();draw();}
  };
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function pushItem(it){
  stack[stack.length-1]._sel=menuSel;menuSel=0;
  if(it.hasDiff&&it.gameKey){
    // Show difficulty selection screen
    stack.push({type:'diff',gameKey:it.gameKey,_ds:1});
    render();return;
  }
  if(it.gameKey&&!it.hasDiff){stack.push({type:it.gameKey,diff:1});render();return;}
  const gameTypes=['snake','tetris','pong-ai','pong-2p','chess-ai','chess-2p','flappy','hotspot','info','breakout','g2048','ttt','simon','mines','hangman','invaders','c4','mole','memory','asteroids','frogger','galaga','centipede','lunar','sokoban','lightsout','reversi','battleship','numguess','reaction','blackjack','slide','tron','wordle','mathflash','platform','life','rps','colormatch','darts','checkers','typing','mastermind','hanoi','nim','bubble','slot','bowling','mancala','sudoku','pacman','cardodge','fruitcatch','match3','missile','pinball','gravflip','poker','pipe','maze','numchain','runner','spaceshoot','yahtzee','war','hexgrid','craps','pixelart','gravball','wordsearch','colorflood','fusion','brickx','jumpjack','dodge','trivia','snakex','pong3','gridrush','blockstack','flappyx','virus','beattap','anagram','chainreact','astminer','tankbattle','spelling','magicsq','orbit','laser','sprintdigits','floodesc','zombierun','iceslide','crystalcave','numtap','gravpong','emojimem','taprace','codebreak','gemswap','spinwheel','numpyramid','neonsnake','tileshift','starfield','wordladder','dropzone','brickbreakplus','reactionmatch','snakemaze'];
  const uiTypes=['hotspot','blespam','custompopup','blelure'];
  if(it.type&&(gameTypes.includes(it.type)||uiTypes.includes(it.type)))stack.push({...it});
  else if(it.menu)stack.push({...it.menu,_sel:0});
  else stack.push({type:'info',ico:it.icon||'⚙️',title:it.label,body:'Requires physical hardware on the Pi.',badge:'Hardware only'});
  render();
}
function goBack(){if(stack.length>1){stack.pop();menuSel=stack[stack.length-1]._sel||0;render();}}

/* ═══════════════════════════════════════════════════════════
   SIDE BUTTONS
═══════════════════════════════════════════════════════════ */
function sKey(k){
  if(sg){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const d=m[k];if(d&&(d.x!==-sg.dir.x||d.y!==-sg.dir.y))sg.nd=d;}
  else if(tg&&tg.kdown){const m={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',select:' '};if(m[k])tg.kdown({key:m[k],preventDefault:()=>{}});}
  else if(pg){if(k==='up')pg.keys.w=true;if(k==='down')pg.keys.s=true;if(k==='select')setTimeout(()=>{if(pg){delete pg.keys.w;delete pg.keys.s;}},200);}
  else if(fg&&k==='select'){if(fg.kdown)fg.kdown({key:' ',preventDefault:()=>{}});}
  else{const cur=stack[stack.length-1];const items=cur.items||[];if(!items.length)return;if(k==='up'){menuSel=Math.max(0,menuSel-1);render();}if(k==='down'){menuSel=Math.min(items.length-1,menuSel+1);render();}if(k==='select')pushItem(items[menuSel]);}
}

/* ═══════════════════════════════════════════════════════════
   KEYBOARD  (menus only — games attach their own listeners)
═══════════════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(sg||tg||pg||fg||cg)return;
  const cur=stack[stack.length-1],items=cur.items||[];
  if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();menuSel=Math.max(0,menuSel-1);render();}
  else if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();menuSel=Math.min(items.length-1,menuSel+1);render();}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(items[menuSel])pushItem(items[menuSel]);}
  else if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();goBack();}
});

/* ═══════════════════════════════════════════════════════════
   CLOCK  +  WIDGET UPDATER
═══════════════════════════════════════════════════════════ */
function tick(){
  const n=new Date(),el=document.getElementById('clk');
  if(el)el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const wt=document.getElementById('w-time');
  if(wt)wt.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  // Slowly drain battery for realism
  if(Math.random()<.01&&dev.bat>5)dev.bat--;
  const wh=document.getElementById('w-hs');if(wh){wh.textContent=hotspotOn?'🌐 Hotspot ON':'🌐 Hotspot OFF';wh.className='w-badge'+(hotspotOn?' on':'');}
  const bf=document.getElementById('w-bat-fill');if(bf){const c=dev.bat>30?'var(--acc)':'var(--dan)';bf.style.width=Math.round(dev.bat*32/100)+'px';bf.style.background=c;}
}
tick();setInterval(tick,8000);

render();
</script>
