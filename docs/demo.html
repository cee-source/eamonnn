    if(solved){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,GW,GH);ctx.fillStyle='#FFD93D';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('ALL OFF!',GW/2,GH/2-16);ctx.fillStyle='#1FCC7C';ctx.font='12px monospace';ctx.fillText('Moves: '+moves,GW/2,GH/2+4);ctx.fillStyle='#8B95A5';ctx.fillText('R again · Esc menu',GW/2,GH/2+22);}
  }
  rst();
  cv.addEventListener('click',e=>{if(solved){rst();return;}const rect=cv.getBoundingClientRect();const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);const c=Math.floor((cx-OX)/CS),r=Math.floor((cy-OY)/CS);if(r>=0&&r<SZ&&c>=0&&c<SZ)press(r,c);});
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){goBack();return;}if(e.key==='r'||e.key==='R'){rst();draw();return;}
    if(e.key==='ArrowUp'){e.preventDefault();sel.r=Math.max(0,sel.r-1);draw();}
    if(e.key==='ArrowDown'){e.preventDefault();sel.r=Math.min(SZ-1,sel.r+1);draw();}
    if(e.key==='ArrowLeft'){e.preventDefault();sel.c=Math.max(0,sel.c-1);draw();}
    if(e.key==='ArrowRight'){e.preventDefault();sel.c=Math.min(SZ-1,sel.c+1);draw();}
    if(e.key==='Enter'||e.key===' '){e.preventDefault();press(sel.r,sel.c);}
  };
  document.addEventListener('keydown',xg.kdown);draw();
}

/* ═══════════════════════════════════════════════════════════
   MEMORY MATCH
═══════════════════════════════════════════════════════════ */
function buildMemory(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const dlbl=['EASY','NORMAL','HARD'][d];
  // [cols, rows] — pairs = cols*rows/2
  const CFG=[[4,3],[4,4],[5,4]][d];
  const[COLS,ROWS]=CFG,TOTAL=COLS*ROWS;
  const EMOJIS=['🐶','🐱','🐸','🦊','🐼','🦁','🐨','🦋','🌸','🍕'];
  const CS=Math.floor(270/COLS),OX=(GW-COLS*CS)/2,OY=44;
  const[cv,ctx]=mkCv(v,'Memory Match — '+dlbl);
  let cards,flipped,matched,moves,lock;
  function rst(){
    const pairs=Array.from({length:TOTAL/2},(_,i)=>EMOJIS[i%EMOJIS.length]);
    const deck=[...pairs,...pairs].sort(()=>Math.random()-.5);
    cards=deck.map((e,i)=>({emoji:e,face:false,matched:false,r:Math.floor(i/COLS),c:i%COLS}));
    flipped=[];matched=0;moves=0;lock=false;draw();
  }
  function flip(idx){
    if(lock||cards[idx].face||cards[idx].matched)return;
    cards[idx].face=true;flipped.push(idx);draw();
    if(flipped.length===2){moves++;lock=true;
      const[a,b]=flipped;
      if(cards[a].emoji===cards[b].emoji){cards[a].matched=cards[b].matched=true;matched+=2;flipped=[];lock=false;draw();}
      else setTimeout(()=>{if(!xg)return;cards[a].face=cards[b].face=false;flipped=[];lock=false;draw();},900);}
  }
  function draw(){
    ctx.fillStyle='#0B0F18';ctx.fillRect(0,0,GW,GH);
    ctx.fillStyle='#1FCC7C';ctx.font='bold 11px monospace';ctx.textAlign='left';ctx.fillText('Moves: '+moves,10,28);
    ctx.fillStyle='#8B95A5';ctx.textAlign='right';ctx.fillText(matched/2+'/'+(TOTAL/2)+' pairs',GW-10,28);
    cards.forEach((card,i)=>{
      const x=OX+card.c*CS,y=OY+card.r*CS,cw=CS-4,ch=CS-4;
      if(card.matched){
        ctx.fillStyle='rgba(31,204,124,.18)';ctx.fillRect(x+2,y+2,cw,ch);
        ctx.font=`${Math.floor(CS*.5)}px serif`;ctx.textAlign='center';ctx.fillText(card.emoji,x+CS/2,y+CS/2+Math.floor(CS*.18));
      } else if(card.face){
        ctx.fillStyle='#1C2E4A';ctx.fillRect(x+2,y+2,cw,ch);
        ctx.strokeStyle='#2DA8FF';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,cw,ch);
        ctx.font=`${Math.floor(CS*.5)}px serif`;ctx.textAlign='center';ctx.fillText(card.emoji,x+CS/2,y+CS/2+Math.floor(CS*.18));
      } else {
        ctx.fillStyle='#1A2438';ctx.fillRect(x+2,y+2,cw,ch);
        ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(x+2,y+2,cw,3);ctx.fillRect(x+2,y+2,3,ch);
        ctx.fillStyle='rgba(45,168,255,.15)';ctx.font=`${Math.floor(CS*.4)}px serif`;ctx.textAlign='center';ctx.fillText('?',x+CS/2,y+CS/2+Math.floor(CS*.15));
      }
    });
    if(matched===TOTAL){
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,GW,GH);
      ctx.fillStyle='#1FCC7C';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('YOU WIN! 🎉',GW/2,GH/2-18);
      ctx.fillStyle='#E2E8F0';ctx.font='12px monospace';ctx.fillText('Moves: '+moves,GW/2,GH/2+4);
      ctx.fillStyle='#8B95A5';ctx.fillText('R restart · Esc menu',GW/2,GH/2+22);
    }
    ctx.fillStyle='#1E2B3F';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText('Click to flip cards',GW/2,OY+ROWS*CS+14);
  }
  rst();
  cv.addEventListener('click',e=>{
    if(matched===TOTAL){rst();return;}
    const rect=cv.getBoundingClientRect();const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    const col=Math.floor((cx-OX)/CS),row=Math.floor((cy-OY)/CS);
    if(row>=0&&row<ROWS&&col>=0&&col<COLS)flip(row*COLS+col);
  });
  xg={raf:null,iid:null};
  xg.kdown=e=>{if(e.key==='Escape'){goBack();return;}if(e.key==='r'||e.key==='R'){rst();}};
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   WHACK-A-MOLE
═══════════════════════════════════════════════════════════ */
function buildMole(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const dlbl=['EASY','NORMAL','TURBO'][d];
  const DURATION=[60,45,30][d],UP_MS=[1200,800,450][d],MAX_UP=[2,3,4][d];
  const[cv,ctx]=mkCv(v,'Whack-a-Mole — '+dlbl);
  const HOLES=[[60,120],[150,120],[240,120],[60,220],[150,220],[240,220],[60,320],[150,320],[240,320]];
  let moles,score,misses,timeLeft,tid,active;
  function rst(){moles=HOLES.map(()=>({up:false,timer:0,whacked:false}));score=0;misses=0;timeLeft=DURATION;active=true;
    if(tid)clearInterval(tid);
    tid=setInterval(()=>{if(!xg){clearInterval(tid);return;}timeLeft--;if(timeLeft<=0){active=false;clearInterval(tid);draw();}else draw();},1000);
  }
  function spawnMoles(){
    if(!active)return;
    const up=moles.filter(m=>m.up).length;
    if(up<MAX_UP){
      const down=moles.map((m,i)=>(!m.up?i:-1)).filter(i=>i>=0);
      if(down.length){const idx=down[Math.floor(Math.random()*down.length)];moles[idx].up=true;moles[idx].whacked=false;
        setTimeout(()=>{if(!xg)return;if(!moles[idx].whacked){misses++;moles[idx].up=false;}draw();},UP_MS);}
    }
  }
  function whack(idx){if(!active||!moles[idx].up||moles[idx].whacked)return;moles[idx].whacked=true;moles[idx].up=false;score+=10;draw();}
  function draw(){
    ctx.fillStyle='#0B1A0B';ctx.fillRect(0,0,GW,GH);
    // Grass
    ctx.fillStyle='#1A3A1A';ctx.fillRect(0,80,GW,GH-80);
    ctx.fillStyle='#0F260F';
    for(let i=0;i<10;i++){const x=i*32,w=20;ctx.fillRect(x,80,w,6);}
    // HUD
    ctx.fillStyle='#1FCC7C';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.fillText('SCORE: '+score,10,26);
    ctx.textAlign='center';ctx.fillStyle=timeLeft<=10?'#FF4757':'#E2E8F0';ctx.fillText('⏱ '+timeLeft+'s',GW/2,26);
    ctx.fillStyle='#FF4757';ctx.textAlign='right';ctx.fillText('MISS: '+misses,GW-10,26);
    // Holes & moles
    HOLES.forEach(([hx,hy],i)=>{
      // Hole shadow
      ctx.fillStyle='#0A1A0A';ctx.beginPath();ctx.ellipse(hx,hy+2,30,12,0,0,Math.PI*2);ctx.fill();
      // Hole
      ctx.fillStyle='#050D05';ctx.beginPath();ctx.ellipse(hx,hy,28,10,0,0,Math.PI*2);ctx.fill();
      if(moles[i].up){
        const bob=Math.sin(Date.now()/120)*2;
        // Body
        ctx.fillStyle='#8B4513';ctx.beginPath();ctx.ellipse(hx,hy-22+bob,18,22,0,0,Math.PI*2);ctx.fill();
        // Face
        ctx.fillStyle='#CD853F';ctx.beginPath();ctx.ellipse(hx,hy-30+bob,14,16,0,0,Math.PI*2);ctx.fill();
        // Eyes
        ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hx-5,hy-34+bob,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hx+5,hy-34+bob,3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(hx-4,hy-35+bob,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hx+6,hy-35+bob,1.5,0,Math.PI*2);ctx.fill();
        // Nose
        ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.arc(hx,hy-30+bob,3,0,Math.PI*2);ctx.fill();
        // Whacked flash
        if(moles[i].whacked){ctx.fillStyle='rgba(255,215,0,.6)';ctx.beginPath();ctx.arc(hx,hy-28+bob,22,0,Math.PI*2);ctx.fill();}
      }
    });
    // Hole numbers hint
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.font='9px monospace';ctx.textAlign='center';
    HOLES.forEach(([hx,hy],i)=>ctx.fillText(i+1,hx,hy+5));
    if(!active){
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,GW,GH);
      ctx.fillStyle='#1FCC7C';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('TIME UP!',GW/2,GH/2-22);
      ctx.fillStyle='#FFD93D';ctx.font='bold 16px monospace';ctx.fillText('Score: '+score,GW/2,GH/2+2);
      ctx.fillStyle='#8B95A5';ctx.font='11px monospace';ctx.fillText('Misses: '+misses,GW/2,GH/2+20);ctx.fillText('R restart · Esc menu',GW/2,GH/2+38);
    }
  }
  rst();
  const spawnId=setInterval(()=>{if(!xg){clearInterval(spawnId);return;}spawnMoles();draw();},300);
  cv.addEventListener('click',e=>{
    if(!active){rst();return;}
    const rect=cv.getBoundingClientRect();const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    HOLES.forEach(([hx,hy],i)=>{if(Math.hypot(cx-hx,cy-hy)<28)whack(i);});
  });
  xg={raf:null,iid:spawnId};
  xg.kdown=e=>{
    if(e.key==='Escape'){if(tid)clearInterval(tid);goBack();return;}
    if(e.key==='r'||e.key==='R'){rst();return;}
    const n=parseInt(e.key);if(n>=1&&n<=9){e.preventDefault();whack(n-1);}
  };
  // Store tid for cleanup
  xg._tid=tid;
  document.addEventListener('keydown',xg.kdown);
  draw();
}

/* ═══════════════════════════════════════════════════════════
   CONNECT FOUR
═══════════════════════════════════════════════════════════ */
function buildC4(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const dlbl=['EASY','MEDIUM','HARD'][d];
  const COLS=7,ROWS=6,CS=38,OX=(GW-COLS*CS)/2,OY=50;
  const[cv,ctx]=mkCv(v,'Connect Four — '+dlbl);
  let board,turn,status,hover;
  function rst(){board=Array.from({length:ROWS},()=>Array(COLS).fill(0));turn=1;status=0;hover=3;}
  function drop(col){
    if(status)return;
    for(let r=ROWS-1;r>=0;r--){if(!board[r][col]){board[r][col]=turn;if(checkWin(r,col,turn))status=turn;else if(board[0].every(c=>c))status=3;else turn=turn===1?2:1;return true;}}
    return false;
  }
  function checkWin(r,c,p){
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    return dirs.some(([dr,dc])=>{
      let count=1;
      for(let s of[-1,1]){let nr=r+dr*s,nc=c+dc*s;while(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===p){count++;nr+=dr*s;nc+=dc*s;}}
      return count>=4;
    });
  }
  function score4AI(b,p){
    let s=0;const opp=p===1?2:1;
    function lineScore(a){let mine=0,opp2=0;a.forEach(x=>{if(x===p)mine++;else if(x===opp)opp2++;});
      if(opp2>0&&mine>0)return 0;if(mine===4)return 10000;if(mine===3)return 50;if(mine===2)return 5;if(opp2===4)return -10000;if(opp2===3)return -80;return 0;}
    for(let r=0;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=lineScore([b[r][c],b[r][c+1],b[r][c+2],b[r][c+3]]);
    for(let r=0;r<=ROWS-4;r++)for(let c=0;c<COLS;c++)s+=lineScore([b[r][c],b[r+1][c],b[r+2][c],b[r+3][c]]);
    for(let r=0;r<=ROWS-4;r++)for(let c=0;c<=COLS-4;c++)s+=lineScore([b[r][c],b[r+1][c+1],b[r+2][c+2],b[r+3][c+3]]);
    for(let r=3;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=lineScore([b[r][c],b[r-1][c+1],b[r-2][c+2],b[r-3][c+3]]);
    return s;
  }
  function aiMove(){
    if(d===0){// random
      const valid=[];for(let c=0;c<COLS;c++)if(!board[0][c])valid.push(c);return valid[Math.floor(Math.random()*valid.length)];
    }
    // Try win or block
    for(const p of[2,1]){for(let c=0;c<COLS;c++){if(board[0][c])continue;const nb=board.map(r=>[...r]);for(let r=ROWS-1;r>=0;r--){if(!nb[r][c]){nb[r][c]=p;if(checkWin(r,c,p))return c;nb[r][c]=0;break;}}}}
    if(d===1){const valid=[];for(let c=0;c<COLS;c++)if(!board[0][c])valid.push(c);return valid[Math.floor(Math.random()*valid.length)];}
    // Minimax depth 4
    function mm(b,depth,p2,alpha,beta){
      const opp=p2===2?1:2;
      if(depth===0)return score4AI(b,2);
      const moves=[];for(let c=0;c<COLS;c++)if(!b[0][c])moves.push(c);
      if(!moves.length)return 0;
      let best=p2===2?-Infinity:Infinity;
      for(const c of moves){const nb=b.map(r=>[...r]);let rw=-1;for(let r=ROWS-1;r>=0;r--){if(!nb[r][c]){nb[r][c]=p2;rw=r;break;}}
        if(rw>=0&&checkWin(rw,c,p2)){const sc=p2===2?9999:-9999;if(p2===2&&sc>best){best=sc;}else if(p2===1&&sc<best){best=sc;}nb[rw][c]=0;if(p2===2){alpha=Math.max(alpha,best);}else{beta=Math.min(beta,best);}if(alpha>=beta)break;continue;}
        const sc=mm(nb,depth-1,opp,alpha,beta);nb[rw][c]=0;if(p2===2){if(sc>best){best=sc;}alpha=Math.max(alpha,best);}else{if(sc<best){best=sc;}beta=Math.min(beta,best);}if(alpha>=beta)break;}
      return best;}
    let bestScore=-Infinity,bestCol=3;
    for(let c=0;c<COLS;c++){if(board[0][c])continue;const nb=board.map(r=>[...r]);let rw=-1;for(let r=ROWS-1;r>=0;r--){if(!nb[r][c]){nb[r][c]=2;rw=r;break;}}if(rw<0)continue;const sc=mm(nb,3,1,-Infinity,Infinity);nb[rw][c]=0;if(sc>bestScore){bestScore=sc;bestCol=c;}}
    return bestCol;
  }
  function draw(){
    ctx.fillStyle='#0B0F18';ctx.fillRect(0,0,GW,GH);
    // Turn indicator
    if(!status){ctx.fillStyle='#8B95A5';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(turn===1?'Your turn (🔴)':'AI thinking…',GW/2,28);}
    // Drop preview
    if(!status&&turn===1&&hover!=null&&!board[0][hover]){ctx.fillStyle='rgba(255,71,87,.35)';ctx.beginPath();ctx.arc(OX+hover*CS+CS/2,OY-14,CS/2-5,0,Math.PI*2);ctx.fill();}
    // Board bg
    ctx.fillStyle='#1A3A8A';ctx.fillRect(OX-4,OY,COLS*CS+8,ROWS*CS+8);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cx=OX+c*CS+CS/2,cy=OY+r*CS+CS/2,v2=board[r][c];
      ctx.fillStyle=v2===1?'#FF4757':v2===2?'#FFD93D':'#0B0F18';
      ctx.beginPath();ctx.arc(cx,cy,CS/2-3,0,Math.PI*2);ctx.fill();
      if(v2){ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(cx-4,cy-5,5,0,Math.PI*2);ctx.fill();}
    }
    if(status){
      ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,GW,GH);
      const msg=status===3?'DRAW!':(status===1?'YOU WIN! 🎉':'AI WINS!');
      ctx.fillStyle=status===3?'#FFD93D':(status===1?'#1FCC7C':'#FF4757');
      ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText(msg,GW/2,GH/2-12);
      ctx.fillStyle='#8B95A5';ctx.font='11px monospace';ctx.fillText('R restart · Esc menu',GW/2,GH/2+12);
    }
    ctx.fillStyle='#1E2B3F';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText('← → column · Space/Enter drop · R restart',GW/2,OY+ROWS*CS+22);
  }
  function playerDrop(col){if(status||turn!==1)return;if(drop(col)){draw();if(!status){setTimeout(()=>{if(!xg)return;drop(aiMove());draw();},300);}}}
  rst();draw();
  cv.addEventListener('mousemove',e=>{const rect=cv.getBoundingClientRect();const cx=(e.clientX-rect.left)*(GW/rect.width);hover=Math.floor((cx-OX)/CS);draw();});
  cv.addEventListener('click',e=>{const rect=cv.getBoundingClientRect();const cx=(e.clientX-rect.left)*(GW/rect.width);const col=Math.floor((cx-OX)/CS);if(col>=0&&col<COLS){if(status){rst();draw();}else playerDrop(col);}});
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){goBack();return;}if(e.key==='r'||e.key==='R'){rst();draw();return;}
    if(e.key==='ArrowLeft')hover=Math.max(0,(hover||0)-1);
    if(e.key==='ArrowRight')hover=Math.min(COLS-1,(hover||0)+1);
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(status){rst();draw();}else playerDrop(hover||0);}
    draw();
  };
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   SPACE INVADERS
═══════════════════════════════════════════════════════════ */
function buildInvaders(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const dlbl=['RECRUIT','SOLDIER','COMMANDER'][d];
  const ROWS=[3,4,5][d],COLS=10,SPD0=[0.3,0.5,0.8][d],FRATE=[0.004,0.008,0.014][d];
  const[cv,ctx]=mkCv(v,'Space Invaders — '+dlbl);
  let enemies,px,bullets,ebullets,dir,spd,score,lives,level,won,dead,stepTimer;
  function mkEnemies(){
    const e=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)e.push({r,c,x:20+c*26,y:50+r*22,alive:true,type:2-Math.floor(r*3/ROWS)});
    return e;
  }
  function rst(){enemies=mkEnemies();px=GW/2;bullets=[];ebullets=[];dir=1;spd=SPD0;score=0;lives=3;level=1;won=false;dead=false;stepTimer=0;}
  function draw(ts){
    ctx.fillStyle='#010710';ctx.fillRect(0,0,GW,GH);
    // Stars
    ctx.fillStyle='rgba(255,255,255,.4)';[[30,80],[80,30],[150,60],[220,20],[260,90],[40,200],[180,150],[280,50]].forEach(([x,y])=>{ctx.fillRect(x,y,1,1);});
    // HUD
    ctx.fillStyle='#1FCC7C';ctx.font='bold 11px monospace';ctx.textAlign='left';ctx.fillText('SCORE: '+score,8,20);
    ctx.textAlign='center';ctx.fillText('LVL '+level,GW/2,20);
    ctx.textAlign='right';ctx.fillText('❤ '.repeat(lives).trim(),GW-8,20);
    // Ground
    ctx.fillStyle='#1FCC7C';ctx.fillRect(0,GH-24,GW,2);
    // Player
    ctx.fillStyle='#1FCC7C';
    ctx.beginPath();ctx.moveTo(px,GH-28);ctx.lineTo(px-14,GH-14);ctx.lineTo(px+14,GH-14);ctx.closePath();ctx.fill();
    ctx.fillRect(px-5,GH-36,10,10);
    // Enemies
    enemies.forEach(e=>{
      if(!e.alive)return;
      const cols=['#FF4757','#FF8C42','#2DA8FF'];
      ctx.fillStyle=cols[e.type];
      if(e.type===0){// top row
        ctx.fillRect(e.x+3,e.y,10,6);ctx.fillRect(e.x,e.y+6,16,6);ctx.fillRect(e.x+2,e.y+12,4,4);ctx.fillRect(e.x+10,e.y+12,4,4);
      } else if(e.type===1){
        ctx.fillRect(e.x+2,e.y,12,4);ctx.fillRect(e.x,e.y+4,16,8);ctx.fillRect(e.x+4,e.y+12,3,4);ctx.fillRect(e.x+9,e.y+12,3,4);ctx.fillRect(e.x,e.y+4,3,4);ctx.fillRect(e.x+13,e.y+4,3,4);
      } else {
        ctx.beginPath();ctx.arc(e.x+8,e.y+8,8,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#010710';ctx.fillRect(e.x+2,e.y+6,4,4);ctx.fillRect(e.x+10,e.y+6,4,4);
      }
    });
    // Bullets
    ctx.fillStyle='#1FCC7C';bullets.forEach(b=>ctx.fillRect(b.x-1,b.y-6,2,6));
    ctx.fillStyle='#FF4757';ebullets.forEach(b=>ctx.fillRect(b.x-1,b.y,2,6));
    if(won||dead){
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,GW,GH);
      ctx.fillStyle=won?'#1FCC7C':'#FF4757';ctx.font='bold 18px monospace';ctx.textAlign='center';
      ctx.fillText(won?'EARTH IS SAFE!':'INVADED!',GW/2,GH/2-16);
      ctx.fillStyle='#E2E8F0';ctx.font='12px monospace';ctx.fillText('Score: '+score,GW/2,GH/2+4);
      ctx.fillStyle='#8B95A5';ctx.fillText('R restart · Esc menu',GW/2,GH/2+22);
    }
  }
  function step(){
    if(won||dead)return;
    // Move player
    if(xg&&xg.keys.left)px=Math.max(14,px-4);
    if(xg&&xg.keys.right)px=Math.min(GW-14,px+4);
    // Move enemies
    let minX=300,maxX=0;
    enemies.filter(e=>e.alive).forEach(e=>{minX=Math.min(minX,e.x);maxX=Math.max(maxX,e.x+16);});
    if(minX<=4&&dir===-1||maxX>=GW-4&&dir===1){
      enemies.forEach(e=>{if(e.alive)e.y+=10;});dir=-dir;spd=Math.min(spd+0.1,5);
    }
    enemies.forEach(e=>{if(e.alive)e.x+=dir*spd;});
    // Enemy fires
    const alive=enemies.filter(e=>e.alive);
    if(alive.length&&Math.random()<FRATE){
      const cols=new Set(alive.map(e=>e.c));
      const col=[...cols][Math.floor(Math.random()*cols.size)];
      const shooters=alive.filter(e=>e.c===col);
      const shooter=shooters[shooters.length-1];
      ebullets.push({x:shooter.x+8,y:shooter.y+16});
    }
    // Move bullets
    bullets.forEach(b=>b.y-=8);bullets=bullets.filter(b=>b.y>20);
    ebullets.forEach(b=>b.y+=4);ebullets=ebullets.filter(b=>b.y<GH);
    // Hit detection enemy bullets → player
    ebullets=ebullets.filter(b=>{if(Math.abs(b.x-px)<16&&b.y>GH-38){lives--;ebullets=[];bullets=[];if(lives<=0)dead=true;return false;}return true;});
    // Hit detection player bullets → enemies
    bullets=bullets.filter(b=>{for(const e of enemies){if(!e.alive)continue;if(b.x>e.x&&b.x<e.x+16&&b.y>e.y&&b.y<e.y+16){e.alive=false;score+=10*(e.type+1);return false;}}return true;});
    // Win
    if(alive.length===0){level++;if(level>3)won=true;else{enemies=mkEnemies();spd=SPD0*level;}}
    // Enemies reach ground
    if(enemies.some(e=>e.alive&&e.y+16>GH-26))dead=true;
  }
  rst();
  xg={keys:{},iid:setInterval(()=>{step();draw();},16),raf:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){goBack();return;}
    if(e.key==='r'||e.key==='R'){rst();return;}
    if(e.key==='ArrowLeft'||e.key==='a')xg.keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d')xg.keys.right=true;
    if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&!won&&!dead){
      e.preventDefault();if(bullets.length<3)bullets.push({x:px,y:GH-38});}
  };
  xg.kup=e=>{if(e.key==='ArrowLeft'||e.key==='a')delete xg.keys.left;if(e.key==='ArrowRight'||e.key==='d')delete xg.keys.right;};
  document.addEventListener('keydown',xg.kdown);document.addEventListener('keyup',xg.kup);
  draw();
}

/* ═══════════════════════════════════════════════════════════
   HANGMAN
═══════════════════════════════════════════════════════════ */
function buildHangman(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const WORDS=[
    ['cat','dog','pig','hen','fox','bee','ant','bat','emu','yak','ram','elk','asp','gnu','cod'],
    ['ocean','tiger','piano','storm','flame','brave','clown','dwarf','zebra','globe','pixel','magic'],
    ['junction','labyrinth','algorithm','frequency','chrysalis','synthesis','labyrinth','champagne'],
  ];
  const dlbl=['EASY','MEDIUM','HARD'][d];
  const[cv,ctx]=mkCv(v,'Hangman — '+dlbl);
  let word,guessed,wrong,maxWrong=6;
  function rst(){const ws=WORDS[d];word=ws[Math.floor(Math.random()*ws.length)].toUpperCase();guessed=new Set();wrong=0;draw();}
  function guess(ch){if(guessed.has(ch)||wrong>=maxWrong||won())return;guessed.add(ch);if(!word.includes(ch))wrong++;draw();}
  function won(){return word.split('').every(c=>guessed.has(c));}
  function lost(){return wrong>=maxWrong;}
  function draw(){
    ctx.fillStyle='#0B0F18';ctx.fillRect(0,0,GW,GH);
    // Gallows
    ctx.strokeStyle='#2A3A50';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(40,340);ctx.lineTo(160,340);ctx.stroke(); // base
    ctx.beginPath();ctx.moveTo(80,340);ctx.lineTo(80,60);ctx.stroke(); // pole
    ctx.beginPath();ctx.moveTo(80,60);ctx.lineTo(160,60);ctx.stroke(); // top
    ctx.beginPath();ctx.moveTo(160,60);ctx.lineTo(160,90);ctx.stroke(); // rope
    // Hangman parts
    ctx.strokeStyle='#FF4757';ctx.lineWidth=3;
    if(wrong>0){ctx.beginPath();ctx.arc(160,104,14,0,Math.PI*2);ctx.stroke();} // head
    if(wrong>1){ctx.beginPath();ctx.moveTo(160,118);ctx.lineTo(160,175);ctx.stroke();} // body
    if(wrong>2){ctx.beginPath();ctx.moveTo(160,130);ctx.lineTo(135,158);ctx.stroke();} // left arm
    if(wrong>3){ctx.beginPath();ctx.moveTo(160,130);ctx.lineTo(185,158);ctx.stroke();} // right arm
    if(wrong>4){ctx.beginPath();ctx.moveTo(160,175);ctx.lineTo(135,210);ctx.stroke();} // left leg
    if(wrong>5){ctx.beginPath();ctx.moveTo(160,175);ctx.lineTo(185,210);ctx.stroke();} // right leg
    // Word
    const wlen=word.length,cw=Math.min(24,Math.floor(240/wlen)),wx=(GW-(wlen*cw))/2;
    word.split('').forEach((ch,i)=>{
      const x=wx+i*cw;
      ctx.strokeStyle='#2A3A50';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+2,250);ctx.lineTo(x+cw-4,250);ctx.stroke();
      if(guessed.has(ch)||won()||lost()){ctx.fillStyle=won()?'#1FCC7C':'#E2E8F0';ctx.font=`bold ${Math.min(18,cw-2)}px monospace`;ctx.textAlign='center';ctx.fillText(ch,x+cw/2,244);}
    });
    // Wrong guesses
    ctx.fillStyle='#8B95A5';ctx.font='10px monospace';ctx.textAlign='center';
    const wrongs=[...guessed].filter(c=>!word.includes(c));
    ctx.fillText('Wrong: '+wrongs.join(' '),GW/2,270);
    ctx.fillStyle='#FF4757';ctx.font='bold 10px monospace';ctx.fillText(wrong+'/'+maxWrong+' wrong',GW/2,284);
    // Keyboard
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((ch,i)=>{
      const row=Math.floor(i/9),col=i%9;
      const kx=10+col*32,ky=296+row*28;
      const isGuessed=guessed.has(ch);
      ctx.fillStyle=isGuessed?(word.includes(ch)?'rgba(31,204,124,.3)':'rgba(255,71,87,.25)'):'rgba(255,255,255,.08)';
      ctx.fillRect(kx,ky,28,22);
      ctx.fillStyle=isGuessed?(word.includes(ch)?'#1FCC7C':'#FF4757'):'#E2E8F0';
      ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(ch,kx+14,ky+15);
    });
    if(won()||lost()){
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,GW,GH);
      ctx.fillStyle=won()?'#1FCC7C':'#FF4757';ctx.font='bold 20px monospace';ctx.textAlign='center';
      ctx.fillText(won()?'YOU WIN!':'GAME OVER',GW/2,GH/2-20);
      ctx.fillStyle='#E2E8F0';ctx.font='12px monospace';ctx.fillText('Word: '+word,GW/2,GH/2+4);
      ctx.fillStyle='#8B95A5';ctx.fillText('R restart · Esc menu',GW/2,GH/2+24);
    }
  }
  rst();
  cv.addEventListener('click',e=>{
    if(won()||lost()){rst();return;}
    const rect=cv.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((ch,i)=>{
      const row=Math.floor(i/9),col=i%9;
      const kx=10+col*32,ky=296+row*28;
      if(cx>=kx&&cx<=kx+28&&cy>=ky&&cy<=ky+22)guess(ch);
    });
  });
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){e.preventDefault();goBack();return;}
    if(e.key==='r'||e.key==='R'){rst();return;}
    if(won()||lost())return;
    const ch=e.key.toUpperCase();if(/^[A-Z]$/.test(ch)){e.preventDefault();guess(ch);}
  };
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   MINESWEEPER
═══════════════════════════════════════════════════════════ */
function buildMines(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  // [cols, rows, mines]
  const CFG=[[9,9,10],[12,10,20],[16,10,40]][d];
  const[COLS,ROWS,MINES]=CFG,dlbl=['BEGINNER','INTERMEDIATE','EXPERT'][d];
  const CS=Math.floor(290/COLS),OX=(GW-COLS*CS)/2,OY=42;
  const[cv,ctx]=mkCv(v,'Minesweeper — '+dlbl);
  let grid,revealed,flagged,mines,started,dead,won,remaining,t=0,tid=null;
  function rst(){
    grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    mines=new Set();started=false;dead=false;won=false;t=0;remaining=ROWS*COLS-MINES;
    if(tid){clearInterval(tid);tid=null;}draw();
  }
  function initMines(sr,sc){
    while(mines.size<MINES){const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);if(!(r===sr&&c===sc))mines.add(r+','+c);}
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(mines.has(r+','+c)){grid[r][c]=-1;continue;}let n=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&mines.has(nr+','+nc))n++;}grid[r][c]=n;}
    started=true;tid=setInterval(()=>{if(!xg)return;t++;draw();},1000);
  }
  function reveal(r,c){
    if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c])return;
    revealed[r][c]=true;remaining--;
    if(grid[r][c]===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc);}
  }
  function click(r,c,flag){
    if(dead||won)return;
    if(flag){if(!revealed[r][c])flagged[r][c]=!flagged[r][c];draw();return;}
    if(flagged[r][c])return;
    if(!started)initMines(r,c);
    if(mines.has(r+','+c)){dead=true;revealed[r][c]=true;if(tid){clearInterval(tid);tid=null;}draw();return;}
    reveal(r,c);if(remaining<=0){won=true;if(tid){clearInterval(tid);tid=null;}}draw();
  }
  const NCOLS=['','#2DA8FF','#1FCC7C','#FF4757','#0000FF','#800000','#008080','#000','#888'];
  function draw(){
    ctx.fillStyle='#0B0F18';ctx.fillRect(0,0,GW,GH);
    // Header
    ctx.fillStyle='#FF4757';ctx.font='bold 12px monospace';ctx.textAlign='left';
    ctx.fillText('💣 '+(MINES-[...flagged].flat().filter(Boolean).length),8,22);
    ctx.fillStyle='#1FCC7C';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(dlbl,GW/2,22);
    ctx.fillStyle='#2DA8FF';ctx.textAlign='right';ctx.fillText('⏱ '+t+'s',GW-8,22);
    // Grid
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const x=OX+c*CS,y=OY+r*CS;
      if(revealed[r][c]){
        ctx.fillStyle=dead&&mines.has(r+','+c)&&revealed[r][c]?'#FF4757':'#1A2438';ctx.fillRect(x,y,CS-1,CS-1);
        if(grid[r][c]===-1){ctx.fillStyle='#0B0F18';ctx.font=`bold ${CS-4}px serif`;ctx.textAlign='center';ctx.fillText('💣',x+CS/2,y+CS-2);}
        else if(grid[r][c]>0){ctx.fillStyle=NCOLS[grid[r][c]];ctx.font=`bold ${Math.floor(CS*.55)}px monospace`;ctx.textAlign='center';ctx.fillText(grid[r][c],x+CS/2,y+CS/2+Math.floor(CS*.2));}
      } else {
        ctx.fillStyle='#2A3A50';ctx.fillRect(x,y,CS-1,CS-1);
        ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x,y,CS-1,2);ctx.fillRect(x,y,2,CS-1);
        ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x,y+CS-3,CS-1,2);ctx.fillRect(x+CS-3,y,2,CS-1);
        if(flagged[r][c]){ctx.font=`${Math.floor(CS*.6)}px serif`;ctx.textAlign='center';ctx.fillText('🚩',x+CS/2,y+CS-3);}
      }
    }
    if(won||dead){
      ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,GW,GH);
      ctx.fillStyle=won?'#1FCC7C':'#FF4757';ctx.font='bold 18px monospace';ctx.textAlign='center';
      ctx.fillText(won?'YOU WIN! 🎉':'BOOM! 💥',GW/2,GH/2-16);
      ctx.fillStyle='#E2E8F0';ctx.font='11px monospace';ctx.fillText('Time: '+t+'s',GW/2,GH/2+4);
      ctx.fillStyle='#8B95A5';ctx.fillText('R restart · Esc menu',GW/2,GH/2+22);
    }
  }
  rst();
  let rightHeld=false;
  cv.addEventListener('contextmenu',e=>{e.preventDefault();});
  cv.addEventListener('mousedown',e=>{
    if(e.button===2)rightHeld=true;
  });
  cv.addEventListener('mouseup',e=>{
    if(dead||won){rst();return;}
    const rect=cv.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    const col=Math.floor((cx-OX)/CS),row=Math.floor((cy-OY)/CS);
    if(row>=0&&row<ROWS&&col>=0&&col<COLS){
      if(e.button===2||rightHeld){click(row,col,true);rightHeld=false;}
      else click(row,col,false);
    }
  });
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){e.preventDefault();if(tid)clearInterval(tid);goBack();}
    if(e.key==='r'||e.key==='R')rst();
  };
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   SIMON SAYS
═══════════════════════════════════════════════════════════ */
function buildSimon(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const dlbl=['EASY','NORMAL','HARD'][d];
  const flashMs=[800,500,300][d],pauseMs=[500,300,200][d];
  const BTNS=[
    {col:'#FF4757',lit:'#FF8F98',label:'RED',key:'ArrowLeft',x:10,y:70,w:130,h:130},
    {col:'#2DA8FF',lit:'#80CCFF',label:'BLUE',key:'ArrowRight',x:160,y:70,w:130,h:130},
    {col:'#1FCC7C',lit:'#7EEFC0',label:'GREEN',key:'ArrowUp',x:10,y:210,w:130,h:130},
    {col:'#FFD93D',lit:'#FFE980',label:'YELLOW',key:'ArrowDown',x:160,y:210,w:130,h:130},
  ];
  const[cv,ctx]=mkCv(v,'Simon Says — '+dlbl);
  let seq=[],step2,lit=-1,showing,waiting,score;
  function rst(){seq=[];step2=0;lit=-1;showing=false;waiting=false;score=0;draw();setTimeout(addStep,600);}
  function addStep(){seq.push(Math.floor(Math.random()*4));step2=0;showSeq();}
  function showSeq(){showing=true;waiting=false;let i=0;
    function flash(){if(!xg)return;if(i>=seq.length){showing=false;waiting=true;lit=-1;draw();return;}
      lit=seq[i];draw();setTimeout(()=>{lit=-1;draw();setTimeout(()=>{i++;flash();},pauseMs);},flashMs);}
    flash();}
  function press(idx){if(!waiting||showing)return;if(idx===seq[step2]){
    lit=idx;draw();setTimeout(()=>{if(!xg)return;lit=-1;draw();},200);
    step2++;if(step2===seq.length){score=seq.length;waiting=false;setTimeout(()=>{if(!xg)return;addStep();},600);}
  } else {waiting=false;showing=false;draw();}}
  function draw(){
    ctx.fillStyle='#0B0F18';ctx.fillRect(0,0,GW,GH);
    ctx.fillStyle='#E2E8F0';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('SIMON SAYS',GW/2,28);
    ctx.fillStyle='#1FCC7C';ctx.font='bold 14px monospace';ctx.fillText('Level: '+seq.length,GW/2,46);
    BTNS.forEach((b,i)=>{
      const isLit=lit===i;
      ctx.fillStyle=isLit?b.lit:b.col;
      ctx.beginPath();ctx.roundRect?ctx.roundRect(b.x,b.y,b.w,b.h,12):ctx.rect(b.x,b.y,b.w,b.h);ctx.fill();
      ctx.fillStyle=isLit?'rgba(255,255,255,.9)':'rgba(0,0,0,.45)';
      ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+5);
      // Key hint
      const km={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓'}[b.key];
      ctx.fillStyle=isLit?'rgba(255,255,255,.7)':'rgba(0,0,0,.3)';ctx.font='10px monospace';
      ctx.fillText(km,b.x+b.w/2,b.y+b.h-12);
    });
    const stmsg=showing?'Watch the sequence…':waiting?'Your turn! Repeat it.':'';
    ctx.fillStyle='#8B95A5';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(stmsg,GW/2,356);
    if(!waiting&&!showing&&seq.length>0){
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,GW,GH);
      const won=score>0;ctx.fillStyle=won?'#FF4757':'#E2E8F0';
      ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText('WRONG!',GW/2,GH/2-20);
      ctx.fillStyle='#1FCC7C';ctx.font='bold 14px monospace';ctx.fillText('Score: '+score,GW/2,GH/2+4);
      ctx.fillStyle='#8B95A5';ctx.font='11px monospace';ctx.fillText('R restart · Esc menu',GW/2,GH/2+24);
    }
  }
  rst();
  cv.addEventListener('click',e=>{
    if(!waiting&&!showing&&seq.length>0){rst();return;}
    const rect=cv.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    BTNS.forEach((b,i)=>{if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h)press(i);});
  });
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){e.preventDefault();goBack();return;}
    if(e.key==='r'||e.key==='R'){rst();return;}
    const idx=BTNS.findIndex(b=>b.key===e.key);
    if(idx>=0){e.preventDefault();press(idx);}
  };
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   TIC-TAC-TOE
═══════════════════════════════════════════════════════════ */
function buildTTT(v,cur){
  const d=cur&&cur.diff!=null?cur.diff:1;
  const dlbl=['EASY','MEDIUM','HARD'][d];
  const[cv,ctx]=mkCv(v,'Tic-Tac-Toe — '+dlbl);
  let board,xTurn,status; // status: ''|'X'|'O'|'draw'
  const SZ=3,CS=70,OX=(GW-SZ*CS)/2,OY=60;
  function rst(){board=Array(9).fill('');xTurn=true;status='';}
  function wins(b,p){const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return W.some(([a,b2,c])=>b[a]===p&&b[b2]===p&&b[c]===p);}
  function full(b){return b.every(c=>c);}
  // Minimax for Hard
  function mmx(b,isX){
    if(wins(b,'X'))return 10;if(wins(b,'O'))return -10;if(full(b))return 0;
    const scores=b.map((_,i)=>{if(b[i])return null;const nb=[...b];nb[i]=isX?'X':'O';return mmx(nb,!isX);}).filter(s=>s!==null);
    return isX?Math.max(...scores):Math.min(...scores);
  }
  function aiMove(){
    if(status||xTurn)return;
    let idx;
    if(d===0){// random
      const empty=board.map((_,i)=>i).filter(i=>!board[i]);idx=empty[Math.floor(Math.random()*empty.length)];
    } else if(d===1){// block wins first
      // Try to win
      for(let i=0;i<9;i++){if(!board[i]){const t=[...board];t[i]='O';if(wins(t,'O')){idx=i;break;}}}
      // Block player
      if(idx==null)for(let i=0;i<9;i++){if(!board[i]){const t=[...board];t[i]='X';if(wins(t,'X')){idx=i;break;}}}
      // Center then random
      if(idx==null){const empty=board.map((_,i)=>i).filter(i=>!board[i]);idx=empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)];}
    } else {// minimax
      let best=Infinity,bestIdx=0;
      board.forEach((_,i)=>{if(board[i])return;const nb=[...board];nb[i]='O';const s=mmx(nb,true);if(s<best){best=s;bestIdx=i;}});
      idx=bestIdx;
    }
    if(idx!=null){board[idx]='O';checkEnd();}
    draw();
  }
  function checkEnd(){if(wins(board,'X'))status='X';else if(wins(board,'O'))status='O';else if(full(board))status='draw';}
  function click(i){if(status||!xTurn||board[i])return;board[i]='X';xTurn=false;checkEnd();draw();if(!status)setTimeout(aiMove,250);}
  function draw(){
    ctx.fillStyle='#0B0F18';ctx.fillRect(0,0,GW,GH);
    // Title
    ctx.fillStyle='#8B95A5';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(status?'':xTurn?'Your turn (X)':'AI thinking…',GW/2,28);
    // Grid
    ctx.strokeStyle='#1E2B3F';ctx.lineWidth=3;
    [1,2].forEach(i=>{
      ctx.beginPath();ctx.moveTo(OX+i*CS,OY);ctx.lineTo(OX+i*CS,OY+SZ*CS);ctx.stroke();
      ctx.beginPath();ctx.moveTo(OX,OY+i*CS);ctx.lineTo(OX+SZ*CS,OY+i*CS);ctx.stroke();
    });
    // Pieces
    board.forEach((p,i)=>{
      if(!p)return;
      const cx=OX+(i%3)*CS+CS/2,cy=OY+Math.floor(i/3)*CS+CS/2;
      if(p==='X'){
        ctx.strokeStyle='#2DA8FF';ctx.lineWidth=4;
        const off=CS*.28;
        ctx.beginPath();ctx.moveTo(cx-off,cy-off);ctx.lineTo(cx+off,cy+off);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+off,cy-off);ctx.lineTo(cx-off,cy+off);ctx.stroke();
      } else {
        ctx.strokeStyle='#FF4757';ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(cx,cy,CS*.28,0,Math.PI*2);ctx.stroke();
      }
    });
    // Highlight winning line
    const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    if(status==='X'||status==='O'){
      const wl=W.find(([a,b2,c])=>board[a]===status&&board[b2]===status&&board[c]===status);
      if(wl){
        const[a,,c]=wl;
        const ax=OX+(a%3)*CS+CS/2,ay=OY+Math.floor(a/3)*CS+CS/2;
        const bx2=OX+(c%3)*CS+CS/2,by2=OY+Math.floor(c/3)*CS+CS/2;
        ctx.strokeStyle=status==='X'?'#2DA8FF':'#FF4757';ctx.lineWidth=4;ctx.globalAlpha=.5;
        ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx2,by2);ctx.stroke();ctx.globalAlpha=1;
      }
    }
    // Overlay
    if(status){
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,GW,GH);
      const msg=status==='draw'?'DRAW!':(status==='X'?'YOU WIN!':'AI WINS!');
      ctx.fillStyle=status==='draw'?'#FFD93D':(status==='X'?'#1FCC7C':'#FF4757');
      ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText(msg,GW/2,GH/2-12);
      ctx.fillStyle='#8B95A5';ctx.font='11px monospace';ctx.fillText('R restart · Esc menu',GW/2,GH/2+10);
    }
    // Hint
    ctx.fillStyle='#1E2B3F';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText('Click to place X · AI plays O · R restart',GW/2,OY+SZ*CS+20);
  }
  rst();draw();
  cv.addEventListener('click',e=>{
    if(status){rst();draw();return;}
    const rect=cv.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(GW/rect.width),cy=(e.clientY-rect.top)*(GH/rect.height);
    const col=Math.floor((cx-OX)/CS),row=Math.floor((cy-OY)/CS);
    if(col>=0&&col<SZ&&row>=0&&row<SZ)click(row*SZ+col);
  });
  xg={raf:null,iid:null};
  xg.kdown=e=>{
    if(e.key==='Escape'){e.preventDefault();goBack();}
    if(e.key==='r'||e.key==='R'){rst();draw();}
  };
  document.addEventListener('keydown',xg.kdown);
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function pushItem(it){
  stack[stack.length-1]._sel=menuSel;menuSel=0;
  if(it.hasDiff&&it.gameKey){
    // Show difficulty selection screen
    stack.push({type:'diff',gameKey:it.gameKey,_ds:1});
    render();return;
  }
  if(it.gameKey&&!it.hasDiff){stack.push({type:it.gameKey,diff:1});render();return;}
  const gameTypes=['snake','tetris','pong-ai','pong-2p','chess-ai','chess-2p','flappy','hotspot','info','breakout','g2048','ttt','simon','mines','hangman','invaders','c4','mole','memory','asteroids','frogger','galaga','centipede','lunar','sokoban','lightsout'];
  if(it.type&&gameTypes.includes(it.type))stack.push({...it});
  else if(it.menu)stack.push({...it.menu,_sel:0});
  else stack.push({type:'info',ico:it.icon||'⚙️',title:it.label,body:'Requires physical hardware on the Pi.',badge:'Hardware only'});
  render();
}
function goBack(){if(stack.length>1){stack.pop();menuSel=stack[stack.length-1]._sel||0;render();}}

/* ═══════════════════════════════════════════════════════════
   SIDE BUTTONS
═══════════════════════════════════════════════════════════ */
function sKey(k){
  if(sg){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const d=m[k];if(d&&(d.x!==-sg.dir.x||d.y!==-sg.dir.y))sg.nd=d;}
  else if(tg&&tg.kdown){const m={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',select:' '};if(m[k])tg.kdown({key:m[k],preventDefault:()=>{}});}
  else if(pg){if(k==='up')pg.keys.w=true;if(k==='down')pg.keys.s=true;if(k==='select')setTimeout(()=>{if(pg){delete pg.keys.w;delete pg.keys.s;}},200);}
  else if(fg&&k==='select'){if(fg.kdown)fg.kdown({key:' ',preventDefault:()=>{}});}
  else{const cur=stack[stack.length-1];const items=cur.items||[];if(!items.length)return;if(k==='up'){menuSel=Math.max(0,menuSel-1);render();}if(k==='down'){menuSel=Math.min(items.length-1,menuSel+1);render();}if(k==='select')pushItem(items[menuSel]);}
}

/* ═══════════════════════════════════════════════════════════
   KEYBOARD  (menus only — games attach their own listeners)
═══════════════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(sg||tg||pg||fg||cg)return;
  const cur=stack[stack.length-1],items=cur.items||[];
  if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();menuSel=Math.max(0,menuSel-1);render();}
  else if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();menuSel=Math.min(items.length-1,menuSel+1);render();}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(items[menuSel])pushItem(items[menuSel]);}
  else if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();goBack();}
});

/* ═══════════════════════════════════════════════════════════
   CLOCK  +  WIDGET UPDATER
═══════════════════════════════════════════════════════════ */
function tick(){
  const n=new Date(),el=document.getElementById('clk');
  if(el)el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const wt=document.getElementById('w-time');
  if(wt)wt.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  // Slowly drain battery for realism
  if(Math.random()<.01&&dev.bat>5)dev.bat--;
  const wh=document.getElementById('w-hs');if(wh){wh.textContent=hotspotOn?'🌐 Hotspot ON':'🌐 Hotspot OFF';wh.className='w-badge'+(hotspotOn?' on':'');}
  const bf=document.getElementById('w-bat-fill');if(bf){const c=dev.bat>30?'var(--acc)':'var(--dan)';bf.style.width=Math.round(dev.bat*32/100)+'px';bf.style.background=c;}
}
tick();setInterval(tick,8000);

render();
</script>
