<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Robot Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="status" class="disconnected">connecting…</div>

  <div id="overlay">
    <h1>Robot Control</h1>
    <p>Click anywhere to lock your mouse and start driving.</p>
    <button id="start">Click to control</button>
  </div>

  <div id="hud">
    <div class="keys">
      <div class="key" data-key="w">W</div>
      <div class="row">
        <div class="key" data-key="a">A</div>
        <div class="key" data-key="s">S</div>
        <div class="key" data-key="d">D</div>
      </div>
    </div>
    <div class="claw">
      <div class="key" data-key="ArrowUp">&#8593; close claw</div>
      <div class="key" data-key="ArrowDown">&#8595; open claw</div>
    </div>
    <div class="help">
      WASD drive &middot; mouse rotates + raises/lowers the arm &middot; Esc releases the mouse
    </div>
  </div>

  <script src="control.js"></script>
</body>
</html>
